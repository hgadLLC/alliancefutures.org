in Port Vila. Attending guests who delivered remarks included Counselor Chen Zongwei of the Chinese Embassy in Vanuatu, Acting Secretary Jean Yves Bibi of the Public Services Commission of Vanuatu, and Liu Kefei, Dean of the School of Education and Training of Henan University of Technology. Forty participants from 15 departments — including the Office of the State House, the Prime Minister’s Office, Parliament, Ministry of Foreign Affairs participated. // Counselor Chen noted since the establishment of diplomatic relations over the past 44 years, China and Vanuatu have stood together through mutual support. He emphasized that China adheres to the principle of “not only giving a man a fish, but also teaching him how to fish”, by deepening cooperation in human resource development, sharing China's development experience, and enhancing Vanuatu's capacity and resilience to respond to natural disasters and climate change. He expressed the hope that the participants would strengthen their professional knowledge and skills, improve their capacity to operate and maintain China-invested and constructed projects, and ultimately contribute to the well-being of the people of Vanuatu. // Mr. Bibi expressed his appreciation for China's long-standing assistance in infrastructure development and human resource capacity building. He noted that the training program would play an important role in extending the service life of public infrastructure and improving the quality of public services in Vanuatu. // During the opening ceremony, the Chinese side donated a batch of engineering inspection and maintenance equipment to the Vanuatu side.","Counsellor unspecified","Chen Zongwei","Development","Host Country Seminar","Port Vila","Shefa","Ministry / Government Department","Jane Yves Bibi","N/A","N/A","N/A","N/A","",""],["9084","Vanuatu","Port Vila","Local Media","https://www.facebook.com/share/p/14icavhbr2n/","8/13/26","8/10/26","8/10/26","Agreement to advance port vila road project","Vanuatu and China have signed an agreement to move forward with a professional site inspection for a major China-funded road upgrade project expected to improve 19 roads across Port Vila. // The Minutes of Discussion for the Professional Site Inspection on the China-Aid Project of the Upgrading and Sealing of Roads in Port Vila were signed on Monday, 10 August 2026, marking the completion of a one-month overseas mission by a Chinese professional team. // Director General (DG) of the Ministry of Infrastructure and Public Utilities (MIPU), Henry Worek, and Counsellor Dr Chen Zongwei of the Chinese Embassy in Vanuatu attended the signing ceremony and delivered remarks. // DG Worek welcomed the progress, describing the project as an important example of the longstanding friendship and cooperation between Vanuatu and China. // He said the road project is centred on improving people’s livelihoods and is expected to benefit tens of thousands of households across Port Vila. // According to Mr. Worek, the project will contribute to improving the city’s appearance, people’s quality of life and the overall functionality of Vanuatu’s capital. // “Vanuatu highly values its friendly and cooperative ties with China,” he said, adding that the government would provide the necessary local coordination and support to ensure the project is implemented and completed as soon as possible. // The China-Aid project will comprehensively upgrade and seal 19 urban roads covering a total length of 12.29 kilometres. // The works are intended to address some of Port Vila’s major road problems, including damaged road surfaces, deteriorating road foundations, inadequate drainage and a lack of traffic facilities. // Counsellor Chen said infrastructure connectivity remains a key priority under China-Vanuatu cooperation and the Belt and Road Initiative. // He said projects that directly improve people’s lives serve as an important bridge of friendship between the two countries. // China Electronic Engineering Design Institute (CEEDI), which is responsible for project management, dispatched a professional team to Vanuatu for a month-long comprehensive site inspection. // The inspection assessed the road conditions and provided technical information that will guide the project’s implementation. // Counsellor Chen said the Chinese side would use the findings to ensure the project is delivered to high standards, with strong emphasis on quality, safety and resilience. // The road upgrade is expected to strengthen Port Vila’s road network and traffic capacity while providing a stronger infrastructure foundation for the capital’s future economic and social development. // The signing of the Minutes of Discussion now provides a key technical and administrative step towards bringing the long-awaited road upgrade project to fruition.","Counsellor unspecified","Chen Zongwei","Development","Agreement / MOU","Port Vila","Shefa","Ministry / Government Department","Henry Worek","N/A","N/A","N/A","N/A","",""],["9085","Vanuatu","Port Vila","Facebook","https://www.facebook.com/share/p/1Jp36ja6d7/","8/14/26","8/14/26","8/14/26","Drone donation for police","On August 14, 2026, Chinese Embassy handed over donated drones to Vanuatu Correctional Services in Port Vila, thereafter a drone operation training deviled to ten Correctional officers from Port Vila as well as Santo and Tanna island by the Chinese Police Expert Team. // The donated drones will be deployed for aerial patrols over correctional farms, enabling real-time, full-coverage aerial surveillance and enhancing three-dimensional dynamic management capabilities. This donation represents another significant outcome of practical judicial cooperation between China and Vanuatu.","China police team","Unknown","Policing","Donation w/ Ceremony","Port Vila","Shefa","Police Department","Unspecified","Unknown","Unknown","N/A","N/A","",""],["9086","Vanuatu","Port Vila","Other Facebook","https://www.facebook.com/share/p/19MZwTH9Xi/","8/  the event, videos introducing study in China, mobile payment and other topics were screened. Representatives of previous Ni-Van scholarship recipients shared their experiences of studying and living in China and answered questions from the participants.","Ambassador","Li Minggang","Education","Embassy Event","Port Vila","Shefa","Ministry / Government Department","Simil Johnson","N/A","N/A","N/A","N/A","",""],["9090","Vanuatu","Port Vila","Facebook","https://www.facebook.com/share/p/1Gz2eAKKt6/","8/19/26","8/14/26","8/14/26","Clinic in Santo","China Medical Team conducted Medical Outreach in Santo! // From August 11 to 14, 2026, the China Medical Team conducted a medical outreach in Santo. The team provided free medical services to more than 150 people for local communities including the Chapuis and Port Olry, and donated medical supplies to Northern Provincial Hospital. // Focusing on common health problems in the local population, including chronic diseases, musculoskeletal and joint pain, and dental conditions, the team conducted individual consultations based on each patient’s needs and medical history. Commonly used medications were also distributed free of charge.","Medical Teams","N/A","Healthcare","Healthcare provision","Sanma","Espiritu Santo","Hospital","N/A","N/A","N/A","N/A","N/A","",""],["9091","Vanuatu","Port Vila","Local Gov Social Media","https://www.dailypost.vu/news/vanuatu-targets-chinese-investors-through-vfipa-mission/article_737c07db-2edd-5424-a036-5647ba05605d.html?fbclid=IwY2xjawT8F8lwZG9mAWV4dG4DYWVtAjEwAGJyaWQRMXRtTHR3Zk55ekRIYkoxQ1RzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEe9p825d_1utr_187bKYCM2YQKFsiSzfy6O0y3mPMpdNmpOsqLy1LxTvQxAeI_aem_FuNpIjSQjPQBqe4tmFcguA","8/22/26","Unspecified","8/22/26","Business delegation to China","The Vanuatu Foreign Investment Promotion Agency (VFIPA) has completed a 10-day business mission to Beijing and Qingdao, China, aimed at promoting Vanuatu as an investment destination and strengthening economic ties with Chinese businesses and investors. // According to a statement from VFIPA, the delegation was led by VFIPA Chief Executive Officer Raymond Vuti and held meetings with Chinese businesses, investors, industry associations, government representatives and strategic partners in both cities. // The mission focused on investment opportunities under Vanuatu's Investment Promotion Strategy (IPS) 2026–2030, with VFIPA presenting the country's investment framework, priority sectors and support services available to prospective investors. // VFIPA said the mission generated encouraging interest from several Chinese companies looking to explore investment opportunities in Vanuatu. // Some businesses expressed interest in continuing discussions with VFIPA, conducting further due diligence and exploring potential partnerships and investment projects. // The agency said these engagements have created a pipeline of investment leads that it will continue to follow up through its investment promotion and investor aftercare services. // The mission also included the Vanuatu Investment Forum in Beijing, co-hosted by the Life Cycle Green & Technical Committee of the China International Association for Promotion of Science and Technology. // VFIPA said the forum provided an opportunity to promote Vanuatu's investment opportunities, engage directly with Chinese businesses and strengthen economic cooperation between Vanuatu and China. // The delegation also strengthened existing partnerships and established new connections with organisations involved in promoting trade, investment and economic cooperation. // VFIPA acknowledged the support of Pacific Trade Invest (PTI) China, particularly Trade Commissioner Mona Mato, Head of Investments Jane Ma and the PTI China team, for assisting with the organisation of the mission and facilitating meetings with investors and key stakeholders. // The agency also recognised the support of the Ministry of Trade and Commerce, Vanuatu, for its continued leadership in promoting trade and investment. // In Qingdao, VFIPA thanked Max Jia, an independent investor with business interests in the Pacific Islands and Chairman of Hainan Ziran Culture Media Co. Ltd, for helping coordinate the delegation's programme and connecting the team with local stakeholders. // VFIPA said it will now work with PTI China and other strategic partners to maintain contact with companies that expressed interest during the mission. // The agency will follow up on investment enquiries and provide support to prospective investors from initial enquiries and due diligence through to project establishment and long-term aftercare. // VFIPA said its goal is to convert the interest generated during the mission into quality investment projects that can contribute to sustainable economic growth, employment creation, private sector development and long-term prosperity for Vanuatu.","In China Officials","Multiple","Corporate/Commercial Diplomacy","Delegation to China","Beijing","Beijing","Civil Society / NGO","Raymond Vuti","N/A","N/A","N/A","N/A","",""],["9092","Vanuatu","Port Vila","Chinese Language Official Website","https://vu.china-embassy.gov.cn/eng/zwgx_0/sbwl/202608/t20260827_12011629.htm","8/27/26","8/27/26","8/27/26","Meeting with foreign affairs ministry","(Claude translation) On August 27, 2026, the Embassy in Vanuatu held quarterly working consultations with the Vanuatu Ministry of Foreign Affairs. Ambassador Li Minggang, Counsellor Gu Zihua, Counsellor Chen Zongwei, as well as Vanuatu Ministry of Foreign Affairs Director General Rantes, Director of Foreign Affairs Basil, and Director of External Trade Pakoa attended. // Ambassador Li stated that since the beginning of this year, through the joint efforts of both sides, China-Vanuatu relations have on the whole maintained a momentum of development; facing the new situation, China and Vanuatu should continue to enhance mutual trust and build consensus, support each other on issues involving one a <script>
 
const PRC_CODES = new Set(['PRC', 'CHN', 'CN']); 
const REFRESH_SECONDS = 120;
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/[\s_\-]+/g, '');
const clean = v => { const s = String(v == null ? '' : v).trim(); return /^(n\/a|na|unknown|unspecified|none|#n\/a|#ref!|#value!|#error!)$/i.test(s) ? '' : s; };
const cleanId = v => String(v == null ? '' : v).replace(/\.0$/, '').trim();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad2 = n => String(n).padStart(2, '0');
const parseUSD = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
const fmtUSD = n => !n ? '$0' : n >= 1e6 ? '$' + (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + Math.round(n);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = iso => { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return MONTHS[+m - 1] + ' ' + (+d) + ', ' + y; };
const fmtMonth = ym => { if (!ym) return ''; const [y, m] = ym.split('-'); return MONTHS[+m - 1] + ' ' + y.slice(2); };

function toISO(v) {
  const s = clean(v);
  if (!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})\b/);
  if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad2(m[1]) + '-' + pad2(m[2]);
  const d = new Date(s);
  if (!isNaN(d)) return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  return '';
}

function picker(header) {
  const h = header.map(norm);
  const pick = (row, ...names) => {
    for (const n of names) {
      const i = h.indexOf(norm(n));
      if (i !== -1) { const v = clean(row[i]); if (v) return v; }
    }
    return '';
  };
  pick.has = name => h.indexOf(norm(name)) !== -1;
  return pick;
}

function applyTheme(t) {

  document.documentElement.setAttribute('data-theme', t);

}

function build(raw) {
  const issues = [];
  ['master', 'actors', 'eventActors'].forEach(k => { if (raw[k].error) issues.push(raw[k].error); });

  
  const pm = picker(raw.master.header);
  const expected = ['Row_ID', 'Country', 'Date_Clean', 'Summary_Short', 'Functional_Domain', 'Activity_Type', 'Primary_Actor_Name', 'Primary_Local_Counterparty_Name', 'Value_Constant_USD'];
  const missingCols = raw.master.error ? [] : expected.filter(c => !pm.has(c));
  const events = raw.master.rows.map((r, i) => {
    const date = toISO(pm(r, 'Date_Clean')) || toISO(pm(r, 'Date_of_Event_EST')) || toISO(pm(r, 'Date_Posted_EST'));
    return {
      sheetRow: i + 2,
      rowId: cleanId(pm(r, 'Row_ID')) || 'sheet-row-' + (i + 2),
      country: pm(r, 'Country') || 'Unspecified',
      embassy: pm(r, 'Embassy_Location'),
      date, month: date ? date.slice(0, 7) : '',
      summaryShort: pm(r, 'Summary_Short'),
      summaryFull: pm(r, 'Summary_Full'),
      actorType: pm(r, 'Primary_Actor_Type'),
      actorName: pm(r, 'Primary_Actor_Name'),
      domain: pm(r, 'Functional_Domain') || 'Unspecified',
      activity: pm(r, 'Activity_Type') || 'Unspecified',
      location: pm(r, 'Activity_Location'),
      province: pm(r, 'Activity_Location_Province'),
      cpType: pm(r, 'Primary_Local_Counterparty_Type'),
      cpName: pm(r, 'Primary_Local_Counterparty_Name'),
      valueRaw: pm(r, 'Value_or_Monetary_Amount'),
      usd: parseUSD(pm(r, 'Value_Constant_USD')),
      quote: pm(r, 'Embassy_Statement_Quote'),
      notes: pm(r, 'Analyst_Notes'),
      sourcePlatform: pm(r, 'Source_Platform'),
      sourceUrl: pm(r, 'Source_URL'),
      archive: pm(r, 'Archived_Copy_Link'),
      media: pm(r, 'Media_Attached'),
      links: []
    };
  });
  
  
  const rh = raw.master.header.map(norm);
  const rawCol = (r, name) => { const i = rh.indexOf(norm(name)); return i === -1 ? '' : String(r[i] == null ? '' : r[i]).trim(); };
  raw.master.rows.forEach((r, i) => {
    events[i].t = { date: toISO(rawCol(r, 'Date_Clean')), country: rawCol(r, 'Country'), fd: rawCol(r, 'Functional_Domain'),
      at: rawCol(r, 'Activity_Type'), actorType: rawCol(r, 'Primary_Actor_Type'), cpType: rawCol(r, 'Primary_Local_Counterparty_Type') };
  });
  const eventById = new Map();
  const dupEventIds = new Set();
  events.forEach(e => { if (eventById.has(e.rowId)) dupEventIds.add(e.rowId); else eventById.set(e.rowId, e); });

  
  const pa = picker(raw.actors.header);
  
  const ah = raw.actors.header.map(norm);
  const titleCol = ah.findIndex(h => /job|title|position|^role/.test(h) && h !== 'actorid' && h !== 'actortype');
  const actors = [];
  const actorById = new Map();
  const dupActorIds = new Set();
  raw.actors.rows.forEach((r, i) => {
    const id = cleanId(pa(r, 'Actor_ID')).toUpperCase();
    if (!id) return;
    if (actorById.has(id)) { dupActorIds.add(id); return; }
    const a = {
      sheetRow: i + 2,
      id,
      name: pa(r, 'Actor_Name', 'Name', 'Full_Name') || id,
      type: pa(r, 'Actor_Type', 'Type'),
      title: pa(r, 'Role/Job', 'Role_Job', 'Job_Title', 'Job', 'Title', 'Position', 'Role') || (titleCol >= 0 ? clean(r[titleCol]) : ''),
      entity: pa(r, 'Entity_Type') || (id.startsWith('O-') ? 'Organization' : id.startsWith('P-') ? 'Person' : 'Unknown'),
      country: pa(r, 'Country', 'Actor_Country', 'Nationality', 'Affiliation_Country'),
      code: id.split('-')[1] || '',
      org: pa(r, 'Organization', 'Affiliation', 'Parent_Organization', 'Org'),
      notes: pa(r, 'Notes', 'Bio', 'Biography'),
      links: []
    };
    a.isPRC = PRC_CODES.has(a.code) || /^(china|prc|people's republic of china)$/i.test(a.country);
    actors.push(a);
    actorById.set(id, a);
  });
  
  actors.forEach(a => {
    const ref = actorById.get(String(a.org || '').trim().toUpperCase());
    a.orgActor = ref && ref !== a ? ref : null;
    a.orgName = a.orgActor ? a.orgActor.name : a.org;
  });

  
  const pl = picker(raw.eventActors.header);
  const eh = raw.eventActors.header.map(norm);
  const roleCol = eh.findIndex(h => /role|capacity|participation|function/.test(h) && h !== 'actorid');
  const roleColName = roleCol >= 0 ? raw.eventActors.header[roleCol] : '';
  const links = [];
  const seen = new Set();
  const orphanActor = new Set(), orphanEvent = new Set();
  raw.eventActors.rows.forEach(r => {
    const eventId = cleanId(pl(r, 'Row_ID', 'Event_ID', 'Master_Row_ID'));
    const actorId = cleanId(pl(r, 'Actor_ID')).toUpperCase();
    if (!eventId || !actorId) return;
    const key = eventId + '__' + actorId;
    if (seen.has(key)) return;
    seen.add(key);
    const link = { eventId, actorId, role: pl(r, 'Role', 'Actor_Role', 'Event_Role', 'Role_in_Event', 'Participation_Type') || (roleCol >= 0 ? clean(r[roleCol]) : ''), notes: pl(r, 'Notes', 'Comments') };

    if (link.actor) link.actor.links.push(link);
    if (link.event) link.event.links.push(link);
  });

  const geo = buildGeo(raw.locations, events);
  if (raw.locations && raw.locations.error) issues.push(raw.locations.error);

  return { raw, events, actors, links, actorById, eventById, issues, missingCols, geo, roleColName, titleColName: titleCol >= 0 ? raw.actors.header[titleCol] : '',
           orphanActor: [...orphanActor], orphanEvent: [...orphanEvent],
           dupEventIds: [...dupEventIds], dupActorIds: [...dupActorIds],
           undated: events.filter(e => !e.date).length };
}


 
const nk = s => String(s == null ? '' : s).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[ʻʼ‘’`´]/g, "'").toLowerCase().replace(/\s+/g, ' ').trim();
const COUNTRY_ALIAS = { 'papua new guinea': 'png', 'federated states of micronesia': 'fsm', 'micronesia': 'fsm', 'prc': 'china', "people's republic of china": 'china', 'united states': 'usa', 'united states of america': 'usa', 'us': 'usa' };
const ck = s => { const k = nk(s); return COUNTRY_ALIAS[k] || k; };
const NON_PLACE = new Set(['multiple', 'n/a', 'na', 'unknown', 'unspecified', 'none', '—', '-', '']);

const wrapLon = lon => (lon < -30 ? lon + 360 : lon);

function buildGeo(tab, events) {
  const G = { error: '', unresolvedLoc: {}, unresolvedProv: {}, rows: 0 };
  events.forEach(e => { e.geo = null; });
  if (!tab) { G.error = 'Locations tab not returned by the script. Add it to PPEM_TABS in the .gs file.'; return G; }
  if (tab.error) { G.error = tab.error; return G; }
  const p = picker(tab.header);
  const rows = [];
  tab.rows.forEach(r => {
    const lat = parseFloat(p(r, 'Latitude', 'Lat'));
    const lon = parseFloat(p(r, 'Longitude', 'Long', 'Lon', 'Lng'));
    if (isNaN(lat) || isNaN(lon)) return;
    const country = p(r, 'Country'), prov = p(r, 'Activity_Location_Province', 'Acticity_Location_Province', 'Province');
    const loc = p(r, 'Activity_Location', 'Acticity_Location', 'Location');
    rows.push({ country, cKey: ck(country), prov, pKey: nk(prov), loc, lKey: nk(loc), lat, lon: wrapLon(lon) });
  });
  G.rows = rows.length;
  if (!rows.length) { G.error = 'No rows with latitude/longitude found in ' + tab.tab; return G; }

  const locPL = new Map(), locL = new Map(), provRows = new Map(), provExact = new Map(), ctryRows = new Map(), ctryExact = new Map();
  rows.forEach(x => {
    if (x.lKey) {
      const k = x.pKey + '|' + x.lKey;
      if (!locPL.has(k)) locPL.set(k, x);
      if (!locL.has(x.lKey)) locL.set(x.lKey, x);
    }
    if (x.pKey) {
      const k = x.cKey + '|' + x.pKey;
      if (!provRows.has(k)) provRows.set(k, []);
      provRows.get(k).push(x);
      if (x.lKey === x.pKey && !provExact.has(k)) provExact.set(k, x);   
    }
    if (x.cKey) {
      if (!ctryRows.has(x.cKey)) ctryRows.set(x.cKey, []);
      ctryRows.get(x.cKey).push(x);
      if (x.pKey === x.cKey && x.lKey === x.cKey) ctryExact.set(x.cKey, x); 
    }
  });
  const mean = arr => ({ lat: arr.reduce((s, x) => s + x.lat, 0) / arr.length, lon: arr.reduce((s, x) => s + x.lon, 0) / arr.length });
  const provPt = new Map();
  provRows.forEach((arr, k) => { const ex = provExact.get(k); provPt.set(k, Object.assign(ex ? { lat: ex.lat, lon: ex.lon } : mean(arr), { country: arr[0].country, name: arr[0].prov })); });
  const provByName = new Map();
  provPt.forEach((v, k) => { const pk = k.slice(k.indexOf('|') + 1); if (!provByName.has(pk)) provByName.set(pk, []); provByName.get(pk).push(k); });
  const ctryPt = new Map();
  ctryRows.forEach((arr, k) => { const ex = ctryExact.get(k); ctryPt.set(k, Object.assign(ex ? { lat: ex.lat, lon: ex.lon } : mean(arr), { name: arr[0].country })); });

  events.forEach(e => {
    const lk = nk(e.location), pk = nk(e.province);
    let L = null, cKey = '', pKey = null;
    if (!NON_PLACE.has(lk)) {
      L = locPL.get(pk + '|' + lk) || locL.get(lk) || null;
      if (!L) G.unresolvedLoc[e.location] = (G.unresolvedLoc[e.location] || 0) + 1;
    }
    if (L) cKey = L.cKey;
    if (!NON_PLACE.has(pk)) {
      const c = provByName.get(pk) || [];
      pKey = c.find(k => cKey && k.indexOf(cKey + '|') === 0) || c[0] || null;
      if (!pKey) G.unresolvedProv[e.province] = (G.unresolvedProv[e.province] || 0) + 1;
    }
    if (!pKey && L && L.pKey) pKey = L.cKey + '|' + L.pKey;
    const P = pKey ? provPt.get(pKey) || null : null;
    if (!cKey && pKey) cKey = pKey.split('|')[0];
    let fromPost = false;
    if (!cKey) { cKey = ck(e.country); fromPost = true; }
    const C = ctryPt.get(cKey) || null;
    e.geo = { L, P, pKey, C, cKey, fromPost: fromPost && !!C };
  });
  return G;
}

 
const MAP = { tier: 'location', sel: null, t: null, world: null, paths: null, loading: false, err: '', proj: null, agg: null };
const MAP_W = 1000, MAP_H = 620;
const TIER_LABEL = { location: 'Location', province: 'Province', country: 'Country' };

function aggregate(evs, tier) {
  const m = new Map();
  let miss = 0, fromPost = 0;
  evs.forEach(e => {
    const g = e.geo;
    let pt = null, key, name, sub;
    if (g && tier === 'location' && g.L) { pt = g.L; key = pt.lat.toFixed(3) + ',' + pt.lon.toFixed(3); name = pt.loc; sub = [pt.prov, pt.country].filter(Boolean).join(', '); }
    else if (g && tier === 'province' && g.P) { pt = g.P; key = g.pKey; name = pt.name; sub = pt.country; }
    else if (g && tier === 'country' && g.C) { pt = g.C; key = g.cKey; name = pt.name; sub = ''; if (g.fromPost) fromPost++; }
    if (!pt) { miss++; return; }
    if (!m.has(key)) m.set(key, { key, lat: pt.lat, lon: pt.lon, names: [], sub, events: [] });
    const x = m.get(key);
    if (x.names.indexOf(name) === -1) x.names.push(name);
    x.events.push(e);
  });
  const pts = [...m.values()].map(x => Object.assign(x, { name: x.names.join(' / '), count: x.events.length })).sort((a, b) => b.count - a.count);
  return { pts, miss, fromPost, plotted: evs.length - miss };
}

function setTier(t) { MAP.tier = t; MAP.sel = null; render(); }

function fmtLon(lon) { let l = lon > 180 ? lon - 360 : lon; return Math.abs(l).toFixed(2) + (l >= 0 ? 'E' : 'W'); }

function loadWorld() {
  if (MAP.world || MAP.loading) return;
  if (typeof d3 === 'undefined' || typeof topojson === 'undefined') { MAP.err = 'Map libraries did not load. Check that cdn.jsdelivr.net is reachable, then refresh.'; if (tab === 'map') render(); return; }
  MAP.loading = true;
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json').then(r => r.json()).then(topo => {
    MAP.world = { land: topojson.feature(topo, topo.objects.land), borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b) };
    MAP.loading = false;
    if (tab === 'map') render();
  }).catch(err => { MAP.loading = false; MAP.err = 'Could not load the base map: ' + (err && err.message ? err.message : err); if (tab === 'map') render(); });
}

function drawMap() {
  const host = document.getElementById('mapHost');
  if (!host) return;
  if (MAP.err) { host.innerHTML = '<div class="empty">' + esc(MAP.err) + '</div>'; return; }
  if (!MAP.world) { host.innerHTML = '<div class="empty">&gt; LOADING BASE MAP…</div>'; loadWorld(); return; }
  if (!MAP.paths) {
    
    MAP.proj = d3.geoMercator().rotate([-155, 0]).fitExtent([[12, 12], [MAP_W - 12, MAP_H - 12]], { type: 'MultiPoint', coordinates: [[96, 50], [206, -26]] });
    const path = d3.geoPath(MAP.proj);
    MAP.paths = {
      land: path(MAP.world.land),
      borders: path(MAP.world.borders),
      grat: path(d3.geoGraticule().extent([[-180, -75], [180.01, 75.01]]).step([10, 10])())
    };
  }
  const A = MAP.agg;
  const svg = d3.select(host).append('svg').attr('class', 'mapsvg').attr('viewBox', '0 0 ' + MAP_W + ' ' + MAP_H);

  grad.append('stop').attr('offset', '45%').attr('stop-color', acc).attr('stop-opacity', .25);
  grad.append('stop').attr('offset', '100%').attr('stop-color', acc).attr('stop-opacity', 0);
  const g = svg.append('g');

  if (curTheme() === 'stickchart') {
    MAP.rebbelib = MAP.rebbelib || 'data:image/svg+xml,' + encodeURIComponent(rebbelibSVG(.6, false, 'tile'));
    const TW = 1100, TH = 760;
    const pat = svg.select('defs').append('pattern').attr('id', 'rebTile').attr('patternUnits', 'userSpaceOnUse').attr('width', TW * 2).attr('height', TH * 2).attr('x', -50).attr('y', -70);
    
    [[0, 0, 1, 1], [2, 0, -1, 1], [0, 2, 1, -1], [2, 2, -1, -1]].forEach(([tx, ty, sx, sy]) =>
      pat.append('image').attr('href', MAP.rebbelib).attr('width', TW).attr('height', TH).attr('preserveAspectRatio', 'none').attr('transform', 'translate(' + tx * TW + ',' + ty * TH + ') scale(' + sx + ',' + sy + ')'));
    g.append('rect').attr('x', -5000).attr('y', -3000).attr('width', 11000).attr('height', 7000).attr('fill', 'url(#rebTile)');
  }
  g.append('path').attr('class', 'land').attr('d', MAP.paths.land);
  g.append('path').attr('class', 'borders').attr('d', MAP.paths.borders);
  const bub = g.append('g');

  const max = d3.max(A.pts, d => d.count) || 1;
  const rMax = MAP.tier === 'country' ? 34 : MAP.tier === 'province' ? 24 : 18;
  const r = d3.scaleSqrt().domain([0, max]).range([0, rMax]);
  const glow = d3.scaleLinear().domain([1, Math.max(2, max)]).range([.25, 1]).clamp(true);
  const fillOp = d3.scaleLinear().domain([1, Math.max(2, max)]).range([.45, .95]).clamp(true);
  const tip = document.getElementById('tip');

  function drawBubbles(k) {
    bub.selectAll('*').remove();
    A.pts.forEach((d, i) => {
      const xy = MAP.proj([d.lon, d.lat]);
      const rr = Math.max(2.5, r(d.count)) / k;
      const node = bub.append('g').attr('class', 'pt' + (MAP.sel === d.key ? ' sel' : '')).attr('transform', 'translate(' + xy[0] + ',' + xy[1] + ')');
      node.append('g').attr('class', 'halo').append('circle').attr('r', rr * 2.4).attr('fill', 'url(#ppemGlow)').attr('opacity', glow(d.count));
      if (i < 3 && d.count > 1) {
        const ping = node.append('circle').attr('class', 'ping').attr('r', rr);
        ping.append('animate').attr('attributeName', 'r').attr('values', rr + ';' + rr * 2.8).attr('dur', '2.6s').attr('begin', (i * .5) + 's').attr('repeatCount', 'indefinite');
        ping.append('animate').attr('attributeName', 'opacity').attr('values', '.9;0').attr('dur', '2.6s').attr('begin', (i * .5) + 's').attr('repeatCount', 'indefinite');
      }
      node.append('circle').attr('class', 'dot').attr('r', rr).attr('fill-opacity', fillOp(d.count));
      node.append('circle').attr('class', 'core').attr('r', Math.max(.8, rr * .22));
      node.on('mousemove', ev => {
        tip.style.display = 'block';
        tip.innerHTML = '<b>' + esc(d.name) + '</b>' + (d.sub ? '<br><span class="muted">' + esc(d.sub) + '</span>' : '') +

        const x = Math.min(ev.clientX + 14, window.innerWidth - 310);
        tip.style.left = x + 'px'; tip.style.top = (ev.clientY + 14) + 'px';
      }).on('mouseleave', () => { tip.style.display = 'none'; })
        .on('click', ev => { ev.stopPropagation(); tip.style.display = 'none'; selectPlace(d.key); });
    });
  }

  
  const hud = d3.select(host).append('div').attr('class', 'hud').html('TIER <b>' + TIER_LABEL[MAP.tier].toUpperCase() + '</b> · CURSOR <b id="hudPos">—</b>');
  svg.on('mousemove.hud', ev => {

    if (ll) document.getElementById('hudPos').textContent = Math.abs(ll[1]).toFixed(2) + (ll[1] >= 0 ? 'N ' : 'S ') + fmtLon(ll[0]);
  });

  const zoom = d3.zoom().scaleExtent([.35, 60]).translateExtent([[-4000, -2000], [5000, 2600]])
    .on('zoom', ev => { MAP.t = ev.transform; g.attr('transform', ev.transform); drawBubbles(ev.transform.k); });
  svg.call(zoom).on('dblclick.zoom', null);
  if (!MAP.t && currentLayout() !== 'classic' && currentLayout() !== 'sidebar') MAP.t = mapHome();
  if (MAP.t) svg.call(zoom.transform, MAP.t); else drawBubbles(1);

  const ctl = d3.select(host).append('div').attr('class', 'mapctl');
  ctl.append('button').attr('class', 'btn').attr('title', 'Zoom in').text('+').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1.6));
  ctl.append('button').attr('class', 'btn').attr('title', 'Zoom out').text('−').on('click', () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.6));
  ctl.append('button').attr('class', 'btn').attr('title', 'Reset view').text('⌂').on('click', () => svg.transition().duration(350).call(zoom.transform, mapHome()));

  
  if (A.pts.length) {
    const vals = [...new Set([max, Math.max(1, Math.round(max / 4)), 1])];
    const lw = vals.reduce((s, v) => s + Math.max(2.5, r(v)) * 2 + 18, 0);
    const lh = Math.max(2.5, r(max)) * 2 + 16;
    let x = 0, svgL = '<svg width="' + lw + '" height="' + lh + '">';
    vals.forEach(v => {
      const rr = Math.max(2.5, r(v)); x += rr;
      svgL += '<circle cx="' + x + '" cy="' + (lh - 14 - rr) + '" r="' + rr + '" fill-opacity="' + fillOp(v) + '" stroke-width="1"/>' +
        '<text x="' + x + '" y="' + (lh - 2) + '" font-size="10" text-anchor="middle">' + v + '</text>';
      x += rr + 18;
    });
    d3.select(host).append('div').attr('class', 'maplegend').html('EVENTS PER ' + MAP.tier.toUpperCase() + svgL + '</svg>');
  }
}

function aqPartial(s) {
  if (((s.match(/["“”]/g) || []).length) % 2) {
    const i = Math.max(s.lastIndexOf('"'), s.lastIndexOf('“'), s.lastIndexOf('”'));
    return { start: i, text: s.slice(i + 1), quoted: true };
  }
  let start = 0, m;
  const re = /\(|\)|["“”]|&|\||!|(?:^|\s)(?:AND|OR|NOT)(?=\s|$)/g;
  while ((m = re.exec(s))) start = m.index + m[0].length;
  return { start, text: s.slice(start), quoted: false };
}
function aqSuggest(el) {
  const p = aqPartial(el.value.slice(0, el.selectionStart)), t = lc(p.text);
  AQ.part = p; AQ.hi = -1; AQ.sug = [];
  if (t.length >= 2) {
    AQ.sug = DB.actors.map(a => {
      const n = lc(a.name), i = lc(a.id);
      return [n.indexOf(t) === 0 || i.indexOf(t) === 0 ? 0 : n.indexOf(t) !== -1 || i.indexOf(t) !== -1 ? 1 : 2, a];
    }).filter(x => x[0] < 2).sort((x, y) => x[0] - y[0] || y[1].links.length - x[1].links.length).slice(0, 8).map(x => x[1]);
  }
  aqDrawSug();
}
function aqDrawSug() {
  const box = document.getElementById('tblAqSug'); if (!box) return;
  box.hidden = !AQ.sug.length;
  box.innerHTML = AQ.sug.map((a, i) => '<button type="button" class="aq-opt' + (i === AQ.hi ? ' on' : '') + '" data-i="' + i + '"><span>' + esc(a.name) +
    '</span><span class="muted">' + esc(a.id) + ' · ' + a.links.length + ' events</span></button>').join('');
  box.querySelectorAll('.aq-opt').forEach(b => { b.onmousedown = ev => { ev.preventDefault(); aqPick(+b.dataset.i); }; });
}
function aqPick(i) {
  const el = document.getElementById('tblAq'), a = AQ.sug[i], p = AQ.part;
  if (!el || !a || !p) return;
  const s = el.value, caret = el.selectionStart;
  const ins = aqIndex().dupNames.has(lc(a.name)) || /"/.test(a.name) ? a.id : '"' + a.name + '"';
  const before = s.slice(0, p.start), lead = before && !/[\s(]$/.test(before) ? ' ' : '';
  let after = s.slice(caret);
  if (p.quoted && /^["”]/.test(after)) after = after.slice(1);
  const head = before + lead + ins + ' ';
  el.value = head + after.replace(/^\s+/, '');
  el.setSelectionRange(head.length, head.length);
  TBL.aqDraft = el.value; AQ.sug = []; aqDrawSug();
}
function tblAqFocus() { const el = document.activeElement; return el && el.id === 'tblAq' ? [el.selectionStart, el.selectionEnd] : null; }
function tblAqWire(f) {
  const el = document.getElementById('tblAq'); if (!el) return;
  if (f) { el.focus(); try { el.setSelectionRange(f[0], f[1]); } catch (e) {} }
  el.oninput = () => { TBL.aqDraft = el.value; aqSuggest(el); };
  el.onkeydown = ev => {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') {
      if (!AQ.sug.length) return;
      const n = AQ.sug.length;
      AQ.hi = ev.key === 'ArrowDown' ? (AQ.hi + 1 >= n ? -1 : AQ.hi + 1) : (AQ.hi - 1 < -1 ? n - 1 : AQ.hi - 1);

}

 
function filtered() {
  const q = F.q.toLowerCase();
  return DB.events.filter(e => {
    if (F.country !== 'ALL' && e.country !== F.country) return false;
    if (F.domain !== 'ALL' && e.domain !== F.domain) return false;
    if (F.activity !== 'ALL' && e.activity !== F.activity) return false;
    if (F.month !== 'ALL' && e.month !== F.month) return false;
    if (q) {
      const hay = [e.summaryShort, e.summaryFull, e.country, e.actorName, e.cpName, e.location, e.domain, e.activity, e.notes,
        e.links.map(l => l.actor ? l.actor.name : l.actorId).join(' ')].join(' ').toLowerCase();

function prng(seed) { return function () { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const f1 = n => Math.round(n * 10) / 10;

function smoothPath(pts) {
  let d = 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
    d += 'Q' + f1(pts[i][0]) + ' ' + f1(pts[i][1]) + ' ' + f1(mx) + ' ' + f1(my);
  }
  const L = pts[pts.length - 1];
  return d + 'L' + f1(L[0]) + ' ' + f1(L[1]);
}

    return pts;
  });
  const d = st => { const [x1, y1, x2, y2, cx, cy] = st; return 'M' + x1 + ' ' + y1 + (cx == null ? 'L' : 'Q' + cx + ' ' + cy + ' ') + x2 + ' ' + y2; };
  
  const hits = [];
  for (let a = 0; a < lines.length; a++) for (let b = a + 1; b < lines.length; b++) {
    const A = lines[a], B = lines[b];
    for (let i = 0; i < A.length - 1; i++) for (let j = 0; j < B.length - 1; j++) {
      const [p, p2] = [A[i], A[i + 1]], [q, q2] = [B[j], B[j + 1]];
      const rx = p2[0] - p[0], ry = p2[1] - p[1], sx = q2[0] - q[0], sy = q2[1] - q[1], den = rx * sy - ry * sx;
      if (!den) continue;
      const t = ((q[0] - p[0]) * sy - (q[1] - p[1]) * sx) / den, u = ((q[0] - p[0]) * ry - (q[1] - p[1]) * rx) / den;
      if (t < 0 || t > 1 || u < 0 || u > 1) continue;
      const x = p[0] + rx * t, y = p[1] + ry * t;
      if (!hits.some(h => Math.hypot(h[0] - x, h[1] - y) < 14)) hits.push([x, y, Math.atan2(ry, rx)]);
    }
  }
  let out = '<g opacity="' + k + '">';
  REBBELIB_STICKS.forEach(st => { out += '<path d="' + d(st) + '" stroke="#a8743d" stroke-width="12" stroke-linecap="round" fill="none"/>'; });
  REBBELIB_STICKS.forEach(st => { out += '<path d="' + d(st) + '" stroke="#dcb27a" stroke-width="4" stroke-linecap="round" fill="none" opacity=".75"/>'; });
  hits.forEach(([x, y, a]) => {
    const ux = Math.cos(a), uy = Math.sin(a), nx = -uy * 9, ny = ux * 9;
    for (const o of [-4.5, 0, 4.5]) {
      const cx = x + ux * o, cy = y + uy * o;
      out += '<path d="M' + f1(cx - nx) + ' ' + f1(cy - ny) + 'L' + f1(cx + nx) + ' ' + f1(cy + ny) + '" stroke="#4a2e12" stroke-width="2"/>';
    }
  });
  REBBELIB_SHELLS.forEach(([x, y], i) => {
    out += '<g transform="translate(' + x + ' ' + y + ') rotate(' + (i * 47 % 180) + ')"><ellipse rx="10" ry="7.5" fill="#f7f1e2" stroke="#5e3b17" stroke-width="1.5"/>' +
      '<path d="M-6 0L6 0" stroke="#5e3b17" stroke-width="1.5"/></g>';
  });
  out += '</g>';
  
  
  if (mode === 'cover') return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="230 230 1520 1000" preserveAspectRatio="xMidYMid slice">' + out + '</svg>';
  if (mode === 'tile') return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="200 210 1580 1060" preserveAspectRatio="none">' + out + '</svg>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 100 1820 1270" preserveAspectRatio="xMidYMid meet">' +
    (dark ? '<rect x="90" y="100" width="1820" height="1270" fill="#0d0a07"/>' : '') + out + '</svg>';
}

function latticeArt(w, h, seed, color, k, count) {
  const R = prng(seed), rr = (a, b) => a + R() * (b - a);
  const fams = [rr(.35, .6), rr(-.6, -.35), rr(1.1, 1.4), rr(-1.4, -1.1)]; 
  let out = '';
  for (let i = 0; i < count; i++) {
    const a = fams[i % 4] + rr(-.18, .18), cx = rr(-.1, 1.1) * w, cy = rr(-.1, 1.1) * h, len = rr(.6, 1.6) * Math.max(w, h);
    const dx = Math.cos(a) * len / 2, dy = Math.sin(a) * len / 2;
    out += '<path d="M' + f1(cx - dx) + ' ' + f1(cy - dy) + 'L' + f1(cx + dx) + ' ' + f1(cy + dy) + '" stroke="' + color + '" stroke-width="' + f1(i % 5 ? rr(2, 6) : rr(8, 13)) +
      '" stroke-opacity="' + (rr(.05, .14) * k).toFixed(3) + '"/>';
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="xMidYMid slice">' + out + '</svg>';
}

function themeExtras() {
  const t = curTheme(), st = document.documentElement.style, art = THEME_ART[t];
  if (art && !art.cache) art.cache = art.make();
  ['--art-bg', '--art-map', '--art-head'].forEach(k => st.setProperty(k, art && art.cache[k] ? art.cache[k] : 'none'));
  const a = THEME_ABOUT[t];
  document.getElementById('aboutBtn').style.display = a ? '' : 'none';
  document.getElementById('themeFoot').innerHTML = a ? esc(a.title) + ' — ' + esc(a.short) + '<a href="#" onclick="event.preventDefault();openAbout()">About this theme</a>' : '';
}
function openAbout() {
  const a = THEME_ABOUT[curTheme()];
  if (!a) return;
  document.getElementById('modal').innerHTML =
    '<div style="display:flex;justify-content:space-between;gap:10px"><div><span class="tag">' + esc(a.kicker) + '</span><h2>' + esc(a.title) + '</h2></div><button class="btn" onclick="closeModal()">Close</button></div>' +
    (a.figure ? '<figure class="about-fig">' + a.figure() + '<figcaption>' + esc(a.credit || '') + '</figcaption></figure>' : '') +
    a.body.map(p => '<p class="about-p">' + esc(p) + '</p>').join('') +
    '<div class="box"><b>In this theme:</b> ' + esc(a.design) + '</div>';
  document.getElementById('overlay').classList.add('show');
}

applyTheme = function (t) { _applyTheme(t); themeExtras(); if (DB && tab !== 'map') render(); else if (!DB) { applyLabels(); afterRender(); } };
const _applyLayout = applyLayout;

<style>
  .ptable td.dd { cursor: pointer; }
  .ptable td.dd:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .kpi.dd-jump { cursor: pointer; }
  .kpi.dd-jump:hover { outline: 1px solid var(--accent-line); }
  .dd-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .dd-head h3 { margin: 0 !important; }
  .dd-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .dd-tbl td.sum { min-width: 260px; }
</style>
<script>
(function () {
  const DD = { page: 1, sig: '', drill: null, inDrill: false };
  const DD_PAGE = 25;
  const range = n => Array.from({ length: Math.max(0, n) }, (_, i) => i);
  const ddSort = evs => evs.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || String(a.rowId).localeCompare(String(b.rowId)));

   
  function ddTable(evs, fromDrill) {
    return '<table class="dd-tbl"><thead><tr><th>Date</th><th>Row_ID</th><th>Country</th><th>Domain / activity</th><th>PRC actor</th><th>Summary</th></tr></thead><tbody>' +
      evs.map(e => '<tr class="click" onclick="ddOpenEvent(' + esc(JSON.stringify(e.rowId)) + ',' + (fromDrill ? 'true' : 'false') + ')">' +
        '<td style="white-space:nowrap">' + fmtDate(e.date) + '</td>' +
        '<td class="mono">' + esc(e.rowId) + '</td>' +
        '<td>' + esc(e.country) + '</td>' +
        '<td><span class="tag">' + esc(e.domain) + '</span><div class="muted">' + esc(e.activity) + '</div></td>' +
        '<td>' + (esc(e.actorName) || '<span class="muted">—</span>') + '<div class="muted">' + esc(e.actorType) + '</div></td>' +
        '<td class="sum">' + esc(e.summaryShort || e.summaryFull) + '</td></tr>').join('') +
      '</tbody></table>';
  }
  window.ddOpenEvent = function (id, fromDrill) { DD.inDrill = !!fromDrill; openEvent(id); };

   
  function ddActive() { return F.country !== 'ALL' || F.domain !== 'ALL' || F.activity !== 'ALL' || F.month !== 'ALL' || !!F.q.trim(); }
  function ddChips() {
    const c = [];
    if (F.country !== 'ALL') c.push(['Country', F.country]);
    if (F.domain !== 'ALL') c.push(['Domain', F.domain]);
    if (F.activity !== 'ALL') c.push(['Activity', F.activity]);
    if (F.month !== 'ALL') c.push(['Month', fmtMonth(F.month)]);
    if (F.q.trim()) c.push(['Search', '"' + F.q.trim() + '"']);
    return c.map(([k, v]) => '<span class="tag">' + esc(k) + ': ' + esc(v) + '</span>').join('');
  }
  const _viewOverview = viewOverview;
  viewOverview = function () {
    const html = _viewOverview();
    if (!ddActive()) return html;
    const sig = JSON.stringify(F);
    if (sig !== DD.sig) { DD.sig = sig; DD.page = 1; }
    const evs = ddSort(filtered());
    const pages = Math.max(1, Math.ceil(evs.length / DD_PAGE));
    if (DD.page > pages) DD.page = pages;
    const slice = evs.slice((DD.page - 1) * DD_PAGE, DD.page * DD_PAGE);
    const pager = '<div class="pager"><span class="sub">' + evs.length + ' events · page ' + DD.page + ' of ' + pages + '</span><div>' +
      '<button class="btn" ' + (DD.page <= 1 ? 'disabled' : '') + ' onclick="ddTurn(-1)">Prev</button> ' +
      '<button class="btn" ' + (DD.page >= pages ? 'disabled' : '') + ' onclick="ddTurn(1)">Next</button></div></div>';
    return html + '<div class="card" id="ddList"><div class="dd-head"><h3>Events matching filters <span class="sub">(' + evs.length + ')</span></h3>' +
      '<div class="dd-chips">' + ddChips() + '<button class="btn" onclick="resetFilters()">Clear filters</button></div></div>' +
      (evs.length ? ddTable(slice, false) + pager : '<div class="empty">No events match the current filters.</div>') + '</div>';
  };
  window.ddTurn = function (d) {
    DD.page += d; render();
    const l = document.getElementById('ddList'); if (l) l.scrollIntoView({ block: 'start' });
  };
  function ddWireOverview() {
    const list = document.getElementById('ddList'), k = document.querySelector('#view .kpi');
    if (!list || !k) return;
    k.classList.add('dd-jump'); k.title = 'Jump to the matching events';
    const s = k.querySelector('.s'); if (s) s.textContent += ' · ↓ list below';
    k.onclick = () => list.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

   
  
  const _tblBuild = tblBuild;
  tblBuild = function () { const T = _tblBuild(); DD.T = T; return T; };

  
  
  function ddCellEvents(T, V, r, c) {
    const M = T.ev, nR = M.length, nC = TBL.cols ? T.cols.length : 1;
    let rows = r < 0 ? range(nR) : [r], cols;
    if (!TBL.cols) {
      cols = [0];
      if (V.head[c] === 'Cumulative' && r >= 0) rows = range(r + 1);
    } else cols = c <= nC ? [c - 1] : range(nC);
    const seen = new Set();
    rows.forEach(i => cols.forEach(j => { const cell = M[i] && M[i][j]; if (cell) cell.forEach(e => seen.add(e)); }));
    return [...seen];
  }

  function ddCellLabel(T, V, r, c) {
    const nC = TBL.cols ? T.cols.length : 1;
    const all = k => k === 'month' ? 'All months' : k === 'week' ? 'All weeks' : k === 'actor' ? 'All actors shown' : 'All ' + DIMS[k].label.toLowerCase() + ' values';
    const rDim = DIMS[TBL.rows].label, rowLab = r < 0 ? all(TBL.rows) : V.body[r][0];
    if (!TBL.cols) return V.head[c] === 'Cumulative' && r >= 0 ? rDim + ': through ' + rowLab : rDim + ': ' + rowLab;
    const colLab = c <= nC ? V.head[c] : all(TBL.cols);
    return rDim + ': ' + rowLab + ' · ' + DIMS[TBL.cols].label + ': ' + colLab;
  }

  function ddWireTables() {
    const T = DD.T; if (!T || !T.ev) return;
    document.querySelectorAll('#view .ptable').forEach((tb, vi) => {
      const V = TBL_LAST[vi];
      if (!V || V.body.length !== T.ev.length) return;
      const wire = (tr, r) => tr.querySelectorAll('td').forEach((td, k) => {
        const c = k + 1;
        if (!TBL.cols && V.head[c] === 'Cumulative' && r < 0) return;
        const evs = ddCellEvents(T, V, r, c);
        if (!evs.length) return;
        td.classList.add('dd');
        td.title = evs.length + ' event' + (evs.length > 1 ? 's' : '') + ' · click to list';
        td.onclick = () => {
          const t = tblTitle(), w = t.indexOf(' — where ');
          const sub = 'Period ' + fmtDate(TBL.start) + ' – ' + fmtDate(TBL.end) + (w >= 0 ? ' · Filters: ' + t.slice(w + 9) : '');
          DD.drill = { kicker: 'Table cell', title: ddCellLabel(T, V, r, c), sub, evs: ddSort(evs) };
          ddShowDrill();
        };
      });
      tb.querySelectorAll('tbody tr').forEach((tr, r) => wire(tr, r));
      const ft = tb.querySelector('tfoot tr'); if (ft) wire(ft, -1);
    });
  }

  function ddShowDrill() {
    const D = DD.drill; if (!D) return;
    DD.inDrill = true;
    const m = document.getElementById('modal');
    m.innerHTML = '<div style="display:flex;justify-content:space-between;gap:10px"><div><span class="tag">' + esc(D.kicker) + '</span> <span class="tag">' + D.evs.length + ' event' + (D.evs.length > 1 ? 's' : '') + '</span>' +
      '<h2>' + esc(D.title) + '</h2>' + (D.sub ? '<div class="muted">' + esc(D.sub) + '</div>' : '') + '</div><button class="btn" onclick="closeModal()">Close</button></div>' +
      '<div style="margin-top:12px">' + ddTable(D.evs, true) + '</div>';
    document.getElementById('overlay').classList.add('show');
    m.scrollTop = 0;
  }
  window.ddShowDrill = ddShowDrill;

   
  function ddAddBack() {
    if (!DD.inDrill || !DD.drill) return;
    const m = document.getElementById('modal'); m.scrollTop = 0;
    const close = m.querySelector('.btn[onclick="closeModal()"]'); if (!close) return;
    const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;gap:6px;align-self:flex-start;flex:none';
    const back = document.createElement('button'); back.className = 'btn'; back.textContent = '← Back to ' + DD.drill.evs.length + ' events'; back.onclick = ddShowDrill;
    close.replaceWith(wrap); wrap.append(back, close);
  }
  const _openEvent = openEvent;
  openEvent = function (id) { if (!DB.eventById.get(id)) return; _openEvent(id); ddAddBack(); };
  const _openActor = openActor;
  openActor = function (id) { if (!DB.actorById.get(id)) return; _openActor(id); ddAddBack(); };
  const _closeModal = closeModal;
  closeModal = function () { DD.inDrill = false; _closeModal(); };

   
  const _renderDD = render;
  render = function () {
    _renderDD();
    if (!DB) return;
    if (tab === 'tables') ddWireTables();
    if (tab === 'overview') ddWireOverview();
  };
  if (DB) render();
})();
</script>
