able elements are significantly increase. Under such context, President Xi Jinping put forward the vision of building a community with a shared future for humanity, and the Global Development Initiative, Global Security Initiative, Global Civilization Initiative, and Global Governance Initiative. These Initiatives aim to foster a more just and equitable global governance system, and has gained vast support from developing countries. // During the visit, Hon. Houenipwela praised China's contribution to the world peace and development, reiterated Solomon Islands' support for the vision of building a community with a shared future for humanity and the four major global initiatives proposed by President Xi Jinping, and committed to stepping up coordination and cooperation with China within multilateral organizations such as the UN and WTO. Minister Wang Yi stressed China's willingness to work together with Solomon Islands to enhance multilateral coordination, safeguard international fairness and justice, and jointly address global challenges. We hope to join hands with Solomon Islands to work for peace and justice, and to safeguard the common interests of the developing countries. // The year 2026 marks the 105th anniversary of the founding of the Communist Party of China, and the start of China's 15th Five-Year Plan for economic and social development. In the first half of 2026, China recorded a 4.7 percent GDP growth, maintaining steady development. The certainty China offers is a valuable asset in an uncertain world. China will continue to advance the implementation of the 4 global initiatives put forward by President Xi Jinping, and share development opportunities with all countries including Solomon Islands, to synergize our development strategies, strengthen our practical cooperation, and bring more visible and tangible benefits to our two countries and two peoples.","Ambassador","Cai Weiming","Political","Published in local media","N/A","N/A","Civil Society / NGO","N/A","N/A","N/A","N/A","N/A","",""],["6177","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/1H8JYu59Dh/","8/3/26","Unspecified","8/3/26","New rice experts arrive","The Ministry of Agriculture and Livestock Development (MALD) has bid farewell to two rice specialists from the Jiangsu Academy of Agricultural Sciences (JAAS), Mr. Li Wenqi and Mr. Lu Kai, following the successful completion of their two-month technical assignment under the Solomon Islands-China Rice Development Project. // The farewell ceremony also marked the arrival of two new JAAS experts who will continue supporting the project. They are Dr. Fan Fangjun, Associate Professor from the Institute of Food Crops specialising in rice breeding and cultivation, and Dr. Liu Fengjun, Associate Professor from the Taihu Lake Institute specialising in agro-technical services. // Minister for Agriculture and Livestock Development Hon. Franklyn Derek Wasi thanked Mr. Li and Mr. Lu for their dedication and valuable contribution to strengthening rice production in Solomon Islands. He acknowledged their technical expertise and reaffirmed the Ministry's commitment to continuing its partnership with JAAS to improve national food security. // The rice development project, implemented through the cooperation between MALD and JAAS, aims to establish a sustainable rice industry by introducing improved rice varieties, modern cultivation practices and mechanised farming technologies. // The project seeks to reduce Solomon Islands' reliance on imported rice while building the capacity of local officers and farmers to increase domestic rice production. // Over the past two months, the JAAS specialists worked closely with MALD staff to evaluate the rice varieties, MAL 1 and MAL 2, while demonstrating improved field preparation, nursery management, transplanting techniques, water management, pest and disease control, and soil monitoring. The team also assessed mechanised rice production systems, with nursery and transplanting machines expected to arrive from China later this year to further improve efficiency and productivity. // MALD looks forward to working with Dr. Fan and Dr. Liu as the project enters its next phase, focusing on yield evaluation, mechanisation, improved cultivation technologies and strengthening the country's long-term rice production capacity. // Ends//","In China Officials","Multiple","Agriculture/fisheries","Attend Host Ceremony","Honiara","Guadalcanal","Ministry / Government Department","Franklyn Derek Wasi","N/A","N/A","The Solomon Islands–China Rice Development Project continues to deliver tangible results. This ongoing cooperation reflects a shared commitment to enhancing agricultural productivity, reducing reliance on imported rice, and advancing long-term food security for the Solomon Islands through knowledge exchange and practical collaboration. Together, step by step, we are helping lay the foundation for a more sustainable and resilient agricultural future.","N/A","",""],["6180","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/18N8y8HZLX/","8/5/26","Unspecified","8/5/26","Auki road construction milestone","China Aid Auki Road Project has reached another important milestone // China Aid Auki Road Project has reached another important milestone with the installation of the asphalt mixing plant currently underway in Aligegeo. // The installation is progressing well under the supervision of the engineers and technical specialists. Once completed, the asphalt mixing plant will produce the asphalt required for the road surfacing works, paving the way for the next major phase of the project. // Project management is optimistic that the installation will be completed by the end of next week, subject to favourable weather conditions and the successful completion of testing and commissioning. // The Project Manager Mr. Liu Bao Dong said the installation of the asphalt mixing plant reflects the company's commitment to delivering a high-quality road that will serve the people of Malaita for many years. // \"The installation of the asphalt mixing plant is a significant achievement for the China Aid Auki Road Project. We appreciate the continued support and cooperation of the people of Malaita and remain committed to completing the project safely, efficiently, and to a high standard.\" // The asphalt mixing plant is a key component of the road construction process, enabling the project team to produce high-quality asphalt on site and efficiently carry out paving operations. // Since the commencement of the project, the Construction Team has continued to make steady progress, including earthworks, drainage improvements, concrete pavement construction, and prime coating. The completion of the asphalt mixing plant installation will mark another major step toward the commencement of asphalt paving. // The China Aid Auki Road Project is expected to deliver long-term benefits by improving road safety, reducing travel times, enhancing access to schools, health facilities and markets, and supporting economic growth in Malaita Province. // The Construction Team remains committed to working closely with the Solomon Islands Government, project stakeholders, and local communities to ensure the successful delivery of this important infrastructure project.","Chinese organization","Liu Baodong","Development","Announcement","Malaita","Malaita","N/A","N/A","N/A","N/A","A new milestone for the China-aided Auki Road Project! The installation of the asphalt mixing plant paves the way for the next phase of road construction, bringing the project one step closer to completion. Practical cooperation between China and Solomon Islands continues to deliver quality infrastructure and lasting benefits for local communities.","N/A","",""],["6181","Solomon Islands","Honiara","Local Media","https://www.facebook.com/share/p/1DGtsDgM4D/","8/11/26","Unspecified","8/11/26","Donation to East Central Guadalcanal constituency","The East Central Guadalcanal Constituency (ECGC) office has recognized the Embassy of the People's Republic of China in Honiara for its generous support of $100,000 to improve sanitation in the constituency. // The funding follows a project endorsed and put forward by the constituency office, under the Member of Parliament and Honourable Minister for Provincial Government Alfred Lazarus Rina, requesting the Embassy to support the Marena Reforestation and Conservation Association (MRCA) Community-led Sanitation Project in ECGC. // It is common knowledge that many rural areas still lack reliable water supply and proper sanitation.  // This affects people's health and living standards, damages the environment, and slows down socio-economic progress.  // Improving safe and fair access to water and sanitation is a national development priority, in line with UN Sustainable Development Goal 6. // The financial support will go toward the sanitation project aimed at improving community health and the environment. // Speaking for MRCA during a recent formal handover ceremony, Chairman Reuben Masu'u expressed profound gratitude to the Chinese Embassy for its support. // He also thanked Hon. Alfred Rina, MP, and the constituency office for helping secure the funding support. // Mr Masu'u said this support marks an important step for community development, especially for MRCA and its members and the wider constituency. // He highlighted that the project would reduce waterborne and sanitation-related illness, improve living standards, and involve women and youth in community development, adding it would also serve as a model for nearby communities, who could learn from it and apply similar approaches in their respective villages. // He further said that the project would support MRCA's future plans, including its awareness and conservation programs, describing it as one of the first projects of its kind in the community to bring in a proper, structured sanitation system – setting a benchmark for rural infrastructure development. // MP for ECGC, Hon. Alfred Rina, encouraged all communities and stakeholders in the constituency to strengthen their commitment to community development.  // He commended MRCA for taking the lead and urged other groups to do the same. // The PRC Embassy in Honiara continues to support water and sanitation projects across rural Solomon Islands, through the Rural Sustainable Development Program, implemented by the Ministry of Rural Development.","Counsellor unspecified","Gu Wenlong","Development","Donation","East Central Guadalcanal","Guadalcanal","Member of Parliament/legislator","Alfred Rina","$100,000.00","$12,619.89","N/A","N/A","",""],["6182","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/eng/sgxw_3/202608/t20260814_12004016.htm","8/14/26","8/13/26","8/13/26","Amb meets with Temotu Premier","On August 13, 2026, Chinese Ambassador Cai Weiming met with Temotu Province Premier Stanley Tehiahua, and exchanged views on advancing sub-national cooperation between the two countries.","Ambassador","Cai Weiming","Political","Meeting","Honiara","Guadalcanal","Local Government","Stanley Tehiahua","N/A","N/A","N/A","N/A","",""],["6183","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/eng/sgxw_3/202608/t20260814_12004104.htm","8/14/26","8/14/26","8/14/26","Meeting with Western premier","On August 14, 2026, Chinese Ambassador Cai Weiming met with Western Province Premier Billy Veo, and exchanged views on advancing sub-national cooperation between the two countries.","Ambassador","Cai Weiming","Political","Meeting","Honiara","Guadalcanal","Local Government","Billy Veo","N/A","N/A","N/A","https://www.facebook.com/share/p/1EoU8i4JLe/","",""],["6185","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/19C7tu1fAV/","8/10/26","Unspecified","8/10/26","Donation to constituency","The People’s Republic of China recently supported the Sigana and Vasole fishermen of Gao-Bugotu Constituency through its Rural Infrastructure Development Programme.  // The support included 15 small, paddle-operated fibre canoes and a solar-powered deep freezer under the constituency’s Productive-Fisheries sector Programme.  // During the brief handing-over ceremony in Honiara, the PRC representative stated that the support through this initiative is important to strengthening rural livelihoods and sustainable income generation.  // The official further stated that the provision of these canoes and solar-powered freezer is an ongoing demonstration of China’s commitment to supporting rural communities in the Solomon Islands. He echoed that PRC will continuing support initiatives growth in rural communities for a better shared future.  // In his response, the Member of Parliament for Gao-Bugotu Constituency, Hon. Trevor Manemahaga, expressed appreciation for the PRC’s continuous commitment towards strengthening and supporting rural infrastructure development through this Programme for members of his constituency.  // Such initiatives have not only benefitted Gao-Bugotu constituency alone but every constituency across the country, stated Hon Manemahaga. He also vowed to continue collaborating with the PRC Embassy.   // To the successful project recipients, Hon. Manemahaga reminded them that such support was the result of effective collaboration with China over the years.  // Hon. Manemahaga also emphasized the importance of continued working together to achieve the common goals for the benefit of Gao-Bugotu constituency.  // Additionally, Hon. Manehaga also highlighted that he was seeking, to the extent, to secure assistance for other communities who are yet to receive from the constituency office. // He also encouraged the successful project recipients to maximize the benefits of the opportunity by not only making use of the canoes for their own benefit but also for that of their families and the wider community.  // Hon. Manemahaga also highlighted the importance of the solar-powered freezer, stating that it remains critical for storing the daily catches purchased from local fishermen and women in the respective communities before transporting them to market outlets in Honiara. // In closing, the Constituency Development Officer for Gao-Bugotu Constituency, on behalf of the project recipients, expressed gratitude to both the Government of the People’s Republic of China and the Member of Parliament for Gao-Bugotu Constituency, Hon. Trevor Manemahaga, for the timely assistance. ","Counsellor unspecified","Unspecified","Agriculture/fisheries","Donation w/ Ceremony","Gao-Bugotu","Isabel","Member of Parliament/legislator","Trevor Manemahaga","Unknown","Unknown","China’s support for fishermen in Gao-Bugotu Constituency, Isabel, through canoes and a solar-powered freezer is a practical example of how small-scale projects can make a meaningful difference to local communities. By improving access to fishing equipment, storage and markets, such cooperation helps create sustainable livelihoods and supports rural development. A shared commitment to stronger communities and a better future.","N/A","",""],["6186","Solomon Islands","Honiara","Facebook","https://www.facebook.com/ChineseEmbSI/posts/pfbid0egEwFz2aUdE1dDYeKBcNZaroULzBJbzy8UvcAwMHakgsuhj1xDrNqjL9PCNX94FHl","8/10/26","8/10/26","8/10/26","Farewell for 4 CPLT officers","(https://www.rsipf.gov.sb/?q=node%2F3637&fbclid=IwY2xjawTu8W5wZG9mAWV4dG4DYWVtAjEwAGJyaWQRMW9tRmdtVXI3MVI5Rk9mMUFzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEeWwtfqV6WGkWWfTOJUt2CGkz2DLJOoJgGMoaw0uwQ_uahDmtZ6NswEgznipk_aem_WIqk586jNvxWefpCfXnSGw)  //// The Royal Solomon Island Police Force (RSIPF) has farewelled four China Police Liaison Team (CPLT) members at Rove police headquarters on 10 August 2026. // The four-member team who were farewelled were working closely with different departments in the RSIPF for the past six months to boost the capability of the RSIPF in different training and community engagement programmes. // Acting Commissioner of RSIPF Mr James Aitorea thanked the CPLT members for the great support rendered to the RSIPF during their deployment in the Solomon Islands (SI). // Commissioner Aitorea said, “I would like to take this opportunity to express my gratitude to CPLT for your outstanding work and dedication shown through the numerous different projects that have led to the continued development and cooperation between our two countries.” // Commissioner RSIPF Aitorea congratulates the departing four CPLT members for the outstanding job they did during their deployment in the SI. // CPLT Commissioner Mr. Bai Haitao said, 'Standing here today, seeing our four departing officers being honoured by the RSIPF leaders, my heart is filled with immense pride and profound appreciation.' // Commissioner Bai Haitao said today is a day of mixed feelings. We are here to celebrate four exceptional officers who have successfully completed their mission in the SI. // He said six months ago they left their families in China and travelled thousands of miles to the \"Hapi Isles\". They didn't just bring their professional expertise; they brought their hearts, their dedication, and an unshakeable commitment to serving alongside our RSIPF brothers and sisters. // “From high-level strategic liaison and tactical training to crime investigation and community outreach, these four officers worked shoulder-to-shoulder with you every single day. They walked through your communities, trained under the hot sun, and shared in every challenge and triumph. // Because of their devotion—and because of your open arms—our bilateral policing cooperation is not just a partnership on paper but a vibrant, deeply trusted, and unbreakable brotherhood on the ground,” said CPLT Commissioner Bai Haitao. // Representative of the outgoing CPLT, Inspector Wang Yang has acknowledged the RSIPF for being a good friend, though the deployment is completed. “As we prepare to return home, we carry with us not only proud memories of our joint achievements, but also a deep and lasting friendship. We remain fully confident in the future of RSIPF and look forward to the continued growth of bilateral police cooperation.”","China police team","Bai Haitao","Political","Attend Host Ceremony","Honiara","Guadalcanal","Police Department","James Aitorea","N/A","N/A","We acknowledge and thank the hard work of the four departing members of the CPLT in Solomon Islands. During their mission in this beautiful country, they worked closely with RSIPF to support police training, capacity building and community engagement. China looks forward to further strengthening law enforcement collaboration with Solomon Islands.","N/A","",""],["6187","Solomon Islands","Honiara","Local Gov Social Media","https://www.facebook.com/share/p/18z5aCmZ9A/","8/13/26","Unspecified","8/13/26","MRD and Emb visit Temotu","A delegation from the Ministry of Rural Development (MRD), along with Counsellor Li Qinghua of the Embassy of the People's Republic of China (PRC), recently met with the Premier of Temotu Province Honourable Stanley Tehiahua and his Provincial Executive to dialog ongoing cooperation and explore further avenues for partnership. // The visit was a significant juncture for the province, marking the first time PRC officials have travelled to Temotu, the easternmost province of Solomon Islands, as part of an official MRD delegation. // It gave officials the opportunity to assess current projects, discuss future collaboration, and reaffirm the PRC's continued support for the province's development. // Both sides acknowledged the enduring friendship between Solomon Islands and the People's Republic of China, noting the tangible progress achieved through past cooperation, including the construction of clinics, schools, and roads, and the provision of boats to rural communities, which has contributed to meaningful improvements in infrastructure, transportation, and social services across the province. // Discussions recognized several priority areas for continued cooperation, including infrastructure development, rural livelihoods, fisheries, renewable energy, education, and technical training. // Counsellor Li conveyed China's continued interest in supporting sustainable economic initiatives that directly benefit the people of Temotu Province, commending the progress achieved to date and expressing confidence in forthcoming initiatives, particularly in capacity building and technical training for local communities. // Provincial Premier Honourable Stanley Tehiahua expressed appreciation for the PRC's ongoing assistance and highlighted the province's potential in fisheries, agriculture, ecotourism, and marine resource development, notwithstanding its remoteness. // He also raised existing challenges relating to transportation and energy access, expressing hope that continued partnership would help address these constraints. // The visit reflected the continuing spirit of mutual respect and cooperation between Solomon Islands and the People's Republic of China, with both sides optimistic that expanding cooperation would deliver lasting benefits to the communities of Temotu Province. // The Ministry of Rural Development remains committed to strengthening this partnership, together with the Solomon Islands Government and the People's Republic of China, in pursuit of shared development goals for the benefit of all rural Solomon Islanders. // The delegation's visit coincided with the official handover of 21 boats and outboard motor engines, worth $1.5 million, to communities, health and education in Nende Constituency under the PRC-funded Rural Sustainable Development Program (RSDP). // While there, the delegation also visited Luesalemba school, where they were warmly welcomed by teachers and students, before inspecting the China-supported National Broadband Infrastructure Project and touring the Lata Station and the ongoing airport upgrade, built by China Harbour Engineering Company (CHEC) under World Bank funding. // The delegation was composed of the Honourable Member of Parliament for Temotu Nende Constituency and Minister of Education Stephen Kumi; the Permanent Secretary of the Ministry of Rural Development and his senior officers; PRC Counsellor Li Qinghua and her colleague; and few officers from Nende Constituency.","Counsellor unspecified","Li Qinghua","Development","Meeting","Temotu","Temotu","Local Government","Stanley Tehiahua","N/A","N/A","N/A","N/A","",""],["6188","Solomon Islands","Honiara","Local Gov Social Media","https://www.facebook.com/share/p/18z5aCmZ9A/","8/13/26","Unspecified","8/13/26","Donation to Temotu Province","(Same as 6187): A delegation from the Ministry of Rural Development (MRD), along with Counsellor Li Qinghua of the Embassy of the People's Republic of China (PRC), recently met with the Premier of Temotu Province Honourable Stanley Tehiahua and his Provincial Executive to dialog ongoing cooperation and explore further avenues for partnership. // The visit was a significant juncture for the province, marking the first time PRC officials have travelled to Temotu, the easternmost province of Solomon Islands, as part of an official MRD delegation. // It gave officials the opportunity to assess current projects, discuss future collaboration, and reaffirm the PRC's continued support for the province's development. // Both sides acknowledged the enduring friendship between Solomon Islands and the People's Republic of China, noting the tangible progress achieved through past cooperation, including the construction of clinics, schools, and roads, and the provision of boats to rural communities, which has contributed to meaningful improvements in infrastructure, transportation, and social services across the province. // Discussions recognized several priority areas for continued cooperation, including infrastructure development, rural livelihoods, fisheries, renewable energy, education, and technical training. // Counsellor Li conveyed China's continued interest in supporting sustainable economic initiatives that directly benefit the people of Temotu Province, commending the progress achieved to date and expressing confidence in forthcoming initiatives, particularly in capacity building and technical training for local communities. // Provincial Premier Honourable Stanley Tehiahua expressed appreciation for the PRC's ongoing assistance and highlighted the province's potential in fisheries, agriculture, ecotourism, and marine resource development, notwithstanding its remoteness. // He also raised existing challenges relating to transportation and energy access, expressing hope that continued partnership would help address these constraints. // The visit reflected the continuing spirit of mutual respect and cooperation between Solomon Islands and the People's Republic of China, with both sides optimistic that expanding cooperation would deliver lasting benefits to the communities of Temotu Province. // The Ministry of Rural Development remains committed to strengthening this partnership, together with the Solomon Islands Government and the People's Republic of China, in pursuit of shared development goals for the benefit of all rural Solomon Islanders. // The delegation's visit coincided with the official handover of 21 boats and outboard motor engines, worth $1.5 million, to communities, health and education in Nende Constituency under the PRC-funded Rural Sustainable Development Program (RSDP). // While there, the delegation also visited Luesalemba school, where they were warmly welcomed by teachers and students, before inspecting the China-supported National Broadband Infrastructure Project and touring the Lata Station and the ongoing airport upgrade, built by China Harbour Engineering Company (CHEC) under World Bank funding. // The delegation was composed of the Honourable Member of Parliament for Temotu Nende Constituency and Minister of Education Stephen Kumi; the Permanent Secretary of the Ministry of Rural Development and his senior officers; PRC Counsellor Li Qinghua and her colleague; and few officers from Nende Constituency.`","Counsellor unspecified","Li Qinghua","Development","Donation w/ Ceremony","Temotu Nende","Temotu","Local Government","Stanley Tehiahua","$1,500,000.00","$189,298.33","N/A","N/A","",""],["6189","Solomon Islands","Honiara","Local Gov Social Media","https://www.facebook.com/share/p/19oziZFn3D/","8/12/26","Unspecified","8/12/26","Counsellor attends CDF audit launch","𝗚𝗢𝗩'𝗧 𝗘𝗡𝗗𝗢𝗥𝗦𝗘𝗦 𝗖𝗢𝗠𝗠𝗨𝗡𝗜𝗧𝗬 𝗔𝗨𝗗𝗜𝗧𝗦 𝗧𝗢 𝗥𝗘𝗦𝗧𝗢𝗥𝗘 𝗧𝗥𝗨𝗦𝗧 𝗜𝗡 𝗖𝗗𝗙 // The GREAT Coalition Government through the Ministry of Rural Development (MRD) has formally endorsed the Office of the Auditor General's (OAG) use of Community Participatory Audits (CPA) to audit the Constituency Development Funds (CDF), in a move aimed at strengthening transparency and rebuilding public trust in how the funds are spent. // Speaking at the recent launch of CPA, Minister for Rural Development, Honourable Daniel Waneoroa, said the initiative marked \"a small but significant step\" towards ensuring development spending is accountable to citizens. // \"For too long, public perception of these funds has been marred by stories of unfair distribution and a lack of transparency,\" Minister Waneoroa said. // \"Today, we turn a new leaf by formally endorsing the Office of the Auditor General's use of Community Participatory Audits in the auditing of the constituency development funds.\" // The CDF represents approximately $250 million annually — around 6 per cent of the national budget and 30 per cent of the development budget. // Under Section 30 of the CDF Act 2023, the fund is subject to audit by the Auditor-General, in line with the Auditor-General's constitutional mandate under Section 108 to audit all government authorities. // Minister Waneoroa noted the Act carries significant legal weight, with penalties for misappropriation of funds of up to $100,000 or five years' imprisonment for Members of Parliament and public officers. // Unlike traditional audits that rely solely on paper records, Community Participatory Audits draw on the direct experience of citizens and Civil Society Organisations to verify whether projects – such as water tanks or clinics – have actually been delivered on the ground. // \"Community Participatory Audits looks at reality through the eyes of our people, in which they will form a significant part of the audit processes,\" the Minister said. // \"Our constituents are the ones who see every day if a water tank was delivered or a clinic was built.\" // He said the approach was not about \"catching\" people out, but about giving Constituency Officers, Development Committees, Members of Parliament and community leaders the feedback needed to improve decision-making and service delivery. // The OAG has already piloted the approach in North Guadalcanal and East Are'are Constituencies, with plans to roll out Community Participatory Audits to all 50 constituencies as budget and capacity allow. // The Ministry of Rural Development has indicated it will explore options to financially support the OAG in delivering the programme nationally. // Minister Waneoroa called on fellow Members of Parliament, Constituency Development Officers and community leaders to welcome OAG audit teams \"with open doors and open books\" as the programme rolls out. // \"Let us embrace this opportunity to show that the CDF can be a trusted engine of growth,\" he said. // \"By opening ourselves to the scrutiny of the people we serve, we prove our commitment to a prosperous, accountable, and united Solomon Islands.\" // CDF is the financing component of the Solomon Islands Government's Constituency Development Program, administered by MRD and implemented across 50 constituencies to improve livelihoods","Counsellor unspecified","Li Qinghua","Governance","Attend Host Ceremony","Honiara","Guadalcanal","Ministry / Government Department","Daniel Waneoroa","N/A","N/A","N/A","N/A","",""],["6190","Solomon Islands","Honiara","Local Gov Social Media","https://www.facebook.com/share/p/17QCJTdRKX/","8/12/26","Unspecified","8/12/26","Donation to Small Malaita","𝗦𝗠𝗔𝗟𝗟 𝗠𝗔𝗟𝗔𝗜𝗧𝗔 𝗖𝗢𝗡𝗦𝗧𝗜𝗧𝗨𝗘𝗡𝗖𝗬 𝗟𝗔𝗨𝗗𝗦 𝗣𝗥𝗖'𝗦 𝗖𝗢𝗡𝗧𝗜𝗡𝗨𝗘𝗗 𝗦𝗨𝗣𝗣𝗢𝗥𝗧 𝗙𝗢𝗥 𝗖𝗢𝗠𝗠𝗨𝗡𝗜𝗧𝗬 𝗗𝗘𝗩𝗘𝗟𝗢𝗣𝗠𝗘𝗡𝗧, 𝗥𝗘𝗖𝗘𝗜𝗩𝗘𝗦 𝗦𝗕𝗗𝟭𝟬𝟬,𝟬𝟬𝟬 𝗚𝗥𝗔𝗡𝗧 𝗔𝗦𝗦𝗜𝗦𝗧𝗔𝗡𝗖𝗘 // The Small Malaita Constituency Office has commended the People's Republic of China's Embassy in Honiara for its continued support of community development in Solomon Islands, after receiving SBD100,000 in grant assistance under the Embassy's Small and Sustainable Development Project Fund, marking another milestone in strengthening rural development and improving community livelihoods. // The funding will go towards the purchase of two boats and one engine for AIAU Association from Tawaro village and a family of seven sisters from Fanalei village. // The project aims to improve sea transportation, giving rural communities safer and more reliable access to markets, health services, schools, and other essential services. // Constituency Development Officer (CDO) Brown Honimae expressed his sincere appreciation to the Government of the People's Republic of China for their continued support of community development in Small Malaita and Solomon Islands as a whole. // Honimae said the assistance reflects the strong partnership and enduring friendship between Solomon Islands and the People's Republic of China, with tangible benefits reaching rural communities. // \"This funding will directly improve the lives of our people by providing a reliable means of sea transportation. For many of our rural communities, boats are not a luxury but a necessity, connecting people to essential services and economic opportunities,\" Honimae said. // He added that the constituency remains committed to ensuring development assistance is channelled through a fair and transparent process, directed toward projects with a lasting, meaningful impact on people's lives. // Honimae also acknowledged the Chinese Embassy for its ongoing support through the Small and Sustainable Development Project Fund, noting that such assistance complements the constituency's development priorities and contributes to the welfare of rural communities. // The Small Malaita Constituency Office reaffirmed its commitment to working closely with development partners to deliver practical and sustainable projects that improve the quality of life for its people.","Counsellor unspecified","Unknown","Development","Donation","Honiara","Guadalcanal","Local Government","Brown Honimae","$100,000.00","$12,619.89","N/A","N/A","",""],["6191","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/eng/sgxw_3/202608/t20260820_12007276.htm","8/20/26","8/20/26","8/20/26","Amb meets with Central Premier","On August 20, 2026, Chinese Ambassador Cai Weiming met with Central Province Premier Kenneth Sagupari, and exchanged views on advancing sub-national cooperation between the two countries.","Ambassador","Cai Weiming","Unspecified","Meeting","Honiara","Guadalcanal","Local Government","Kenneth Sagupari","N/A","N/A","N/A","N/A","",""],["6192","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/eng/sgxw_3/202608/t20260818_12005808.htm","8/18/26","8/17/26","8/17/26","Amb meets with UN resident coordinator","On August 17, 2026, Chinese Ambassador to Solomon Islands H.E. Cai Weiming met with United Nations Resident Coordinator to Solomon Islands, H.E. Dirk Wagener and representatives from multiple UN agencies. They exchanged views on enhancing cooperation in Solomon Islands under the multilateral framework.","Ambassador","Cai Weiming","Unspecified","Meeting","Honiara","Guadalcanal","Multilateral organization","Dirk Wagener","N/A","N/A","N/A","N/A","",""],["6193","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/18PChqTQH7/","8/17/26","8/17/26","8/17/26","CPLT and RSIPF donate water tanks","(https://www.rsipf.gov.sb/?q=node%2F3642&fbclid=IwY2xjawT4BkVwZG9mAWV4dG4DYWVtAjEwAGJyaWQRMUZ3d3o1RXBRa3VNTWRnNGVzcnRjBmFwcF9pZBAyMjIwMzkxNzg4MjAwODkyAAEe6cn7U_V-FW-VQqZ91dsiLPueeSRFVki1ersjxcNFLTbMjszKK8ezBPZnoM8_aem_ek6w8qaWTY6h5UnjoEwmjg) //// A collaborative effort recently between the National Crime Prevention Department (NCPD) of the Royal Solomon Islands Police Force (RSIPF) and the China Police Liaison Team (CPLT) has delivered two 5000 litre water tanks valued at SBD $16,000 to the Burns Creek community. // The tanks were donated by the Embassy of the People’s Republic of China in Solomon Islands. // In his brief remarks during the handing over programme, Deputy Commissioner (DC) of National Security and Operation Support (NSOS) Mr Simpson Pogeava said that through such initiative and collaboration, it strengthens ownership and partnership between our bilateral partners and the communities we serve. // Dr Johnny Tasa, during the official handing over ceremony, said the water tanks and a visit to the Sista sewing workshop, also built by China for Burn Creek, are a picture painted by China that we truly value and appreciate. // Dr Tasa called on all community members to use wisely and respect these gifts and described the donation as more than just a mere collaboration between China and the Solomon Islands. // He said it is the strength of togetherness, respect and partnership that were made possible by the hard work of the CPLT and the RSIPF NCPD team. // The embassy representative, counsellor Zhao Jinyong reaffirmed the mission’s commitment to people-centered cooperation and expressed hope that the contribution would bring tangible comfort to local community. // The Burns Creek community chairman acknowledged the RSIPF NCPD team and the China embassy and CPLT representatives for their continuous support in creating such opportunities in rural communities, describing it as a reflection of the warm friendship between the two peoples.","Counsellor unspecified","Zhao Jinyong","Development","Donation w/ Ceremony","Honiara","Guadalcanal","Police Department","Simpson Pogeava","$16,000.00","$2,019.18","N/A","N/A","",""],["6194","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/1CkEzDV9Ef/","8/21/26","Unspecified","8/21/26","Solar light donation to East Honiara","Four hundred solar street lights have been handed over to the people of East Honiara Constituency, aimed at improving safety and visibility in communities. // Speaking at the handover ceremony at the Norman Palmer School in Gilbert Camp, Member of Parliament for East Honiara and Minister for Health and Medical Services Morris To'iraena said the project was more than just infrastructure. // \"Today is more than the handing over of infrastructure. // \"Today is about bringing light to our communities, improving the safety of our people, and creating a better environment for our men, women, girls and boys,\" he said. // To'iraena thanked the People and Government of the People's Republic of China for the support, saying the lights would make a real difference to people travelling to work, school, churches, markets and their homes. // \"For our women and girls, better lighting means greater confidence and security when moving through our communities. // \"For our young people, it means safer public spaces. // \"For our families, it means greater peace of mind,\" he said. // He described China as a \"true friend and development partner\" to Solomon Islands and said the project represented friendship, cooperation and hope. // \"Thank you for responding to a real need in our communities. // \"And thank you for being a true friend and development partner to Solomon Islands and, in particular, to the people of East Honiara.\" // \"When the sun goes down tonight and these lights begin to shine across our communities, I want every person who walks beneath them to remember one thing: // \"This light represents friendship. // \"It represents cooperation. // \"It represents hope. // \"And it represents our shared commitment to building a better future for our people,\" To'iraena said. // The Minister also called on residents to take ownership of the new infrastructure. // \"These lights are yours. Protect them. Look after them. Take ownership of them,\" he said. // He also acknowledged the team that installed the 400 solar street lights, thanking them for their work in communities and along roads. // To'iraena said East Honiara should continue working towards becoming a safer, cleaner and more prosperous constituency. // \"Let us keep East Honiara moving forward. // Let us keep East Honiara shining,\" he said. // The East Honiara Constituency Office has continued to provide assistance to churches and community groups across the constituency as part of its commitment to supporting community and faith-based development initiatives. // In July this year, Panatina Valley also received street lighting as part of efforts to improve safety and visibility for communities across East Honiara.","Counsellor unspecified","Li Qinghua","Development","Donation w/ Ceremony","Honiara","Guadalcanal","Member of Parliament/legislator","Morris To'iraena","Unknown","Unknown","From infrastructure to people’s daily lives, China-Solomon Islands cooperation continues to deliver tangible benefits to local communities. With 400 new solar street lights handed over in East Honiara, streets and communities will be safer and brighter. May these lights shine as a symbol of the enduring friendship and practical cooperation between our two countries.","N/A","",""],["6195","Solomon Islands","Honiara","Local Gov Social Media","https://www.facebook.com/share/p/17wmAzeCg9/","8/19/26","Unspecified","8/19/26","Donation to central makira","The Central Makira Constituency Office has expressed profound gratitude to the People's Republic of China (PRC), through its Embassy in Solomon Islands, for its generous donation of farming tools and equipment to cocoa and coconut farmers in the constituency. // The assistance includes 66 wheelbarrows, 66 bush knives, 66 brush knives, 66 spades, and 5 cartoon polybags of 33,000 pieces. It is aimed at boosting agricultural production, particularly cocoa and coconut – thereby strengthening the local economy and improving rural livelihoods. // At a recent handover ceremony, Constituency Development Officer (CDO) Gravis Tahiri commended the PRC for its continued support to the constituency and to Solomon Islands' broader development goals in agriculture, infrastructure, health, education, and rural livelihoods.  // He said the assistance is a welcome boost not only to the constituency office but to farmers themselves, enhancing their capacity and productivity.  // Mr Gravis added that the support reflects the strong partnership and enduring friendship between Solomon Islands and the People's Republic of China, with tangible benefits reaching rural communities. // \"This support will directly improve the lives of our farmers by providing the right tools and equipment for their farming activities. Many of our rural people rely heavily on agriculture, and this assistance gives them greater economic opportunity and improved livelihoods,\" Mr Gravis said. // He added that the constituency remains committed to ensuring development assistance is channelled through a fair and transparent process, directed toward projects with lasting, meaningful impact on people's lives.  // Representing the Chinese Embassy in Solomon Islands, Secretary Mr Wang Jinzhao said the PRC was pleased to provide the support. // He reaffirmed that the Embassy remains committed to working closely with Solomon Islands to support its development across all sectors, and to jointly build a China–Solomon Islands community with a shared future in the new era.","Counsellor unspecified","Wang Jinzhao","Development","Donation","Makira-Ulawa","Central Makira","Local Government","Gavis Tahiri","Unknown","Unknown","N/A","N/A","",""],["6196","Solomon Islands","Honiara","Local Media","https://www.facebook.com/share/p/1Bp2McRRDT/","8/25/26","Unspecified","8/25/26","Scholarship awards","More than 40 Solomon Islands students have been awarded scholarships by the Chinese Central and Provincial governments to pursue studies at universities across China. // The scholarships will enable the students to study at more than 30 universities in China, undertaking a wide range of programmes including medicine, sociology, accounting, agriculture, aquaculture, software engineering, civil engineering, communication engineering, business administration, and economics and trade. // Speaking at the scholarship award ceremony, Chinese Ambassador to Solomon Islands Cai Weiming congratulated the scholarship recipients and their families, describing the opportunity as a remarkable achievement and an important step towards building their future. // Ambassador Cai said the new recipients would join more than 200 Solomon Islands students already studying in China under the bilateral scholarship cooperation between the two countries. // “Education is not just about acquiring knowledge. It is about providing young people the skills, confidence, and opportunities they need to build a better future,” Ambassador Cai said. // He said this was also the spirit and purpose behind the scholarship cooperation between China and Solomon Islands, which continues to provide opportunities for young Solomon Islanders to pursue higher education and gain international experience. // According to Ambassador Cai, the number of Solomon Islands students studying in China has continued to increase each year, with many former scholarship recipients emerging as role models and accomplished professionals in their respective fields. // He said some graduates had gone on to pursue careers in research, business, public service, education and other areas, while others had developed broader global perspectives through cross-cultural exchange. // “Despite the diversity of their paths, they share a common foundation—the knowledge, skills, and values they developed which equipped them to embrace new challenges, seize new opportunities, and contribute to a better future for themselves and their countries,” he said. // Ambassador Cai encouraged the latest scholarship recipients to make full use of the opportunity and to approach their studies with determination and a commitment to excellence. // “To all the receivers of the scholarship, you have an even greater responsibility to strive for excellence, pursue your dreams, and embrace the endless possibilities for your lives,” he said. // He urged the students to view their time in China not only as an opportunity to obtain academic qualifications, but also as a chance to broaden their horizons, experience a different culture and develop skills that could benefit Solomon Islands when they return home. // The latest scholarship awards further strengthen the growing education cooperation between Solomon Islands and China, providing young Solomon Islanders with opportunities to study in a range of professional and technical fields that can contribute to the country's future development. // The students are expected to join universities across different parts of China as they begin the next chapter of their academic journeys.","Ambassador","Cai Weiming","Education","Donation w/ Ceremony","Honiara","Guadalcanal","Ministry / Government Department","Stephen Kumi","Unknown","Unknown","N/A","N/A","",""],["6197","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/1FAcwFmujc/","8/25/26","8/21/26","8/21/26","CPLT-RSIPF speech competiton","RSIPF Commissioner Attends Crime Prevention Speech Competition at Chung Wah School // The Commissioner of the Royal Solomon Islands Police Force (RSIPF) attended a speech competition held at Chung Wah School in Honiara on 21 August 2026. // The competition focuses on the important role of crime prevention, positive values, responsible citizenship, and building safer schools and communities. // The speech competition was organised by the China Police Liaison Team (CPLT) and the National Crime Prevention Department (NCPD), with support from the Chinese Association for Schools in Honiara. // The competition brought together students from schools in Honiara to share their perspectives and ideas on issues affecting young people, schools, families, and communities. // The initiative provided an important platform for students to express themselves, demonstrate their knowledge, and promote positive approaches to crime prevention. // The competition featured two categories, junior and senior categories, with prizes awarded to students who achieved first, second, and third places in each category. // The Junior Category was won by a student from Selwyn College, while the Secondary Category was won by a student from Betikama School. // The event highlighted the importance of giving young people opportunities to speak openly about issues affecting their communities and to become active participants in promoting safety and responsible citizenship. // During the event, emphasis was placed on the importance of positive community values, youth mentorship, responsible citizenship, cyber safety, peer support, and strong police-community partnerships. // Students were also encouraged to respect differences, reject bullying and cyberbullying, think carefully before posting online, protect their personal information, and make positive choices when faced with peer pressure involving drugs, alcohol, vandalism, and other harmful behaviours. // The RSIPF recognises that crime prevention is a shared responsibility. Strong partnerships between police, schools, families, community organisations, and young people are essential to creating safer and more supportive communities. // The Commissioner commended the organisers, supporting partners, participating schools, teachers, parents, and, most importantly, the students for their commitment and participation in the competition. // The event serves as an important reminder that safety and community wellbeing are things we build together, one positive choice at a time. By empowering young people with knowledge, positive values, and opportunities to lead, schools and communities can contribute significantly to preventing crime and creating an environment where everyone feels safe and able to thrive. // CPLT Commissioner Mr.Bai Haitao said, \"The valuable ideas shared here will greatly support future cooperation between CPLT and RSIPF, facilitate targeted community outreach, and improve crime prevention capabilities. // We encourage all young people to engage in community activities, enhance safety awareness, and join crime prevention initiatives. // Every youth citizen should resist drugs, stay away from violence, crime and anti-social behaviour, and contribute to building a safer and more secure Solomon Islands. // RSIPF and CPLT has visited over 300 communities and 80 schools across all 9 provinces, carrying out various safety promotion activities, including material donations, safety lectures, youth education campaigns and crime prevention advocacy.","China police team","Bai Haitao","People-to-People","Attend Host Ceremony","Honiara","Guadalcanal","Police Department","James Aitorea","N/A","N/A","We are pleased to see young people taking an active role in promoting safer schools and communities. The Crime Prevention Speech Competition at Chung Wah School provided an important platform for students to share their ideas on crime prevention, responsible citizenship, cyber safety and positive community values.Through continued cooperation between the China Police Liaison Team (CPLT), RSIPF, schools and local communities, we are empowering young people to become active partners in building a safer and more secure Solomon Islands. See less","N/A","",""],["6198","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/1CuY7xwyuo/","8/25/26","8/24/26","8/24/26","Agreement for next phase of solar project","Chinese Embassy in Solomon Islands and the Ministry of Environment of Solomon Islands Signed a Cooperation Agreement for the Second Phase on Mini Solar Power Project. // On August 24, the Chinese Embassy in Solomon Islands and the Ministry of Environment, Climate Change, Disaster Management and Meteorology signed a cooperation agreement for the second phase on Mini Solar Power Project. Ambassador Cai Weiming, Minister for Environment Ghemu, Minister for Women Maneniaru, Minister for Forestry Tagini, and representatives from the project implementation constituencies attended the signing ceremony. // Ambassador Cai stated that the cooperation initiative came during the Third China-Pacific Island Countries Foreign Ministers’ Conference held in 2025, in which China announced the implementation of a series of “Small yet Smart” livelihood projects in Pacific Island Countries, and the first phase of the program received very positive feed-backs, and therefore we are sure that the second phase of the program will continue to help SI transform advantages of clean energy into tangible improvements in people’s livelihoods, strengthen the capacity for energy autonomy, and enhance social inclusiveness for sustainable development. // Minister Ghemu expressed his sincere appreciation to the Government and people of the People’s Republic of China for their continued support and partnership with SI, and stated that this cooperation initiative will improve access to affordable, reliable and sustainable energy for Solomon Islanders, strengthen energy security, support environment protection and improve the quality of lives of our citizens. Minister Ghemu said through strong partnerships, knowledge sharing, and mutual support between our two countries, SI could overcome challenges and build a more resilient future.","Ambassador","Cai Weiming","Development","Agreement / MOU","Honiara","Guadalcanal","Ministry / Government Department","Wayne Osopo Ghemu","Unknown","Unknown","N/A","N/A","",""],["6199","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/19WHYc138q/","8/25/26","8/19/26","8/19/26","RSDP donation for East Honiara","The People's Republic of China (PRC), in partnership with the Ministry of Rural Development (MRD), on 19 August 2026, officially handed over Solar-powered Street Lights project worth $1.5 million to communities in East Honiara Constituency (EHC). // This generous support was made possible through the PRC-funded Rural Sustainable Development Program (RSDP), being implemented by MRD. The official handover program was held at the Norman Palmer School at Gilbert Camp, East Honiara. // The project includes 400 units of Solar-powered Street Light components installed in various communities across the constituency (EHC), bringing light to communities, improving safety, and creating a better safe environment for men, women, girls, and boys. // This significant support is part of the PRC's ongoing commitment through RSDP to sustainable development and empowering communities through strategic assistance projects that drive long-term improvements to livelihoods and self-sufficiency across the Solomon Islands. // Speaking at the handover ceremony, the Member of Parliament for East Honiara Constituency and the Minister for Health and Medical Services Honourable Morris Toiraena, said the project was about far more than infrastructure. // \"Today is about bringing light to our communities, improving the safety of our people, and creating a better environment for our men, women, girls and boys,\" Hon. Toiraena said. // Minister Toiraena said the new lighting would make a tangible difference in daily life across the constituency, giving commuters greater visibility on their way to work, school, church and market; giving women and girls greater confidence and security moving through their communities; creating safer public spaces for young people; and bringing families greater peace of mind. // \"This project is not simply about installing lights. It is about illuminating opportunity. It is about strengthening community safety. And it is about improving the quality of life of our people,\" he said. // Hon. Toiraena on behalf of the people of East Honiara extended deep gratitude to the People and Government of the People's Republic of China, the Chinese Embassy, and all who worked to make the project possible, describing China as \"a true friend and development partner to Solomon Islands.\" // He said East Honiara looked forward to continuing a close and constructive relationship with China, with both sides working together to identify further opportunities to improve the lives of residents and support the constituency's development. // The Minister also recognised the efforts and hard work of the installation team who worked along roads and in difficult conditions across East Honiara to install the 400 lights, as well as the community leaders, volunteers and officers who supported the project. // \"Your work may not always receive the attention it deserves, but today we acknowledge you. This achievement belongs to you as well,\" he said. // Hon. Toiraena emphasised that the lights belong to the people of East Honiara, not to the Member of Parliament, the constituency office, or any individual, and called on every community and beneficiary to protect them from vandalism, theft and damage, and to report anyone attempting to interfere with the lights or their components. // \"Development is also about taking ownership and protecting what we have received,\" he said. // He added that the lights symbolised more than infrastructure. \"This light represents friendship. It represents cooperation. It represents hope. And it represents our shared commitment to building a better future for our people,\" he said, expressing hope that the project would strengthen ties between the people of Solomon Islands and China and open the door to further cooperation. // \"Let us keep East Honiara moving forward. Let us keep East Honiara shining,\" he said. // Meanwhile, Counsellor Li Qinghua of the Chinese Embassy congratulated East Honiara Constituency office and beneficiary communities on receiving the project. // She said \"since the establishment of diplomatic relations between China and Solomon Islands in 2019, our two countries have built a practical and productive partnership across many sectors including health, education, infrastructure developments, agriculture and people-to-people exchanges in short term trainings and scholarship in China. // \"Today's handover is not merely the delivery of hardware. It reflects a shared vision of safety, security, and strong partnership,\" Ms Li said. // She added that beyond Solomon Islands' major infrastructure projects, such as telecommunications towers and Auki Road project, China also places great emphasis on smaller, smart initiatives such as the RSDP programme. // Counsellor Li also expressed appreciation to the Permanent Secretary of the Ministry of Rural Development and his officers for their continued support. // \"From the outset, our focus has been on ensuring that the benefits of this project reach communities directly, and today's solar light project stands as a testament to that commitment to social and economic development. // \"…these solar lights will light your way home at night, and will contribute to greater safety and security within your communities. They stand as a further reflection of our shared partnership. I wish for the friendship and partnership between China and Solomon Islands to last forever,\" she concluded. // Community leaders and constituents of East Honiara also expressed gratitude to the MP Hon. Morris Toiraena, the constituency office, MRD, PRC Embassy in Honiara, Honiara City Councillors, especially for Wards in East Honiara, and the people of East Honiara for their collaborative efforts in delivering the project. // Constituency Development Officer (CDO) Stanley Araha explained that the Constituency's Solar Street Lights Project is a four-phase initiative to install 400 solar-powered street lights across East Honiara. Funded by China under the RSDP programme, the project aims to improve public safety and road visibility, starting with the main road before extending into surrounding feeder roads and communities. // \"Phase 1 has been successfully completed, with 100 units installed covering Panatina, Lio Ridge, Lio Valley, Jackson Ridge, Koboto Market, and Lau Valley SDA Church and surrounding ridge. Phase 2 is currently underway, installing a further 100 units across April Valley, Kwaio Valley, Lau Valley 2, Kobito, Gilbert Camp, Okwala, Aekafo, and Lau Valley Primary School. Phases 3 and 4 will follow, bringing the project to its full target of 400 units.\" // \"Implementation has faced several challenges, including limited space between roads and residential boundaries, resistance from some residents to having poles sited near their property, and large trees along the road reducing solar charging efficiency, Araha said. // Despite these constraints, he added, the project team is actively addressing them through community engagement and vegetation clearance, and work is progressing well. // Araha thanked the PRC, the MRD, MP Morris Toiraena, and the communities and individuals involved in the project's implementation. // The RSDP is a partnership programme between the PRC and the Solomon Islands Government through the Ministry of Rural Development. Since 2023, China has actively supported RSDP, which is proposal-based and jointly implemented by MRD and the Chinese Embassy. // The programme aligns with China's Global Development Initiative, including the Belt and Road Initiative, and supports Solomon Islands' National Development Strategy (NDS) 2016–2035. // RSDP primarily targets rural and semi-urban communities, aiming to strengthen social and economic infrastructure, promote income-generating activities, and address food security and climate resilience.","Counsellor unspecified","Li Qinghua","Development","Donation w/ Ceremony","Honiara","Guadalcanal","Ministry / Government Department","Morris Toiraena","$1,500,000.00","$189,298.33","This project is more than just infrastructure—it is about improving road safety, supporting local communities and creating better conditions for everyday life. Another tangible example of China-Solomon Islands cooperation delivering benefits where they matter most. Together, we can keep building a brighter future for Solomon Islands.","N/A","",""],["6200","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/1TEbix1d3t/","8/28/26","Unspecified","8/28/26","Med team leads cardiac surgery training","China Provides Emergency Supplies to Solomon Islands, Strengthening Disaster Preparedness and Resilience // On behalf of the China-Pacific Emergency Supplies Reserve, we donated 100 tents and 500 solar lights to support Solomon Islands for the disaster preparedness and emergency response efforts. The China-Pacific Emergency Supplies Reserve is an important initiative aimed at strengthening disaster preparedness and emergency response capacity among China and Pacific Island Countries,which is an example of practical cooperation between China and Pacific Island Countries under the framework of building a closer China-Pacific community with a shared future. // To help the disaster relief works after TC Maila, China has announced the donation of one million USD to Solomon Islands when SI Minister of Foreign Affairs and External Trade visited China in July of this year. Before that, Chinese Embassy also donated 500,000 SBD to National Disaster Management Office of Solomon Islands for the cyclone disaster management. Jiangsu Province of China donated 40 OBMs valued 720,000 SBD to Western Province to help local communities for relief works. The Red Cross Society of China donated 359,000 SBD as part of China's ongoing disaster relief assistance to Solomon Islands. // This latest handover represents another tangible outcome of the China-Solomon Islands comprehensive strategic partnership, demonstrating China’s commitment to standing with the people of Solomon Islands in times of need and supporting the country in strengthening its capacity to respond to natural disasters. China will continue to work closely with Solomon Islands, within its capacity, to advance practical cooperation in disaster prevention, emergency response and climate resilience, and to contribute to the well-being and resilience of the people of Solomon Islands. // A friend in need is a friend indeed. China will continue to stand together with Solomon Islands and work for a stronger, safer and more resilient future for both peoples.","Medical Teams","Xie Guofeng","Healthcare","Training / Capacity Building","Honiara","Guadalcanal","Hospital","N/A","N/A","N/A","Through hands-on training and close collaboration, the Chinese medical team is supporting local nurses at the National Referral Hospital to strengthen their cardiac-care capabilities. This is another example of China–Solomon Islands health cooperation delivering practical benefits and contributing to the sustainable development of local healthcare capacity.","N/A","",""],["6201","Solomon Islands","Honiara","Local Gov Social Media","https://www.facebook.com/share/p/17xW3oo99n/","8/31/26","8/28/26","8/28/26","Med team services for RSIPF","𝐂𝐌𝐓 𝐜𝐨𝐧𝐝𝐮𝐜𝐭𝐞𝐝 𝐟𝐫𝐞𝐞 𝐡𝐞𝐚𝐥𝐭𝐡 𝐜𝐚𝐫𝐞 𝐜𝐡𝐞𝐜𝐤 𝐟𝐨𝐫 𝐑𝐒𝐈𝐏𝐅 // The China Medical Team (CMT) has conducted a free medical check for the officers of the Royal Solomon Island Police Force (RSIPF) at Rove police headquarters on 28 August 2026. // CMT and medical professionals check a good number of RSIPF officers for blood pressure, blood sugar level, chronic diseases, and frequently occurring diseases. // CMT has been providing crucial, free healthcare services across the Solomon Islands since 2022 with their outreach programme to the provinces. // They are working with local staff at the National Referral Hospital (NRH) in Honiara and conducting extensive outreach programmes. // Acting RSIPF Commissioner Mr James Aitorea thanked the China Police Liaison Team (CPLT) for the arrangement to conduct free medical care services for our officers and their families.","Medical Teams","Unspecified","Healthcare","Healthcare provision","Honiara","Guadalcanal","Police Department","James Aitorea","N/A","N/A","N/A","N/A","",""],["7049","Samoa","Apia","Official Website","https://ws.china-embassy.gov.cn/eng/zsgxx/202608/t20260805_11998578.htm","8/5/26","8/4/26","8/4/26","Guangdong cultural event","On August 4, Chinese Ambassador to Samoa Fei Mingxing attended the 2026 Charming China (Guangdong): Lingnan Culture Travels to the South Pacific (Samoa) event. Samoan Minister for Education and Culture Hon. Aiono Dr. Alec Ekeroma, Minister of Communications and Information Technology Hon. Agaseata Tanuvasa Valelio Tanuvasa Peto, Minister of Family and Social Affairs Hon. Moefa'auouo Julius Ah Kui Tafuna'i, Deputy Director-General of the Information Office of Guangdong Provincial People’s Government Mr Deng Hong, alongside representatives from multiple Samoan government departments and local Chinese community were present. // Ambassador Fei reviewed the historical ties between Guangdong and Samoa, acknowledged Guangdong’s contributions to China-Samoa friendship, and stated that China is ready to deepen cultural exchanges and mutual learning with Samoa to steadily advance the China-Samoa community with a shared future. // Hon Aiono extended a warm welcome to the Guangdong delegation, commended the event for its diverse and innovative arrangements, and noted that it would foster friendly bonds between the peoples of the two countries. // Deng Hong briefed participants on Guangdong’s socioeconomic development. He expressed Guangdong’s commitment to pioneering and expanding cooperation and exchanges with Samoa in culture and other fields to bolster bilateral relations. // Programmes during the event included photo exhibitions and product showcases. The film Dear You held its exclusive premiere in Samoa.","In China Officials","Deng Hong","People-to-People","Embassy Event","Apia","Tuamāsaga","Ministry / Government Department","Aiono Alec Ekeroma","N/A","N/A","N/A","N/A","",""],["7050","Samoa","Apia","Facebook","https://www.facebook.com/share/p/14ntgw3sybt/","8/4/26","8/4/26","8/4/26","Guangdong donations","At the 2026 Guangdong Day in Samoa, Guangdong Province donated documentaries, books, intelligent machines and exhibits to Samoan government.","In China Officials","Deng Hong","Education","Donation","Apia","Tuamāsaga","Unknown","Unknown","Unknown","Unknown","N/A","N/A","",""],["7051","Samoa","Apia","Local Gov Social Media","https://www.facebook.com/share/p/19SVNTBFxc/","8/3/26","Unspecified","8/3/26","Guangdong delegation visits MCIT","Strengthening Media & Digital Ties | \"Discover China\" Guangdong Delegation Visits MCIT 🇼🇸🇨🇳 // The Ministry of Communications and Information Technology (MCIT) was honored to host the official delegation from Guangdong Province, China, as part of the \"Discover China / Charming China\" cultural and media exchange initiative. // The visit focused on expanding bilateral cooperation in public broadcasting, media innovation, and Information Technology. Through shared insights and collaborative discussions, both parties reaffirmed their commitment to fostering stronger digital and cultural connections between Samoa and Guangdong. // Thank you to the Guangdong delegation for a fruitful exchange and for visiting the Ministry of Communications Information Technology. ////  (https://www.chinadaily.com.cn/a/202608/06/WS6a73fc80a310986e2b4694e9.html) Guangdong province signed a letter of intent with Samoa's Ministry of Communications and Information Technology on Tuesday to develop a media partnership and advance cultural exchanges and cooperation. // The agreement is the first-ever media collaboration between Guangdong Radio and Television and a Samoan television broadcaster. It calls for both sides to carry out in-depth cooperation in program exchange, co-production, and personnel exchanges and visits. // Additionally, Samoan audiences will soon be able to watch Chinese productions, including China Theater and Canton Today, on their home screens. // The signing ceremony was an agenda item of the Guangdong cultural delegation's visit to Samoa and is considered one of the important outcomes of the 2026 Charming China (Guangdong): Lingnan Culture Travels to the South Pacific program. // During the ceremony, dual photo and product exhibitions were featured. The Shenzhen-produced film Dear You also made its Samoa premiere. // Chinese Ambassador to Samoa Fei Mingxing reviewed the historical ties between the two sides and thanked Guangdong for its contributions to China-Samoa friendship. \"China is ready to deepen exchanges and mutual learning among civilizations with Samoa to enable the China-Samoa community with a shared future to make steady and sustained progress,\" said Fei. // Deng Hong, deputy director of Guangdong's information office, said the province is ready to innovate and expand exchanges and cooperation with Samoa in culture, journalism, and other fields to serve the growth of bilateral relations. // For years, Guangdong Radio and Television has partnered with television media across the South Pacific region. Programs have aired in multiple South Pacific island countries. // This year marks the 51st anniversary of the establishment of diplomatic relations between China and Samoa.","In China Officials","Deng Hong","Information & Media","Agreement / MOU","Apia","Tuamāsaga","Ministry / Government Department","Unspecified","N/A","N/A","N/A","https://www.chinadaily.com.cn/a/202608/06/WS6a73fc80a310986e2b4694e9.html","",""],["7053","Samoa","Apia","Facebook","https://www.facebook.com/share/p/1Ayibp6Xkb/","8/13/26","Unspecified","8/13/26","Amb wife leads first ladies to SCATAP demo","Today, the SCATAP Demonstration Farm had the great honour of welcoming a special delegation comprising Madam Li, spouse of the Ambassador of the People’s Republic of China to Samoa, Mrs. Tupea Heather Schmidt, spouse of the Prime Minister of Samoa, and approximately 13 spouses of Cabinet Ministers and Associate Ministers. // The visit was initiated by Madam Li and proudly hosted by the Ministry of Agriculture and Fisheries (MAF) in partnership with the Samoa–China Agricultural Technical Aid Project (SCATAP). // The programme began with a warm welcome from ACEO Mataia Levaopolo Ricky Faatonu, followed by presentations and an overview of SCATAP’s key initiatives and achievements by Mr. Tang Guoxiang, Acting Team Leader and poultry expert. Our Chinese agricultural experts shared presentations on poultry, piggery, vegetable production, mushroom cultivation, and other agricultural activities, with MAF officers interpreting the presentations into Samoan to ensure everyone could fully participate. // The guests showed great interest throughout the presentations, taking notes, asking thoughtful questions, and engaging warmly with the experts and officers. // Following a group photograph, the delegation toured the piggery, chicken farm, vegetable plots, and feed mill, where they had the opportunity to see firsthand the technologies, production methods, new varieties, and practical agricultural initiatives being implemented through SCATAP. Their genuine curiosity and enthusiasm made the visit particularly special. // The warmth continued back in the conference room, where our guests shared two delicious coconut cakes, while SCATAP and MAF complemented the gathering with pizza. The atmosphere was truly one of friendship, fellowship, and family. // During the meal, heartfelt words of appreciation were shared by a representative of the delegation, the spouse of the Prime Minister, and Madam Li. Each lady was also invited to introduce herself and share her reflections. Their sincere appreciation and encouraging words for the work of SCATAP touched everyone present. // Before departing, each guest received a gift bag filled with fresh fruits, vegetables, chicken, and coffee produced from the farm. The smiles and appreciation on their faces beautifully reflected the spirit of the day. // This was more than just a visit. It was a celebration of friendship, partnership, agriculture, and the strong relationship between Samoa and China. // 🌱🇼🇸🇨🇳 Agriculture continues to bring our two nations closer together, and moments like today remind us of the importance of friendship, cooperation, and working together for the future of Samoa’s agricultural sector. // Fa’afetai tele lava to Madam Li, Honorable Madam Tupea Heather Schmidt, all the spouses of Cabinet Ministers and Associate Ministers, MAF, the SCATAP team, and all our agricultural experts for making this a truly memorable occasion.","Other ","Li Wenjun","Agriculture/fisheries","Project/site visit","Apia","Tuamāsaga","Ministry / Government Department","Multiple","N/A","N/A","N/A","N/A","",""],["7054","Samoa","Apia","Facebook","https://www.facebook.com/share/r/1EpT78XXcv/","8/24/26","Unspecified","8/24/26","Amb visits schools","At the invitation of Honourable Moefa'auouo Julius Ah Kui Tafunai, Minister of Family and Social Affairs, His Excellency Fei Mingxing, Chinese Ambassador to Samoa, visited Lufilufi Primary School and Manunu Primary School.","Ambassador","Fei Mingxing","Education","Meeting","Apia","Tuamāsaga","Ministry / Government Department","Moefa'auouo Julius Ah Kui Tafunai","N/A","N/A","N/A","N/A","",""],["7055","Samoa","Apia","Facebook","https://www.facebook.com/share/v/1G9u2stFMV/","8/30/26","Unspecified","8/30/26","Amb attends festival","Chinese Ambassador was honored to attend the opening ceremony of Measina Festival. / Wish the event a great success.","Ambassador","Fei Mingxing","People-to-People","Attend Host Ceremony","Apia","Tuamāsaga","N/A","N/A","N/A","N/A","N/A","N/A","",""],["8135","Tonga","Nuku'alofa","Chinese Language Official Website","https://to.china-embassy.gov.cn/sgxw/202607/t20260731_11995931.htm","7/31/26","Unspecified","7/31/2026","Chinese language and maritime admin skills seminar","(Claude translation) The 2026 Pacific Island Countries \"Chinese Language + Maritime Administration Skills\" training program opened on the 27th in Quanzhou, Fujian. Fifteen maritime officials from 10 Pacific Island countries will take part here in three weeks of specialized instruction, on-site practical training, and cultural exchange activities. // The Pacific Island Countries \"Chinese Language + Maritime Administration Skills\" training program has been held annually since 2023. It is understood that this session is jointly hosted by the China–Pacific Island Countries Center for Poverty Reduction and Development Cooperation, the Foreign Affairs Office of the People's Government of Fujian Province, and the Fujian Maritime Safety Administration, and organized by the Quanzhou Maritime Safety Administration and Quanzhou Normal University. // Drawing on follow-up feedback from participants in previous sessions and the actual maritime development needs of Pacific Island countries, this year's training program has been considerably upgraded in the number of participating countries and regional representation, curriculum design and teaching staff arrangements, and interactive teaching content, covering core issues of concern to the island countries including the domestic implementation of international maritime conventions, the construction of maritime emergency search and rescue systems, ship safety supervision and administration, and emergency response to marine pollution incidents. // On July 27, the opening ceremony of the 2026 Pacific Island Countries \"Chinese Language + Maritime Administration Skills\" training program was held in Quanzhou, Fujian. (Photo provided by the Quanzhou Maritime Safety Administration) // In addition to traditional classroom teaching, this session has also embedded the sharing of International Maritime Organization (IMO) best-practice cases and hands-on emergency command exercises, and has organized participants to travel to Fuzhou, Pingtan, Xiamen, Zhangzhou and other locations to carry out on-site maritime training, advancing the program's shift toward demand-oriented, precisely targeted instruction and further enhancing training effectiveness. // It is understood that the Fujian Maritime Safety Administration will work jointly with relevant units to provide high-standard support throughout the training, and, using the holding of the training program as a vehicle, will work to build the program into a model example of IMO global technical cooperation and assistance for small island states' maritime capacity building, promoting \"soft connectivity, hard connectivity, and heart-to-heart connectivity\" between China and the Pacific Island countries in the maritime field, and contributing to the high-quality joint construction of the \"Belt and Road\" and the building of a closer China–Pacific Island Countries community with a shared future. //// 2026年太平洋岛国\"汉语+海事管理技能\"实训项目27日在福建泉州开班。来自10个太平洋岛国的15名海事官员将于此间参加为期三周的专业授课、现场实训及文化交流活动。 // 太平洋岛国\"汉语+海事管理技能\"实训项目自2023年起每年举办。据悉，本期项目由中国—太平洋岛国减贫与发展合作中心、福建省人民政府外事办公室与福建海事局联合主办，泉州海事局与泉州师范学院承办。 // 结合往期学员回访反馈与太平洋岛国海事发展实际需求，今年的实训项目在参与国别数量和区域代表性、课程设计和师资安排、教学互动内容等方面均有较大提升，涵盖国际海事公约国内转化、海上应急搜救体系构建、船舶安全监督管理、海洋污染事故应急处置等多项岛国关切的核心议题。 // 7月27日，2026年太平洋岛国\"汉语+海事管理技能\"实训项目开班仪式在福建泉州举行。(泉州海事局供图) // 除传统的课堂教学外，本期项目还内嵌了国际海事组织(IMO)最佳实践案例分享、应急指挥推演实操，并组织学员赴福州、平潭、厦门、漳州等地开展海事现场实训等环节，推动项目向需求导向型精准施教转变，进一步提升实训效果。 // 据了解，福建海事局将联合相关单位高标准做好培训全程保障工作，并以实训项目举办为载体，着力将项目打造为IMO全球技术合作及帮扶小岛屿国家海事能力建设的示范样板，促进中国与太平洋岛国海事领域\"软联通、硬联通、心联通\"，为高质量共建\"一带一路\"、构建更加紧密的中国—太平洋岛国命运共同体贡献力量。","In China Officials","N/A","Multilateral/Regional Engagement","In China Seminar","Quanzhou",
