<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPEM Dashboard | Trial Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM&#43;Plex&#43;Mono:wght@400;500;600&amp;family=IBM&#43;Plex&#43;Sans:wght@400;500;600&amp;family=Source&#43;Serif&#43;4:opsz,wght@8..60,500;8..60,600;8..60,700&amp;family=VT323&amp;family=Space&#43;Mono:wght@400;700&amp;family=Monoton&amp;family=Space&#43;Grotesk:wght@400;500;700&amp;family=Archivo&#43;Black&amp;family=Share&#43;Tech&#43;Mono&amp;family=Rubik:wght@400;500;700&amp;family=Rubik&#43;Mono&#43;One&amp;family=Nunito:wght@400;600;700&amp;family=Fredoka:wght@500;600&amp;family=Special&#43;Elite&amp;family=Courier&#43;Prime:wght@400;700&amp;family=Outfit:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<style>
   
  :root, [data-theme="ops"] {
    --bg: #0a0e13; --panel: #10161e; --panel-2: #141c26; --line: #1f2b38; --line-2: #2a3a4b;
    --ink: #d7dfe7; --strong: #ffffff; --muted: #7c8a99; --dim: #56636f;
    --accent: #f0a830; --accent-hi: #ffd58a; --on-accent: #000;
    --chart: #3ec6e0; --chart-hi: #9eeefc; --link: #3ec6e0;
    --prc: #ff5c5c; --pic: #3ddc97;
    --banner-bg: #f0a830; --banner-ink: #000;
    --head-bg: rgba(10,14,19,.94); --head-ink: #d7dfe7; --head-muted: #7c8a99; --head-accent: #f0a830;
    --sea: #06090d; --land: #142029; --coast: #2b3c4c; --grat: rgba(62,198,224,.07);
    --grid: rgba(62,198,224,.035); --glow: 1; --radius: 3px;
    --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --f-label: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --f-head: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --label-case: uppercase; --label-track: .14em; --head-case: uppercase; --head-track: .08em;
    --h-prefix: "// "; color-scheme: dark;
  }
   
  [data-theme="tafi-navy"] {
    --bg: #061a2e; --panel: #0a2540; --panel-2: #0f2e4f; --line: #1a3d61; --line-2: #26507a;
    --ink: #e4ebf2; --strong: #ffffff; --muted: #97a9bd; --dim: #6b8199;
    --accent: #c89116; --accent-hi: #e7b94e; --on-accent: #0a2540;
    --chart: #c89116; --chart-hi: #e7b94e; --link: #e7b94e;
    --prc: #ef6b5b; --pic: #6cc4a1;
    --banner-bg: #c89116; --banner-ink: #0a2540;
    --head-bg: rgba(6,26,46,.96); --head-ink: #ffffff; --head-muted: #97a9bd; --head-accent: #c89116;
    --sea: #051626; --land: #133454; --coast: #2a5680; --grat: rgba(228,235,242,.06);
    --grid: transparent; --glow: .7; --radius: 2px;
    --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --f-label: "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif;
    --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --f-head: Georgia, "Source Serif 4", "Times New Roman", serif;
    --label-case: uppercase; --label-track: .1em; --head-case: none; --head-track: 0;
    --h-prefix: ""; color-scheme: dark;
  }
   
  [data-theme="tafi-report"] {
    --bg: #f4f6f9; --panel: #ffffff; --panel-2: #f2f4f6; --line: #dde3ea; --line-2: #c7d1dc;
    --ink: #1b2733; --strong: #0a2540; --muted: #5d6b7a; --dim: #8795a3;
    --accent: #c89116; --accent-hi: #a97a10; --on-accent: #ffffff;
    --chart: #0a2540; --chart-hi: #2d5a88; --link: #0a2540;
    --prc: #b3261e; --pic: #1f7a55;
    --banner-bg: #0a2540; --banner-ink: #e4ebf2;
    --head-bg: #0a2540; --head-ink: #ffffff; --head-muted: #b7c4d3; --head-accent: #c89116;
    --sea: #e4ebf2; --land: #ffffff; --coast: #9fb2c6; --grat: rgba(10,37,64,.07);
    --grid: transparent; --glow: .35; --radius: 2px;
    --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --f-label: "IBM Plex Sans", -apple-system, "Segoe UI", Arial, sans-serif;
    --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --f-head: Georgia, "Source Serif 4", "Times New Roman", serif;
    --label-case: uppercase; --label-track: .08em; --head-case: none; --head-track: 0;
    --h-prefix: ""; color-scheme: light;
  }
   
  [data-theme="chart"] {
    --bg: #efe9da; --panel: #f8f4e9; --panel-2: #efe8d6; --line: #d8ccb0; --line-2: #c2b390;
    --ink: #20343f; --strong: #102530; --muted: #5f6b68; --dim: #8e8f86;
    --accent: #c0392b; --accent-hi: #8e2519; --on-accent: #ffffff;
    --chart: #1f5870; --chart-hi: #123b4d; --link: #1f5870;
    --prc: #c0392b; --pic: #2f6e4f;
    --banner-bg: #102530; --banner-ink: #efe9da;
    --head-bg: rgba(239,233,218,.96); --head-ink: #102530; --head-muted: #5f6b68; --head-accent: #c0392b;
    --sea: #cfe0e3; --land: #efe3c4; --coast: #8f7f5c; --grat: rgba(31,88,112,.18);
    --grid: rgba(31,88,112,.05); --glow: .4; --radius: 2px;
    --f-body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --f-label: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --f-data: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --f-head: "Source Serif 4", Georgia, serif;
    --label-case: uppercase; --label-track: .14em; --head-case: uppercase; --head-track: .12em;
    --h-prefix: "§ "; color-scheme: light;
  }

   
  :root, [data-theme] {
    --accent-soft: color-mix(in srgb, var(--accent) 13%, transparent);
    --accent-line: color-mix(in srgb, var(--accent) 40%, transparent);
    --chart-soft: color-mix(in srgb, var(--chart) 13%, transparent);
    --chart-line: color-mix(in srgb, var(--chart) 30%, transparent);
    --prc-soft: color-mix(in srgb, var(--prc) 12%, transparent);
    --pic-soft: color-mix(in srgb, var(--pic) 12%, transparent);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); font: 13px/1.5 var(--f-body);
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--bg);
    min-height: 100vh;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; }

  .banner { font: 600 10px/1 var(--f-label); letter-spacing: .22em; text-align: center; padding: 5px 0; color: var(--banner-ink); background: var(--banner-bg); text-transform: uppercase; }
  header { background: var(--head-bg); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: 12px 22px 0; position: sticky; top: 0; z-index: 5; color: var(--head-ink); }
  [data-theme="tafi-report"] header { border-bottom: 3px solid var(--head-accent); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .reticle { width: 34px; height: 34px; border: 1px solid var(--head-accent); border-radius: 50%; position: relative; flex: none; }
  .reticle::before, .reticle::after { content: ""; position: absolute; background: var(--head-accent); }
  .reticle::before { left: 50%; top: -5px; bottom: -5px; width: 1px; }
  .reticle::after { top: 50%; left: -5px; right: -5px; height: 1px; }
  .reticle span { position: absolute; inset: 11px; border-radius: 50%; background: var(--head-accent); box-shadow: 0 0 calc(10px * var(--glow)) var(--head-accent); }
  h1 { font: 600 15px/1.2 var(--f-head); letter-spacing: var(--head-track); margin: 0; text-transform: var(--head-case); color: var(--head-ink); }
  [data-theme^="tafi"] h1, [data-theme="chart"] h1 { font-size: 19px; }
  h1 b { color: var(--head-accent); font-weight: inherit; }
  .sub { color: var(--muted); font: 11px/1.4 var(--f-label); letter-spacing: .04em; }
  header .sub { color: var(--head-muted); }
  .status { display: flex; gap: 10px; align-items: center; font: 11px var(--f-label); color: var(--head-muted); flex-wrap: wrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--pic); letter-spacing: .12em; }
  [data-theme="tafi-report"] .live { color: #7fe0b5; } [data-theme="tafi-report"] .live i { background: #7fe0b5; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--pic); box-shadow: 0 0 calc(8px * var(--glow)) var(--pic); animation: pulse 2s infinite; }
  .live.busy { color: var(--head-accent); } .live.busy i { background: var(--head-accent); }
  @keyframes pulse { 50% { opacity: .25; } }
  .theme-pick { font: 11px var(--f-label); padding: 5px 7px; }
  header .btn, header select { background: transparent; color: var(--head-ink); border-color: color-mix(in srgb, var(--head-ink) 30%, transparent); }
  header select option { color: #000; background: #fff; }
  nav { display: flex; gap: 2px; margin-top: 12px; flex-wrap: wrap; }
  nav button { border: 0; background: none; padding: 9px 14px; border-bottom: 2px solid transparent; cursor: pointer; font: 500 11px var(--f-label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--head-muted); }
  nav button:hover { color: var(--head-ink); }
  nav button.on { color: var(--head-accent); border-bottom-color: var(--head-accent); background: linear-gradient(to top, color-mix(in srgb, var(--head-accent) 14%, transparent), transparent); }
  [data-theme="tafi-report"] nav button.on { color: #fff; }

  main { padding: 18px 22px 40px; max-width: 1440px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; position: relative; }
  [data-theme="ops"] .card::before, [data-theme="tafi-navy"] .card::before { content: ""; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px; border-top: 1px solid var(--accent); border-left: 1px solid var(--accent); }
  [data-theme="tafi-report"] .card { box-shadow: 0 1px 2px rgba(10,37,64,.06); }
  [data-theme="chart"] .card { box-shadow: inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--line); }
  .card h3 { margin: 0 0 12px; font: 600 11px var(--f-label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--strong); }
  .card h3::before { content: var(--h-prefix); color: var(--accent); }
  [data-theme^="tafi"] .card h3 { font: 700 15px var(--f-head); letter-spacing: 0; text-transform: none; }
  [data-theme="tafi-report"] .card h3 { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  [data-theme="tafi-navy"] .card h3 { color: #fff; }
  [data-theme="tafi-navy"] .card h3::after { content: ""; display: block; width: 28px; height: 2px; background: var(--accent-hi); margin-top: 6px; }
  .card h3 .sub { text-transform: none; letter-spacing: .02em; font-weight: 400; font-family: var(--f-label); }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input, select { font: 12px var(--f-label); padding: 7px 9px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--panel); color: var(--ink); outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  input::placeholder { color: var(--dim); }
  input[type=search] { min-width: 280px; flex: 1; }
  select option { background: var(--panel); color: var(--ink); }
  .btn { font: 500 11px var(--f-label); letter-spacing: .1em; text-transform: uppercase; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--accent); border-radius: var(--radius); padding: 12px 14px; }
  [data-theme="tafi-report"] .kpi { border-left: 0; border-top: 3px solid var(--accent); }
  .kpi .l { font: 500 10px var(--f-label); text-transform: var(--label-case); letter-spacing: var(--label-track); color: var(--muted); }
  .kpi .v { font: 600 24px/1.2 var(--f-data); margin-top: 6px; color: var(--strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [data-theme^="tafi"] .kpi .v { font: 700 28px/1.15 var(--f-head); }
  .kpi .s { font: 11px var(--f-label); color: var(--muted); margin-top: 2px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
  .bar-row { display: grid; grid-template-columns: 170px 1fr 56px; gap: 10px; align-items: center; padding: 4px 6px; cursor: pointer; border-radius: var(--radius); }
  .bar-row:hover { background: var(--panel-2); }
  .bar-row.on { background: var(--accent-soft); outline: 1px solid var(--accent-line); }
  .bar-row .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .track { background: var(--bg); height: 8px; border: 1px solid var(--line); overflow: hidden; }
  .fill { background: linear-gradient(90deg, color-mix(in srgb, var(--chart) 35%, transparent), var(--chart)); height: 100%; box-shadow: 0 0 calc(8px * var(--glow)) color-mix(in srgb, var(--chart) 50%, transparent); }
  [data-theme^="tafi"] .fill, [data-theme="chart"] .fill { background: var(--chart); box-shadow: none; }
  .bar-row.on .fill { background: var(--accent); }
  .num { text-align: right; font: 12px var(--f-data); font-variant-numeric: tabular-nums; color: var(--strong); }

  .months { display: flex; align-items: flex-end; gap: 5px; height: 190px; padding-top: 20px; overflow-x: auto; border-bottom: 1px solid var(--line-2);
    background: repeating-linear-gradient(to top, transparent 0 32px, color-mix(in srgb, var(--muted) 12%, transparent) 32px 33px); }
  .mcol { flex: 1 0 36px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; }
  .mbar { width: 70%; background: linear-gradient(to top, color-mix(in srgb, var(--chart) 25%, transparent), var(--chart)); border-top: 2px solid var(--chart-hi); }
  [data-theme^="tafi"] .mbar, [data-theme="chart"] .mbar { background: var(--chart); border-top: 0; }
  .mcol:hover .mbar { filter: brightness(1.2); }
  .mcol.on .mbar { background: var(--accent); border-top-color: var(--accent-hi); }
  .mcnt { font: 11px var(--f-data); color: var(--ink); margin-bottom: 3px; }
  .mlab { font: 10px var(--f-label); color: var(--muted); margin-top: 6px; white-space: nowrap; text-transform: uppercase; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font: 500 10px var(--f-label); text-transform: var(--label-case); letter-spacing: var(--label-track); color: var(--muted); border-bottom: 1px solid var(--line-2); padding: 8px; background: var(--panel-2); position: sticky; top: 0; }
  [data-theme="tafi-report"] th { background: #0a2540; color: #fff; font-weight: 600; }
  td { border-bottom: 1px solid var(--line); padding: 8px; vertical-align: top; }
  [data-theme="tafi-report"] tbody tr:nth-child(even) td { background: #f7f9fb; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel-2); }
  tr.click:hover td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  .tag { display: inline-block; padding: 1px 7px; border-radius: var(--radius); font: 500 10px/1.6 var(--f-label); letter-spacing: .06em; text-transform: uppercase; background: var(--chart-soft); color: var(--chart); border: 1px solid var(--chart-line); }
  [data-theme="tafi-report"] .tag { background: #e4ebf2; color: #0a2540; border-color: #c9d6e3; }
  .tag.prc { background: var(--prc-soft); color: var(--prc); border-color: color-mix(in srgb, var(--prc) 30%, transparent); }
  .tag.pic { background: var(--pic-soft); color: var(--pic); border-color: color-mix(in srgb, var(--pic) 30%, transparent); }
  .mono { font-family: var(--f-data); font-size: 12px; color: var(--accent); }
  td.mono { width: 1%; white-space: nowrap; padding-right: 18px; }
  .modal .btn { align-self: flex-start; }
  .muted { color: var(--muted); }
  .pager { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }

  .actor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .actor-card { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; cursor: pointer; background: var(--panel-2); transition: border-color .15s, transform .15s; }
  .actor-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .actor-card b { display: block; margin: 2px 0; color: var(--strong); }

  .overlay { position: fixed; inset: 0; background: rgba(3,6,9,.7); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
  .overlay.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line-2); border-top: 3px solid var(--accent); border-radius: var(--radius); max-width: 800px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .modal h2 { margin: 6px 0; font: 600 18px/1.35 var(--f-head); color: var(--strong); }
  .modal h3 { font: 600 11px var(--f-label); letter-spacing: var(--label-track); text-transform: var(--label-case); color: var(--strong); }
  .modal h3::before { content: var(--h-prefix); color: var(--accent); }
  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 6px 14px; margin: 14px 0; padding: 12px; border: 1px solid var(--line); background: var(--bg); }
  .kv div:nth-child(odd) { color: var(--muted); font: 10px/1.9 var(--f-label); text-transform: var(--label-case); letter-spacing: .12em; }
  .kv a { word-break: break-all; }
  .box { background: var(--bg); border: 1px solid var(--line); border-left: 2px solid var(--chart); padding: 10px 12px; margin: 8px 0; white-space: pre-wrap; }
  .warn { background: var(--accent-soft); border-color: var(--accent-line); border-left-color: var(--accent); color: var(--ink); }
  .ok { color: var(--pic); font: 600 11px var(--f-label); letter-spacing: .1em; }
  .bad { color: var(--prc); font: 600 11px var(--f-label); letter-spacing: .1em; }
  .empty { padding: 40px; text-align: center; color: var(--muted); font-family: var(--f-label); letter-spacing: .06em; }
  a { color: var(--link); }
  footer { text-align: center; font: 10px var(--f-label); letter-spacing: .18em; color: var(--dim); padding: 0 0 24px; text-transform: uppercase; }

   
  .maphead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .maphead h3 { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
  .seg button { border: 0; border-right: 1px solid var(--line-2); background: var(--panel); color: var(--muted); font: 500 11px var(--f-label); letter-spacing: .12em; text-transform: uppercase; padding: 7px 13px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .maplayout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; }
  @media (max-width: 1050px) { .maplayout { grid-template-columns: 1fr; } }
  .mapwrap { position: relative; background: var(--sea); border: 1px solid var(--line); overflow: hidden; min-height: 200px; }
  .mapsvg { display: block; width: 100%; height: auto; cursor: grab; }
  .mapsvg:active { cursor: grabbing; }
  .land { fill: var(--land); stroke: var(--coast); stroke-width: .7; vector-effect: non-scaling-stroke; }
  .borders { fill: none; stroke: var(--coast); stroke-width: .5; vector-effect: non-scaling-stroke; }
  .grat { fill: none; stroke: var(--grat); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .pt { cursor: pointer; }
  .pt .dot { fill: var(--accent); stroke: var(--accent-hi); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .pt .core { fill: var(--panel); }

26","8/5/26","8/5/26","Meeting on implementation of 4th phase Juncao","👏👏👏 The Meeting on the Implementation for the Fourth Phase of Technical Assistance for China–Aid Juncao Technology Demonstration Centre Project in Fiji was successfully held on 5 August 2026. Representatives from the Fiji Ministry of Agriculture and Waterways, together with experts from the Chinese team, discussed the project’s objectives, key tasks, implementation arrangements, and future cooperation. // The Fourth Phase officially commenced on 20 July 2026 and will run for three years. The new phase will further strengthen China-Fiji cooperation on Juncao technology, with a focus on mushroom production, livestock feed, demonstration and training, research, and technology promotion, contributing to sustainable agricultural development and improved livelihoods in Fiji.","Other China-host official org","Unspecified","Agriculture/fisheries","Briefing","Suva","Rewa","Ministry / Government Department","Unspecified","N/A","N/A","We're pleased to see the launch of the Fourth-Phase Technical Assistance of the China-Aid Juncao Technology Demonstration Centre Project in Fiji.  // Juncao is a practical example of China-Fiji cooperation delivering tangible benefits to local communities, supporting sustainable agriculture, food security and livelihoods. We look forward to seeing continued progress and deeper cooperation in agro-technology and rural development.","N/A","",""],["1081","Fiji","Suva","Facebook","https://www.facebook.com/share/p/19HH2rXtHG/","8/12/2026","Unspecified","8/12/26","Meeting on language program for schools","Students in selected primary and secondary schools could soon have the opportunity to learn Chinese as Fiji explores the introduction of a Chinese language programme within the education system. // The proposed programme will be piloted in 12 schools in the Central Division, comprising six primary and six secondary schools. It aims to introduce students to the Chinese language and vent the DA China, announced the continued support China will provide in coming months to support sustaining RFNS Kacau. The Republic of Fiji Navy sincerely thanks the Defence Attaché and the Government of the People’s Republic of China for continued partnership. // Stronger partnerships. Greater readiness. A safer and more secure maritime Fiji.","Defense Attaché","Zhang Yu","Security & Defense","Embassy Event","Suva","Rewa","Military / Security Org","Unspecified","N/A","N/A","N/A","N/A","",""],["1083","Fiji","Suva","Official Website","https://fj.china-embassy.gov.cn/eng/sgxw/202608/t20260825_12009567.htm","8/25/2026","8/22/26","8/22/26","Embassy visit to handball team","On August 22, diplomats from the Chinese Embassy in Fiji, led by Chargé d’Affaires a.i. Wang Yuan, visited the training site of the Handball Fiji Team to hold a networking event with the team. More than 30 people, including President of the Handball Fiji Federation, and coaches and athletes of the team, attended the event. Young diplomats joined the team in a training. // Wang Yuan said that the Handball Fiji Team recently represented Oceania at the World Championship in Romania for the first time, broadening horizons and gaining valuable experience. He expressed the hope that the team would improve competitiveness through more training and strive for greater achievements, with a view to contributing to China-Fiji sports exchanges. // President of the Handball Fiji Federation Sainimili Saukuru extended gratitude to the Chinese Embassy for supporting the team in competing abroad. She expressed the willingness to strengthen bilateral interaction through sports exchanges between the two sides.","Chargé de affairs","Wang Yuan","Sports","Meeting","Suva","Rewa","Civil Society / NGO","Sainimili Saukuru","N/A","N/A","N/A","N/A","",""],["1084","Fiji","Suva","Facebook","https://www.facebook.com/share/p/1DJWRN4DFK/","8/24/2026","Unspecified","8/24/26","School visit to juncao center","A warm welcome to the teachers and students of Rewa NOCO School to the China-Fiji Juncao Technology Demonstration Center. // We were delighted to share our work on Juncao Technology, mushroom cultivation, and sustainable agricultural practices, and to introduce the students to some of the applications and benefits of Juncao Technology. // Thank you to Mr. Praveen Chand of Votualevu College for your kind support in making this visit possible.  // Looking forward to seeing you again! 🇨🇳🇫🇯","Other China-host official org","Unknown","Agriculture/fisheries","Project/site visit","Suva","Rewa","Education / University","Praveen Chand","N/A","N/A","N/A","N/A","",""],["1085","Fiji","Suva","Facebook","https://www.facebook.com/share/p/14nvbkiaZgk/","8/27/2026","Unspecified","8/27/26","Groundbreaking for emb funded RFMF center","The Republic of Fiji Military Forces (RFMF) marked a significant milestone yesterday with the ground-breaking ceremony for the new RFMF Family Welfare Resource Centre at Queen Elizabeth Barracks, a $160,000 project funded by the Government of the People’s Republic of China. // The Centre will provide a dedicated hub for family welfare and support services, including counselling, health liaison, education support and community engagement, aimed at strengthening the wellbeing, resilience and connectedness of RFMF personnel and their families. // The ceremony was attended by the Commander RFMF, Major General Jone Kalouniwai, and his spouse, together with representatives of the Embassy of the People’s Republic of China, senior RFMF officers and members of the RFMF Wives and Mothers Club. The Commander and his spouse, alongside the Chinese Embassy representative, officially turned the first cement to mark the commencement of construction. // Expected to be completed by October 2026, the Centre will be a 208-square-metre prefabricated structure comprising a self-contained kitchen, office space, ablution facilities and a large open area for welfare activities. // Once completed, the facility will be managed by the RFMF Welfare Cell and will provide a dedicated venue for family welfare programmes, including education, employment guidance and financial literacy initiatives. The RFMF Wives and Mothers Club will also play a key role in utilising the Centre to strengthen its activities and support RFMF families. // The project was envisioned under the RFMF Strategic Plan Beyond 2022, which emphasises resilience, readiness and the holistic wellbeing of RFMF personnel, recognising that the strength of the Force is closely connected to the welfare of its families. // The project will be constructed by Zhongding International Engineering Ltd and coordinated by the Directorate of Force Development and Strategic Commitment. // Held under the theme “Strengthening Families, Supporting Service, Building Our Future,” the ceremony highlighted the RFMF's continued commitment to family welfare and acknowledged the support of the Government of the People’s Republic of China in supporting the project.","Defense Attaché","Zhang Yu","Security & Defense","Project/site visit","Rewa","Rewa","Military / Security Org","Jone Kalouniwai","N/A","N/A","Great milestone for China‑Fiji defence cooperation. // The Chinese‑funded RFMF Resource Centre will bring tangible benefits to service members and their families.","N/A","",""],["1086","Fiji","Suva","Other Facebook","https://www.facebook.com/share/p/1DMyvA4MZD/","8/25/2026","Unspecified","8/25/26","NOTC delegation to PIDF","🌊 The Pacific Islands Development Forum (PIDF) recently welcomed researchers from China’s National Ocean Technology Center, who are in Fiji conducting Marine Spatial Planning (MSP) along our coastlines. // This work supports PIDF’s efforts to develop National Blue Economy Roadmaps for Pacific Island countries, strengthen ocean governance, and promote sustainable marine development through capacity building, knowledge sharing, and international partnerships. ","In China Officials","Unknown","Development","Meeting","Suva","Rewa","Multilateral organization","Unknown","N/A","N/A","N/A","N/A","",""],["2057","FSM","Palikir","Facebook","https://www.facebook.com/share/v/18fzeshjtD/","8/4/26","Unspecified","8/4/26","Representatives at parliamentary seminar in China","Of the participating parliamentarians from Pacific Island Countries, we extend our particular gratitude to The Hon. Robson U. Romolow, Vice Speaker of the Congress of the FSM, The Hon. Yoslyn G. Sigrah, Chairperson for the Special Committee on Climate Change and Environmental Issues and The Hon. Jermy W. Mudong, Vice Chairman of the Committee on Education, for representing the FSM at the Pacific Island Countries Workshop for Parliament Members, which has recently concluded successfully. @粉丝 // During the workshop, Pacific Island parliament members engaged in in-depth exchanges and field visits in Kunming 🌿. Participants gained valuable insights into China’s practices in ecological civilization development, green and low-carbon growth, biodiversity conservation and modern governance. // China and Pacific Island Countries share extensive common interests and similar development aspirations, particularly in tackling climate change, growing the sustainable blue economy and improving island governance 🌊. This workshop will further strengthen mutual understanding and mutual learning between China and Pacific Island nations. //We look forward to deepening pragmatic cooperation and advancing efforts to build a closer China-Pacific Island Countries community with a shared future 🤝.","In China Officials","N/A","Governance","In China Seminar","Beijing","Beijing","Member of Parliament/legislator","Multiple","N/A","N/A","N/A","N/A","",""],["2058","FSM","Palikir","Facebook","https://www.facebook.com/share/p/19KM2EHPiJ/","8/6/26","8/6/26","8/6/26","Meeting with Pohnpei governor on gym project","Courtesy Call by Chinese Ambassador Wu Wei on Acting Governor Herolyn S. Movick to Discuss Multi‑Purpose Gymnasium in Kitti // Pei Lapalap, Pohnpei: August 6, 2026 – Acting Governor Herolyn S. Movick received a courtesy call from His Excellency Wu Wei, Chinese Ambassador to the Federated States of Micronesia (FSM), to discuss plans for the construction of a new multi‑purpose gymnasium in Kitti Municipality, Pohnpei State. // During the meeting, Ambassador Wu Wei and Acting Governor Movick exchanged views on how to advance a long‑standing community priority for Kitti: the development of an indoor facility that can serve as both a sports venue and a community gathering space. The proposed gymnasium is envisioned as a multi‑purpose facility that can accommodate basketball and other court sports, cultural events, and public meetings for the people of Kitti and surrounding communities. // Ambassador Wu Wei briefed Acting Governor Movick on preliminary concepts and funding parameters for the project, including options for: // A simpler, cost‑effective gymnasium design similar to existing facilities in other municipalities; and // A more comprehensive, modern multi‑purpose facility, potentially including seating areas, sound systems, and other enhancements, depending on the final budget and design agreed by both sides. // Acting Governor Movick welcomed the proposal, stressing that Kitti is currently the only area in Pohnpei without such a multi‑purpose indoor facility and noting that the project has been a long‑held aspiration for the community. She expressed appreciation for China’s willingness to explore support for the gymnasium and affirmed Pohnpei State’s commitment to work closely with municipal leaders and other stakeholders to move the project forward. //As part of the next steps, Acting Governor Movick will: // Consult with Kitti Municipal Government and traditional leaders to confirm community needs and priorities for the gymnasium’s design and functions. // Coordinate with relevant land and community authorities to secure the proposed site and ensure proper land arrangements. // Consolidate local requirements into a preliminary concept and sketch for the facility, to be shared with // Ambassador Wu Wei and Chinese government counterparts in the coming weeks. // This consolidated plan will guide further technical discussions and enable the Government of the People’s Republic of China to review the proposal in Beijing. // Both sides reaffirmed their commitment to working collaboratively to deliver a facility that will benefit youth, students, and the wider community in Kitti, and deepen the longstanding friendship and cooperation between Pohnpei State and the People’s Republic of China.","Ambassador","Wu Wei","Development","Meeting","Palikir","Pohnpei","Local Government","Herolyn S. Movick","N/A","N/A","N/A","N/A","",""],["2059","FSM","Palikir","Facebook","https://www.facebook.com/share/p/1EhbiszxEh/","8/19/26","Unspecified","8/19/26","Amb attends Micronesian Islands Forum","KASELEHLIE! 🌴 Congratulations to Pohnpei State for hosting the 28th Micronesian Islands Forum! // The Chinese Embassy joins the opening ceremony as an observer, and is pleased to be part of the efforts to support the forum’s hospitality and logistical requirements. This year's theme — \"Promote Healthy Communities, Open Doors to Learning\" — speaks to the heart of what Pacific island communities strive for every day. // Looking forward to continued cooperation for a healthier, brighter future across Micronesia. 🤝@粉丝","Ambassador","Wu Wei","Multilateral/Regional Engagement","Multilateral Participation","Palikir","Pohnpei","Multilateral organization","N/A","N/A","N/A","N/A","N/A","",""],["2060","FSM","Palikir","Facebook","https://www.facebook.com/share/p/1c2LZGDbyP/","8/21/26","8/20/26","8/20/26","1st and 2nd lady attend ag project","On August 20, we were thrilled to welcome the First and Second Ladies from Pohnpei, Chuuk, and Kosrae for a special visit. // 🌱 With our Chinese ag experts and the Pohnpei State Ag team as guides, they explored our eco‑friendly circular farming model, stepped into the greenhouses, and even picked some fresh veggies themselves – nothing beats the taste of farm‑to‑table! // 🐖 They also checked out our biogas systems, spotless pig pens, and artificial insemination station. // And guess what? They loved our sustainable approach and innovative techniques! // 📸 We wrapped up with a big group photo and lots of smiles – a perfect snapshot of the warm friendship and growing partnership between China and Micronesia. This visit wasn't just about showing off our work; it was about sharing knowledge, building trust, and having fun along the way.","Other China-host official org","Unspecified","Agriculture/fisheries","Project/site visit","Pohnpei","Pohnpei","Other ","Ancelly Simina","N/A","N/A","N/A","N/A","",""],["2061","FSM","Palikir","Facebook","https://www.facebook.com/share/p/1HYVwMEj9G/","8/31/26","8/28/26","8/28/26","Speaker meets with CIDCA","Chairman of the China International Development Cooperation Agency Chen Xiaodong Meets with Speaker of the Congress of the Federated States of Micronesia T.H. Esmond B. Moses // On August 28, 2026, Chen Xiaodong, Chairman of the China International Development Cooperation Agency (CIDCA), met in Beijing with a delegation led by T.H. Esmond B. Moses, Speaker of the Congress of the Federated States of Micronesia (FSM), who is in China attending the Workshop on Friendly Exchanges for Members of the FSM Congress and State Legislature. // Chen said that China regards the FSM as a good friend, good partner, and good brother. China supports the FSM in safeguarding its national sovereignty, security, and development interests, and supports the FSM in pursuing a development path suited to its national conditions. In recent years, under the strategic guidance of the leaders of both countries, the China-FSM Comprehensive Strategic Partnership has maintained a sound and steady momentum of development. CIDCA stands ready to work with the FSM to continue deepening practical cooperation on development, promote the in-depth implementation of the Global Development Initiative in the FSM, and deliver greater benefits to the people of both countries. // Moses spoke highly of the remarkable progress in bilateral relations since the establishment of diplomatic ties between the two countries, and expressed appreciation for the strong support and assistance China has provided for FSM’s economic and social development and the improvement of people’s livelihoods. He expressed readiness to work with China to implement the important consensus reached by the heads of state of both countries, continue deepening practical cooperation in areas such as infrastructure, climate change, and green energy, and advance the FSM-China relations.","In China Officials","Chen Xiaodong","Development","Delegation to China","Beijing","Beijing","Legislative leader","Esmond B. Moses","N/A","N/A","N/A","N/A","",""],["2062","FSM","Palikir","Facebook","https://www.facebook.com/share/p/1E1JkeJY8g/","8/31/2026","8/25/26","8/25/26","Speaker meets with Qian Bo","Special Envoy for Pacific Island Countries Affairs of the Chinese Government Qian Bo Meets with Speaker of the Congress of the Federated States of Micronesia T.H. Esmond B. Moses // On August 25, 2026, Special Envoy for Pacific Island Countries Affairs of the Chinese Government Qian Bo met in Beijing with Speaker of the Congress of the Federated States of Micronesia (FSM) T.H. Esmond B. Moses, who is leading a delegation to participate in the FSM Legislators Seminar, as well as other participants of the seminar. Qian Bo briefed the guests on China’s 15th Five-Year Plan, shared the successful experience of the Communist Party of China in governance, and introduced China’s foreign policy towards Pacific Island Countries. The two sides also had in-depth and friendly exchanges on issues of mutual concern.","In China Officials","Qian Bo","Chinese policy","Meeting","Beijing","Beijing","Member of Parliament/legislator","Esmond B. Moses","N/A","N/A","N/A","N/A","",""],["3089","Kiribati","Tarawa","Facebook","https://www.facebook.com/share/p/18wPef7LEG/","8/14/26","8/14/26","8/14/26","Pre-departure training for students","On August 13th and 14th, our Embassy organized a pre-departure training course for students awarded with the Chinese Government Scholarship and provincial scholarships, helping them fully prepare for their upcoming studies and life in China. Delivered by teachers from the Chinese Education Team, the training focused on practical and essential content, including daily Chinese conversational skills, as well as key guidelines and important notes for studying and living in China. // We sincerely congratulate all the outstanding students on winning scholarships and look forward to your contribution to the friendly relations between our two nations. Wish every student a fruitful study experience, a rewarding life in China, and all the best for your future endeavors!","Other China-host official org","Unknown","Education","Briefing","Tarawa","Gilbert Islands","Education / University","Unknown","N/A","N/A","N/A","N/A","",""],["4089","Nauru","Yaren","Facebook","https://www.facebook.com/share/p/1BtYCMLc5w/","7/31/26","Unspecified","7/31/26","Attendance at health seminar","Congratulations!🥳🥳 All our Naoero friends did a fantastic job and finished their medical training programs in China this week. // Wyatt Benjamin, Marsha Ngata'mine, Jo-Gem Itaia, Chanika Engar, and Thrixeena Akua completed a professional nutrition training program. Denroy Hiram and Johana Deireragea attended a one-month training program on the application of traditional Chinese medicine in rehabilitation. Ante-Nela Adire, Corazon Dabwido, and Baronessa Moses participated in the seminar on traditional Chinese medicine culture and women's health promotion. Their dedication and effort deserve a warm round of applause.👏🏻👏🏻👏🏻 // We hope the knowledge and skills they gained will contribute to healthier families and communities across Naoero, strengthen local public health programs, and further improve healthcare services. We wish them all the best as they share what they learned with their colleagues to benefit their community.🇳🇷 // Our sincere thanks also go to Naoero Public Health for their continued support of these medical training programs.👍🏻","In China Officials","Unspecified","Healthcare","In China Seminar","Beijing","Beijing","Unspecified","Unspecified","N/A","N/A","N/A","N/A","",""],["4090","Nauru","Yaren","Official Website","https://nr.china-embassy.gov.cn/eng/dshd/202608/t20260806_11999215.htm","8/6/26","8/4/26","8/4/26","Amb meets with Bernicke","On August 4, Chinese Ambassador to Naoero Lyu Jin met with Minister for Naoero Utilities Corporation Shadlog Bernicke for an exchange of views on China–Naoero energy cooperation. Minister-Counsellor Wang Xuguang of the Chinese Embassy, Deputy Minister for Multicultural Affairs Ranin Akua, and Chief Executive Officer of the Naoero Utilities Corporation Anthony Dimapilis also attended the meeting. // Ambassador Lyu Jin noted that, despite numerous challenges, the solar power project in Naoero, constructed by a Chinese company, has been completed and put into operation. Minister Bernicke thanked the Chinese Government and the Chinese company for their dedicated efforts in ensuring the completion and operation of the project. He stressed that, against the backdrop of rising international oil prices and frequent breakdowns of Naoero’s diesel generators, the project has played an irreplaceable role in safeguarding the country’s basic electricity supply.","Ambassador","Lyu Jin","Development","Meeting","Yaren","Yaren","Ministry / Government Department","Shadlog Bernicke","N/A","N/A","N/A","N/A","",""],["4091","Nauru","Yaren","Facebook","https://www.facebook.com/share/p/1EwmHV4Sj4/","8/8/26","Unspecified","8/8/26","Amb attends public service walk","Ambassador Lyu Jin was delighted to join the weekly public service walk🏃🏻‍♂️ in support of the Government of Naoero’s initiative to build a healthier nation. // Teamed with H.E. the President, Ambassador completed his first ever cycling🚴🏻‍♂️🚴🏻‍♂️ around the entire island within one hour time, which is a bit challenging but very enjoyable.☀️ // Let’s continue staying active and see you next time at the walk.😃","Ambassador","Lyu Jin","People-to-People","Other","Yaren","Yaren","Head of Government","David Adeang","N/A","N/A","N/A","N/A","",""],["4092","Nauru","Yaren","Facebook","https://www.facebook.com/share/p/1BdLvoZbKx/","8/10/26","Unspecified","8/10/26","Completion of solar project","Good news!😃 The Naoero Solar Power Development Project, funded by Asian Development Bank and built by Chinese companies, has been completed and is in operation. // Having delivered over 4 million kilowatt-hours of electricity to Naoero’s national grid, the project has become an important contributor to the country’s power supply, helping ease local electricity shortages. // As climate change looms large and global oil prices remain high, reliable, locally generated clean energy has never been more important for Naoero’s future. China stands ready to work closely with Naoero and multilateral financial institutions, including ADB, to further advance Naoero’s green transition and sustainable development.🌳🌳","Chinese organization","Unspecified","Development","Announcement","Yaren","Yaren","N/A","N/A","Unknown","Unknown","N/A","N/A","",""],["4093","Nauru","Yaren","Facebook","https://www.facebook.com/share/p/1BpLNgbUNe/","8/21/26","Unspecified","8/21/26","Amb meets with new Oz HC","Ambassador Lyu Jin had a delightful talk with Australian High Commissioner to Naoero H.E. Lisa White in Chinese Embassy. // Both sides agreed that, as Naoero’s two largest development partners, China and Australia could work together to help Naoero build a resilient economy, realize sustainable development, and bring greater benefits to dei-Naoero.🇳🇷","Ambassador","Wu Wei","Unspecified","Meeting","Yaren","Yaren","Other ","Lisa White","N/A","N/A","N/A","N/A","",""],["4094","Nauru","Yaren","Chinese Language Official Website","https://nr.china-embassy.gov.cn/dshd/202608/t20260819_12006598.htm","8/17/26","8/15/26","8/15/26","Amb meets with returning parliamentarians from seminar","(Claude translation) On August 15, Ambassador to Nauru Lyu Jin met with Nauruan parliamentary representatives Ika, Bingham, Deiye and others who had traveled to China to attend the fourth Seminar for Parliamentarians of Pacific Island Countries, and exchanged views on this visit and on China-Nauru relations. Nauru's Deputy Minister for Health Emiu and Embassy Minister-Counsellor Wang Xuguang attended. // Lyu Jin said that this seminar carries positive significance for building a China-Pacific Island Countries community with a shared future. The itinerary included Yunnan Province, where I once worked, and he was confident that all had gained a firsthand understanding of the unity and progress of China's ethnic groups. Lyu Jin also briefed the parliamentarians on the Law of the People's Republic of China on Promoting Ethnic Unity and Progress, stressing that China is willing to strengthen exchanges with Nauru's legislature and to advance the development of China-Nauru relations. // The parliamentarians spoke highly of the visit, saying that China adheres to a people-centered development philosophy and that its social governance is highly effective and worth Nauru studying and drawing on. Yunnan has a large number of ethnic minorities, yet the various ethnic groups are united and harmonious, which reflects the safeguarding role of legislation; the recently implemented Law on Promoting Ethnic Unity and Progress is a case in point. //// 8月15日，驻瑙鲁大使吕进会见赴华参加第四期太平洋岛国议员研讨班的瑙议员代表伊卡、宾汉姆、德耶等，就此访和中瑙关系交换意见。瑙鲁卫生部副部长埃米乌和使馆公使衔参赞王旭光参加。 // 吕进表示，此次研讨班对构建中国—太平洋岛国命运共同体有积极意义。行程包括我曾工作过的云南省，相信大家对中国各民族团结进步有了直观认识。吕进并向议员介绍《中华人民共和国民族团结进步促进法》，强调中方愿加强同瑙立法机构交流，推动中瑙关系发展。 // 议员高度评价此访，表示中方坚持以人民为中心的发展思想，社会治理卓有成效，值得瑙方学习借鉴。云南少数民族数量众多，但各民族团结和谐，体现了立法保障作用，近期实施的《民族团结进步促进法》便是例证。","Ambassador","Lyu Jin","Political","Meeting","Yaren","Yaren","Member of Parliament/legislator","Multiple","N/A","N/A","N/A","N/A","",""],["4095","Nauru","Yaren","Official Website","https://nr.china-embassy.gov.cn/eng/dshd/202608/t20260825_12009821.htm","8/25/26","8/21/26","8/21/26","Amb hosts Charmaine Scotty","On the evening of August 21, Chinese Ambassador to Naoero Lyu Jin hosted a dinner for Acting President of Naoero Charmaine Scotty, Minister for Naoero Utilities Corporation Shadlog Bernicke, Minister for Sports Jesse Jeremiah, and Deputy Minister for Multicultural Affairs Ranin Akua. They had an in-depth exchange of views on the development of China-Naoero relations and practical cooperation in various fields.","Ambassador","Lyu Jin","Unspecified","Meeting","Yaren","Yaren","Ministry / Government Department","Charmaine Scotty","N/A","N/A","N/A","N/A","",""],["4096","Nauru","Yaren","Chinese Language Official Website","https://nr.china-embassy.gov.cn/dshd/202608/t20260825_12009792.htm","8/22/26","8/21/26","8/21/26","Lyu Jin visits sports center","(Claude translation) On August 21, Ambassador Lyu Jin traveled to the China-aided Nauru Sports Center project for an on-site inspection and to extend greetings to the workers there. Lyu Jin said that the China-aided Nauru Sports Center is a project of the century that implements the consensus of the two countries' leaders and deepens China-Nauru practical cooperation. At the present stage, the project team has overcome challenges and difficulties including inconvenient transport of materials and continuous rainy weather, optimizing management, working overtime to speed up construction, and operating according to the posted battle chart, and overall construction is progressing rapidly. // Going forward, the project management and construction enterprises must raise their political standing to ensure the project schedule, must strictly implement safety and quality for overseas engineering projects, and must earnestly provide logistical support for employees, striving for this landmark building symbolizing China-Nauru friendship and cooperation to be completed and put into use at an early date. // Following the event, Ambassador Lyu Jin presented rice and other condolence goods to the workers on site. //// 8月21日，吕进大使赴援瑙鲁体育中心项目实地调研并慰问现场工人。吕进表示，援瑙体育中心是落实两国领导人共识、深化中瑙务实合作的世纪工程。现阶段，项目组克服物资运输不便，天气持续降雨等挑战和困难，优化管理、加班赶工、挂图作战，整体施工进展迅速。 // 下一步，项目管理和施工企业务必提高政治站位确保项目工期，务必严格落实海外工程安全质量，务必切实做好员工后勤保障，力争这座象征中瑙友谊与合作的标志性建筑早日竣工并投入使用。 // 活动后，吕进大使向现场工人赠送大米等慰问品。","Ambassador","Lyu Jin","Development","Project/site visit","Yaren","Yaren","N/A","N/A","N/A","N/A","N/A","N/A","",""],["4097","Nauru","Yaren","Facebook","https://www.facebook.com/share/r/18ieV6kPH1/","8/29/26","8/27/26","8/27/26","Event celebrating returning students from China","On 27 August, Ambassador Lyu Jin joined Deputy Speaker and Deputy Minister for Education Isabella Dageago to meet the graduates and new enrollees of the Chinese Government Scholarship this year. // We congratulate Nsdsia Adeang, Naarahval Edongo Herman, Zeth Jose, Rebecca Angel Halstead, Eunice Hiram and Helleni Buramen for having successfully completed their studies in China, and welcome Helen Cecilia Roma Rokobuli and Naarahval Edongo Herman to embark on a new academic journey there in the coming September! // We are very proud to support dei-Naoero in pursuing higher education in China. Their study and experiences will lay a solid foundation for their future careers and personal development. // Hope all the students can apply what they learned to the development of their community and Naoero, and continue to bring the Chinese people and dei-Naoero even closer. // 再次祝贺你们，祝你们未来一切顺利 // Congratulations once again, and wish all of you every success!😃 // Our thanks also go to Nauru Department of Education who has all along supported China-Naoero cooperation in education.","Ambassador","Lyu Jin","Education","Embassy Event","Yaren","Yaren","Ministry / Government Department","Isabella Dageago","N/A","N/A","N/A","N/A","",""],["5055","Papua New Guinea","Port Moresby","Facebook","https://www.facebook.com/share/p/1GyUjiQSEZ/","7/31/26","7/31/26","7/31/26","Amb attends people-to-people thing","Chinese Ambassador to PNG Yang Xiaoguang Attended the Launch Ceremony of the “2026 Charming China(Guangdong): Lingnan Culture Travels to the South Pacific（PNG）” // On July 31, Chinese Ambassador to PNG Yang Xiaoguang attended the Launch Ceremony of the “2026 Charming China (Guangdong): Lingnan Culture Travels to the South Pacific(PNG)” and delivered remarks. PNG Foreign Minister Hon. Justin Tkatchenko, and Governor for National Capital District Hon. Powes Parkop attended the event. // Ambassador Yang reviewed the achievements over the past 50 years since the establishment of diplomatic relations between China and PNG, and thanked the Guangdong delegation’s contribution to deepening people-to-people exchanges and cooperation between the two countries. He said the Chinese side stands ready to deepen cultural exchanges with PNG, expand cooperation in various fields, and further promote the China-PNG Comprehensive Strategic Partnership. // Minister Tkatchenko thanked China for its long-standing support for the development of culture and education in PNG. He said that the PNG government firmly adheres to the one-China policy, and is willing to seize the opportunity of the 50th anniversary of PNG-China diplomatic relations to promote exchanges and cooperation in various fields and achieve more fruitful outcomes. // PNG guests from all walks of life enjoyed the wonderful performances presented by artists from Guangdong Province and students of Butuka Academy, experienced intangible cultural heritage, and viewed the exhibitions of Lingnan Cultural treasures, gaining a profound appreciation of the vastness, depth, and unique charm of Chinese culture.","Ambassador","Yang Xiaoguang","People-to-People","Embassy Event","Port Moresby","National Capital District","Ministry / Government Department","Justin Tkatchenko","N/A","N/A","N/A","N/A","",""],["5056","Papua New Guinea","Port Moresby","Facebook","https://www.facebook.com/share/p/1Cu4Zxj9zw/","8/4/26","Unspecified","8/4/26","PetroChina delegation to but LNG","The PetroChina delegation visited PNG on Monday and Tuesday this week. During the visit, the Senior representative from PetroChina International held successful meetings with Foreign Minister Hon. Justin Tkatchenko, Petroleum Minister Hon. Jimmy Maladina and leaders of the PNG National Petroleum Authority, Kumul Petroleum Holdings Ltd and ExxonMobil PNG Limited. The Chinese company demonstrated a strong interest and capacity to buy PNG’s LNG, both on the spot market and through long-term contracts. // As Chinese Ambassador Yang Xiaoguang has said, China always firmly supports free trade, firmly opposes using trade issue as a tool or weapon to conduct economic coercion against others. Threatening to stop purchasing PNG’s LNG on the spot market is short-sighted and will ultimately backfire. China boasts the world’s largest middle-income group and a supersized market. China stands ready to expand LNG import from PNG, and deepen our cooperation in trade and other areas, continuously enriching the China-PNG comprehensive strategic partnership.","Chinese organization","Unspecified","Corporate/Commercial Diplomacy","Delegation From China","Port Moresby","National Capital District","Ministry / Government Department","Justin Tkatchenko","N/A","N/A","N/A","N/A","",""],["5057","Papua New Guinea","Port Moresby","Local Media","https://www.facebook.com/share/p/1G4nVSx9Z5/","8/6/26","Unspecified","8/6/26","CRCC meets with PM","Papua New Guinea says it welcomes Chinese companies to further expand investment in the country, especially in energy, mining, maritime manufacturing, and infrastructure. // A senior delegation from China Railway Construction Corporation (CRCC) recently met with Prime Minister James Marape and Petroleum Minister Jimmy Maladina to discuss future investment opportunities. // Maladina said Chinese companies have long contributed to PNG’s transport and infrastructure development, and their growing interest in mining, oil, and gas reflects confidence in PNG’s future. // CRCC said its technical teams are conducting market research, feasibility studies, and due diligence on several potential projects before making investment decisions. // As China-PNG economic cooperation deepens, Chinese enterprises are moving from traditional construction contracts toward broader industrial investment. // For PNG, the next step is not just building projects — it is building jobs, skills, and long-term growth. 🌏","In China Officials","Unspecified","Corporate/Commercial Diplomacy","Delegation From China","Port Moresby","National Capital District","Head of Government","James Marape","N/A","N/A","N/A","N/A","",""],["5058","Papua New Guinea","Port Moresby","Facebook","https://www.facebook.com/share/p/1ErYG2zcv7/","8/25/26","8/25/26","8/25/26","Pre-departure reception for students to China","Chinese Ambassador to PNG Yang Xiaoguang Attended the Pre-Departure Reception for PNG Students to Study in China // On August 25, Chinese Ambassador to PNG H.E. Yang Xiaoguang attended the pre-departure reception for the 2026 Chinese Government Scholarship and Military Scholarship recipients held by the Chinese Embassy. About 60 guests, including officials from the Department of Prime Minister, Department of Higher Education and Department of Defence, scholarship recipients, representatives of alumni studying in China, and journalists attended the event. // Ambassador Yang introduced the remarkable achievements made by the Chinese people under the leadership of the Communist Party of China, and reviewed the positive outcomes of the firm mutual support between China and PNG on core interests and major concerns, as well as the two countries’ active efforts to advance cooperation in education and other fields. He encouraged all the students to cherish the opportunity, study hard, and enhance their capabilities, in order to contribute to PNG’s development and China-PNG friendship and cooperation. // On behalf of the Minister for Higher Education, Deputy Secretary Ms. Leah Margis thanked China for its long-term support to PNG’s development in the sector of education and others. She encouraged the students to appreciate the opportunity, respect Chinese culture, study hard and become civil ambassadors for PNG to China. // Representatives of the recipients and alumni also shared their feelings and expressed their gratitude to the Chinese Government.","Ambassador","Yang Xiaoguang","Education","Embassy Event","Port Moresby","National Capital District","Ministry / Government Department","Leah Margis","N/A","N/A","N/A","N/A","",""],["5059","Papua New Guinea","Port Moresby","Facebook","https://www.facebook.com/share/p/14ruZXuABFB/","8/28/26","8/5/26","8/5/26","Ceremony for chinese language course","Chinese Language Courses Build Cultural Bridges in PNG // On August 5, the 15th China Medical Team to PNG, together with the University of PNG School of Medicine and Health Sciences (SMHS) and Port Moresby General Hospital (PMGH), held a closing ceremony for the 2026 Chinese Language Training Courses at the SMHS New Lecture Theatre. More than 130 trainees from SMHS and PMGH participated in the 24‑week programme, showcasing their skills through fluent Chinese song performances – a vivid testament to the power of language in bringing people together. // The event was attended by SMHS Dean Professor Nakapi Tefuarani, PMGH Director Medical Services Dr. Kone Sobi, SMHS Deputy Deans Mahmood Siddiqi and George Gani, and China Medical Team Leader Dr. Xu Wei, who jointly presented completion certificates to the participants. // Courses ran at two sites – The Fourth Chinese Language Training Course at PMGH (over 80 enrolments) and The First Chinese Language Training Course at SMHS (50+ students). Beyond language instruction, the curriculum featured three cultural modules: Chinese song singing, traditional paper‑cutting, and hands‑on TCM experiences, including cupping therapy demonstrations by Dr. Tan Biao. Festive activities such as the Chinese New Year & Lantern Festival Garden Party were held at SMHS to further enrich cross‑cultural learning. // In their addresses, Professor Tefuarani and Dr Sobi praised China Medical Team’s long‑standing support for PNG’s health sector and people‑to‑people exchanges. Dr. Xu Wei encouraged the students: “I hope that the Chinese you have learned will open new doors for your career development, for China\u001ePNG health cooperation, and for the friendship between our peoples.” // The ceremony culminated in a Chinese song competition, with Olibia Barrion from SMHS winning first prize for her rendition of Tian Mi Mi. At the end of the closing ceremony, the trainees presented local PNG gifts to their teacher, Associate Professor Niu Tengfei, as a token of their gratitude.","Medical Teams","Xu Wei","Education","Embassy Event","Port Moresby","National Capital District","Hospital","Multiple","N/A","N/A","N/A","N/A","",""],["5060","Papua New Guinea","Port Moresby","Facebook","https://www.facebook.com/share/p/1CMA4JSG5f/","8/28/26","8/24/26","8/24/26","Water seminar in China","From Aug. 4 to 24, The Seminar on Integrated Water Resources Utilization and Water Environment Protection for PNG, hosted by the Ministry of Commerce of China, was successfully held in Changsha, Hunan Province, with 15 participants from PNG in attendace.","In China Officials","Unspecified","Development","In China Seminar","Changsha","Hunan","Unknown","Unknown","N/A","N/A","N/A","N/A","",""],["6166","Solomon Islands","Honiara","Local Media","https://www.facebook.com/share/p/1F4SWnbwVE/","7/31/26","Unspecified","7/31/26","SINBIP Completion Handover","HONIARA, Solomon Islands — The Solomon Islands National Broadband Infrastructure Project (SINBIP), comprising 161 telecommunications towers across the country, has been officially handed over to the Solomon Islands Government, marking a major milestone in efforts to bridge the digital divide and improve connectivity nationwide. The official handover was held on Friday at the Tenaru School grounds, Malango Ward bringing to completion one of the country's largest telecommunications infrastructure projects aimed at expanding broadband coverage and improving access to reliable communication services. The 161 towers have been strategically constructed across the Solomon Islands to strengthen connectivity for communities, businesses, schools, health facilities and government services, particularly in remote and underserved areas. The project was delivered through collaboration between the Solomon Islands Government, the Government of the People's Republic of China, the China Harbour Engineering Company (CHEC), Huawei Technologies and other development and industry partners. Speaking at the handover ceremony, CHEC Managing Director Mr Chen Wei expressed appreciation to the Ministry of Communication and Aviation (MCA), relevant Solomon Islands Government authorities and the Chinese Embassy for their guidance and support throughout the implementation of the project. He also acknowledged the contribution of participating partners, local authorities, community leaders, landowners and frontline construction workers who supported the project and helped ensure its successful completion. Mr Chen said the completed project represents a nationwide integrated broadband backbone that will help break communication barriers across remote islands and create opportunities for digital government services, rural education and inter-island trade. He said the improved infrastructure would substantially increase internet access for Solomon Islanders and provide a solid foundation for the country's growing digital economy. Mr Chen described the project as an example of mutually beneficial cooperation between China and Solomon Islands, as well as CHEC's commitment to delivering livelihood-focused projects across the South Pacific. He stressed that the handover should not be viewed as the end of cooperation but as a new starting point for long-term service and support. \"Moving forward, China Harbour will work closely with MCA and Huawei to fully implement warranty coordination, rapid fault response, and coordinated operation and maintenance technical support, ensuring stable long-term operation of all base stations across the network,\" Mr Chen said. Chinese Ambassador to Solomon Islands, His Excellency Kai Weiming, thanked the Chinese and Solomon Islands builders who worked together to overcome challenges and complete the project. He said the handover was about more than infrastructure and technical equipment, describing it as the delivery of opportunities for a digital future and more inclusive development. \"We are handing over the bridges that will connect remote communities to the modern information world. And we are handing over monuments of partnership between China and Solomon Islands,\" Ambassador Weiming said. He said the digital divide had for too long been a barrier to inclusive growth, with students in many parts of the country facing difficulties accessing online education resources and entrepreneurs unable to fully benefit from e-commerce opportunities. Ambassador Weiming said the Chinese Government supported the project to address communication deficiencies and help bridge the urban-rural digital divide. He also acknowledged local authorities, community leaders and landowners for facilitating access and supporting project teams during construction. \"As we hand over 161 towers today, we are passing on more than a physical asset. We are passing on a legacy of collaboration, a commitment to progress and the promise of a more connected and prosperous future,\" he said. Minister of Communication and Aviation Hon. Fredrick Kologeto said the project represented a significant step forward in Solomon Islands' digital transformation journey. \"Today marks far more than the completion and handover. It is the beginning of new opportunities for all people,\" Mr Kologeto said. He acknowledged the Government and people of the People's Republic of China for their financial support through the Exim Bank of China, saying the partnership and confidence in Solomon Islands' national development had helped make the project a reality. The Minister also thanked CHEC and Huawei Technologies for their work in constructing the communication towers and installing and configuring the telecommunications equipment. He said the professionalism and technical expertise demonstrated throughout the project had delivered infrastructure that would serve the country for many years to come. Following the official handover, all 161 SINBIP towers across Solomon Islands will now be managed by Solomon Tower Limited (STL), the local entity responsible for owning and managing the tower assets. The completion and handover of SINBIP marks a major milestone in Solomon Islands' efforts to expand digital connectivity, improve access to information and communication services, and create new opportunities for communities across the country.","Ambassador","Cai Weiming","Development","Donation w/ Ceremony","Honiara","Guadalcanal","Ministry / Government Department","Fredrick Kologeto","N/A","N/A","N/A","N/A","",""],["6168","Solomon Islands","Honiara","Facebook","https://www.facebook.com/share/p/1B5hQg3Zfo/","7/31/26","Unspecified","7/31/26","ILD meeting with John Dean Kuku","A delegation of the International Department of the Communist Party of China Central Committee, led by Mr. Zhao Hongtao, Deputy Director General, visited Solomon Islands from July 23 to 26. During the visit, the delegation met with various political parties of Solomon Islands and exchanged views on party governance and state administration, and discussed ways to promote the development ee safety education and day-to-day management, actively fulfill social responsibility, safeguard China's good image overseas, and build a solid security barrier for practical cooperation between China and Solomon Islands across all fields. // The enterprise heads in attendance stated that they would strictly implement all work requirements from the meeting, conduct investigation and rectification of hidden safety risks on a regular basis, improve emergency response plans, strengthen emergency duty and live-scenario drills, adhere to compliant operations, and contribute to China–Solomon Islands relations. //// 2026年8月5日，中国驻所罗门群岛使馆举行第三季度中资企业安全管理推进会，蔡蔚鸣大使出席并讲话。 // 蔡大使强调，在所中资企业要重视安全管理，树立底线思维、极限思维，压紧压实主体责任，认真排查各方面安全风险隐患，即知即改。严格遵守当地法律法规，强化员工安全教育与日常管理，积极履行社会责任，维护好海外中国良好形象，为中所各领域务实合作筑牢安全屏障。 // 与会企业负责人表示，将严格落实会议各项工作要求，常态化开展安全隐患排查整治，完善应急预案、强化应急值守与实战演练，坚持合规经营，为中所关系做贡献。","Ambassador","Cai Weiming","Consular & Migration","Briefing","Honiara","Guadalcanal","N/A","N/A","N/A","N/A","N/A","N/A","",""],["6173","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/eng/sgxw_3/202608/t20260804_11997778.htm","8/4/26","8/3/26","8/3/26","Vehicle donation","On August 3, a handover ceremony was held in Honiara for vehicles donated by National Immigration Administration of China to the Immigration Division of Solomon Islands. The event was attended by Chinese Ambassador Cai Weiming, alongside Solomon Islands officials including Harry Kuma, Minister for Commerce, Industry, Labour and Immigration; Permanent Secretary Riley Mesepitu; and Director of Immigration .  // Ambassador Cai noted that immigration cooperation is a vital component of bilateral relations, yielding fruitful and practical results in high-level exchanges, personnel mobility facilitation, equipment assistance, and professional training. He emphasized that the six vehicles provided by China will strengthen the transport capacity of the local immigration division, elevate the quality of immigration services, and boost the operational efficiency of law enforcement agencies. This assistance marks another tangible milestone in bilateral immigration cooperation. Expressing appreciation for Solomon Islands government’s firm commitment to the One-China principle, Ambassador Cai stated China's readiness to further deepen political mutual trust and advance comprehensive bilateral cooperation. // Minister Kuma expressed gratitude for China's generous vehicular assistance, highly commending the prolific achievements recorded since the establishment of diplomatic relations across infrastructure, healthcare, education, agriculture, trade, and policing cooperation. He stressed that these collaborative outcomes have brought tangible benefits to the people of Solomon Islands. Reaffirming his government's adherence to the One-China principle, Minister Kuma voiced the nation's commitment to steadily enhancing Solomon Islands-China relationship while deepening cross-sectoral cooperation. ","Ambassador","Cai Weiming","Development","Donation w/ Ceremony","Honiara","Guadalcanal","Ministry / Government Department","Harry Kuma","Unknown","Unknown","N/A","N/A","",""],["6174","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/eng/sgxw_3/202608/t20260805_11998668.htm","8/5/26","8/4/26","8/4/26","Meeting w/ UNICEF","On August 4, 2026, Chinese Ambassador to Solomon Islands H.E. Cai Weiming met with Hamish Young, UNICEF Representative for Pacific Island Countries. The two sides exchanged views on cooperation in implementing relevant projects in Solomon Islands.","Ambassador","Cai Weiming","Development","Meeting","Honiara","Guadalcanal","Multilateral organization","Hamish Young","N/A","N/A","N/A","N/A","",""],["6175","Solomon Islands","Honiara","Official Website","https://sb.china-embassy.gov.cn/sgxw/202608/t20260806_11999222.htm","8/6/26","8/5/26","8/5/26","Amb published in Solomon Star and Island Sun","On August 5th, Chinese Ambassador to Solomon Islands H.E. Cai Weiming published an article titled \"Promoting the Sound and Steady Growth of China-Solomon Islands Comprehensive Strategic Partnership\" on Solomon Star and Island Sun newspapers. The full text is as follows: // Recently, Solomon Islands Minister of Foreign Affairs and External Trade Hon. Rick Houenipwela paid an official visit to China. This is Hon. Houenipwela's first official visit to China since Solomon Islands' new government took office. During this visit, Hon. Houenipwela held talks with Chinese Minister of Foreign Affairs Wang Yi, Minister of Commerce Wang Wentao and Chairman of the China International Development Cooperation Agency (CIDCA) Chen Xiaodong. Both sides exchanged views and reached important consensus on deepening China-Solomon Islands Comprehensive Strategic Partnership, providing crucial guidance for further developing our bilateral relations. Our two countries shall step up communication and coordination, jointly implement the consensus between the two sides, inject stable momentum into bilateral relations and open a new chapter in building China-Solomon Islands community with a shared future. // 1. We shall strengthen our political trust and be partners of mutual respect, China's cooperation with Solomon Islands has always followed the principle of \"four full respects\" put forward by President Xi Jinping, namely, China fully respects the sovereignty and independence of Solomon Islands; fully respects the will of Solomon Islands; fully respects the cultural traditions of Solomon Islands; and fully respects Pacific Island Countries' efforts to seek strength through unity. Chinese Foreign Minister Wang Yi pointed out that China's policy toward Solomon Islands maintains continuity and stability. China will always support Solomon Islands in safeguarding its national sovereignty, independence, and legitimate rights and interests, as well as in pursuing a development path of its own choice. China's relations with Pacific Island Countries is aimed at strengthening South-South cooperation and promoting common development. China carries no geopolitical intention, seeks no so-called \"spheres of influence\", Pacific Island Countries are sovereign independent states, not anyone's \"backyard\", and have the right to independently choose their development partners. // The one-China principle is the political foundation of China-Solomon Islands relations. During the visit, Hon. Houenipwela reiterated that the Solomon Islands Government is firmly committed to the one-China principle. Taiwan is an inalienable part of China's territory, and the Government of the People's Republic of China is the sole legal government representing the whole of China as decided by the UNGA Resolution 2758. Minister Wang Yi highly appreciated the reaffirmation, and stressed that the new Solomon Islands Government's firm commitment to the one-China principle will consolidate the political foundation of bilateral ties and create necessary conditions for deepening bilateral cooperation. Recently, the Government of Papua New Guinea announced the closure of the so-called \"Taipei Economic Office in Papua New Guinea\". The Government of the Republic of Nauru issued the directives to all public servants and employees of state-owned enterprises to adhere to the one-China principle. Adherence to the one-China principle is where global opinion trends and the prevailing course of the times leads. To uphold the one-China principle means resolute opposition to any form of so-called \"Taiwan independence\", resolute opposition to any form of official exchanges with Taiwan authority, and support for China's efforts to achieve national reunification. Building on the basis of the one-China principle, China-Solomon Islands relations will continue to flourish. // 2. We shall deepen our practical cooperation and be partners of mutual benefit and win-win outcomes. Minister Wang Yi stressed that China's cooperation with Solomon Islands comes with no political strings attached, is not forcibly imposed, and makes no empty promises. China is willing to strengthen the alignment of development strategies with Solomon Islands and promote high-quality Belt & Road cooperation. Hon. Houenipwela acknowledged that China's development has benefited the world, and China's experience is worthy of study and reference by Solomon Islands and other Pacific Island Countries. The two sides exchanged views on deepening bilateral practical cooperation in fields such as infrastructure, trade, education, medical and health-care services, and green development. Hon. Houenipwela also signed the Framework Agreement on Enhanced Economic Partnership with China, reaching mutually beneficial institutional arrangements for expanding bilateral trade, investment, and practical cooperation. The two sides also reached consensus on enhancing China's disaster relief assistance to SI and advancing the effective implementation of the Rural Sustainable Development Project. // Looking back on the seven years since the establishment of diplomatic relations between China and Solomon Islands, our bilateral relations have maintained strong momentum, the exchanges and cooperation in various fields have achieved visible and tangible results, bringing tangible benefits to the people of Solomon Islands. China has supported the construction of the National Stadium, the SINU Dormitory, the National Referral Hospital Comprehensive Medical Center, and the National Broadband Network Project. The China-Aid Auki Road Project in Malaita Province is processing steadily. China is the top trading partner for Solomon Islands, and has implemented zero tariffs to all Solomon Islands products exported to China. The China Medical Team has helped more than 70,000 local patients and gained the heartfelt support of local people. The Chinese Police Liaison Team continues to provide professional training for RSIPF and donated vehicles, patrol boats and a large number of other equipment to RSIPF. We have every reason to believe that with joint efforts, our bilateral practical cooperation will continue to prosper. // 3. We shall strengthen people-to-people exchanges and be partners standing shoulder to shoulder. The friendship between countries lies in the mutual understanding among the people, and the mutual understanding among the people lies in the communication of the hearts, Since the establishment of diplomatic relations between our two countries, our cultural exchanges are progressing. The visa-free arrangement makes personnel exchanges more frequent. The latest visa-free arrangement between Solomon Islands and Hong Kong SAR will take effect on August 26. China has helped more than 1,200 Solomon Islanders undertake training programs in China. More than 200 Solomon Islands students are studying in Chinese universities with full scholarships, which empowers human resource development of Solomon Islands. And all the provinces of Solomon Islands and Honiara have pairings with China's provinces, supporting Solomon Islands' provincial development. // During the visit to China, Hon. Houenipwela paid a visit to Jiangsu Province which has a sister-province relationship with Malaita Province, and met with the vice governor of Jiangsu Province. They had in-depth exchanges on sub-national cooperation. Hon. Houenipwela also met with Solomon Islands students studying in China, and acknowledged their role in the strengthening of mutual understanding and people-to-people exchanges. China is willing to deepen cultural exchanges on education, youth, media and sub-national cooperation with Solomon Islands, continuously enhancing the connection between our peoples and benefiting our peoples. // 4. We shall uphold multilateralism and be partners for coordination. Nowadays, the changes unseen in a century are accelerating across the world, the international situation is fluid and turbulent. Unilateralism and protectionism are on the rise, uncertainties and unpredict
