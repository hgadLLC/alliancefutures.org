# Sveltia CMS configuration for alliancefutures.org
#
# This file defines the editor UI: collections, fields, and where uploaded
# files land. It is read by /admin/index.html when an editor opens the portal.
#
# Backend: GitHub directly via Personal Access Token (no OAuth proxy yet).
# Editors click "Sign In with Token" on the login screen and paste a PAT
# (Sveltia generates the right URL with scopes pre-selected). The token is
# stored in the browser's local storage only.
#
# When we onboard non-technical editors, deploy sveltia-cms-auth as a
# Cloudflare Worker, register a GitHub OAuth App, and add `base_url` below.
# Then "Sign In with GitHub" replaces the token flow.

backend:
  name: github
  repo: hgadLLC/alliancefutures.org
  branch: main
  commit_messages:
    create: "CMS: add {{collection}} '{{slug}}'"
    update: "CMS: edit {{collection}} '{{slug}}'"
    delete: "CMS: remove {{collection}} '{{slug}}'"
    uploadMedia: "CMS: upload {{path}}"
    deleteMedia: "CMS: delete {{path}}"

# Where CMS-uploaded files (PDFs, images) land in the repo.
media_folder: "uploads"
public_folder: "/uploads"

publish_mode: simple

# ------------------------------------------------------------------ #
# Collections                                                        #
# ------------------------------------------------------------------ #

collections:
  # ---------------------------------------------------------------- #
  # PRC Pacific Embassies Monitor — weekly issues                    #
  # ---------------------------------------------------------------- #
  - name: monitors
    label: "Embassies Monitor (weekly)"
    label_singular: "Monitor issue"
    folder: "content/monitors"
    create: true
    slug: "week-{{week}}"
    summary: "Wk {{week}} — {{title}}"
    sortable_fields: ["week", "date"]
    view_filters:
      - { label: "Special Reports", field: layout, pattern: "layouts/special-report.njk" }
      - { label: "Weekly Monitors", field: layout, pattern: "layouts/monitor.njk" }
    fields:
      - { name: layout, label: Layout, widget: select,
          options:
            - { label: "Weekly Monitor",  value: "layouts/monitor.njk" }
            - { label: "Special Report", value: "layouts/special-report.njk" }
          default: "layouts/monitor.njk" }
      - { name: week, label: "Week number", widget: number, value_type: int, min: 1 }
      - { name: date, label: "Week start", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: date_end, label: "Week end", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: title, label: "Headline", widget: string,
          hint: "Article H2 headline. e.g. \"Wale Goes to Canberra; Beijing Stays Busy\"" }
      - { name: description, label: "SEO description", widget: text, required: false }
      - { name: pdf, label: "PDF download", widget: file, required: false }
      - { name: authors,
          label: "Authors",
          widget: relation,
          collection: people,
          search_fields: ["name"],
          value_field: "{{slug}}",
          display_fields: ["name"],
          multiple: true,
          default: ["jonah-bock"] }
      - { name: featured, label: "Pin to homepage as Featured", widget: boolean, default: false, required: false }
      # ----- Weekly Monitor structured body -----
      - { name: summary, label: "Summary of PRC Activity", widget: markdown, required: false,
          hint: "Weekly Monitor only. Plain markdown — bold for the key beats." }
      - { name: ambassadors_corner, label: "Ambassador's Corner", widget: markdown, required: false,
          hint: "The floated gold-bordered callout. Leave blank to omit." }
      - name: themes
        label: "Big Themes"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: "Theme heading", widget: string }
          - { name: body,  label: "Theme body",    widget: markdown }
          - { name: figure, label: "Inline figure (optional)", widget: image, required: false,
              hint: "If set, floats right alongside the body." }
          - { name: figure_caption, label: "Figure caption", widget: string, required: false }
          - { name: figure_source_url,   label: "Figure source URL",   widget: string, required: false }
          - { name: figure_source_label, label: "Figure source label", widget: string, required: false }
          - name: supporting_events
            label: "Supporting Events"
            widget: list
            required: false
            summary: "{{fields.country}}: {{fields.label}}"
            fields:
              - { name: country, label: "Country / Region", widget: string }
              - { name: label,   label: "Link label",       widget: string }
              - { name: url,     label: "URL",              widget: string }
      # ----- Special Report-only fields -----
      - { name: hero_title, label: "Hero title (Special Report)", widget: string, required: false,
          hint: "Top-of-page hero — use <em>...</em> for italic emphasis. Special Report only." }
      - { name: cover_image, label: "Cover image (Special Report)", widget: image, required: false }
      - { name: cover_alt,   label: "Cover image alt text", widget: string, required: false }
      - { name: author,       label: "Author byline (Special Report)", widget: string, required: false }
      - { name: author_title, label: "Author title (Special Report)",  widget: string, required: false }
      - { name: lede,         label: "Lede paragraph (Special Report)", widget: text, required: false }
      - { name: disclaimer,   label: "Disclaimer footer", widget: text, required: false }
      - { name: photo_credit, label: "Photo credit footer", widget: text, required: false }
      - { name: prev_week,    label: "Previous week #", widget: number, value_type: int, required: false }
      - { name: next_week,    label: "Next week #",     widget: number, value_type: int, required: false }
      - { name: body, label: "Article body (Special Report)", widget: markdown, required: false,
          hint: "Special Report only — markdown content after the lede. Weekly Monitors use Summary + Themes instead." }

  # ---------------------------------------------------------------- #
  # Commentary — Southern Signals and other essays                   #
  # ---------------------------------------------------------------- #
  - name: commentary
    label: "Commentary"
    label_singular: "Commentary piece"
    folder: "content/commentary"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: layout, label: Layout, widget: hidden, default: "layouts/commentary.njk" }
      - { name: slug,  label: Slug,    widget: string,
          hint: "URL slug — kebab-case, no extension." }
      - { name: date,  label: "Publish date", widget: datetime,
          date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: title, label: Title, widget: string }
      - { name: series, label: "Series tag", widget: string, default: "Southern Signals",
          hint: "Eyebrow above the title (e.g. \"Southern Signals\")." }
      - { name: description, label: "SEO description", widget: text, required: false }
      - { name: author, label: "Author name", widget: string }
      - { name: author_title, label: "Author role", widget: string, required: false,
          hint: "e.g. \"Senior Fellow\"" }
      - { name: pdf, label: "PDF download", widget: file, required: false }
      - { name: hero_image, label: "Hero image", widget: image, required: false }
      - { name: lede, label: "Lede paragraph", widget: text, required: false,
          hint: "Larger opening paragraph rendered above the body prose." }
      - { name: author_image, label: "Author photo (bio block)", widget: image, required: false }
      - { name: author_bio, label: "Author bio (bio block)", widget: text, required: false }
      - { name: author_bio_link, label: "Author bio link (Read full bio →)", widget: string, required: false }
      - { name: prev_slug, label: "Previous slug", widget: string, required: false }
      - { name: next_slug, label: "Next slug", widget: string, required: false }
      - { name: featured, label: "Pin to homepage", widget: boolean, default: false, required: false }
      - { name: body, label: "Article body", widget: markdown }

  # ---------------------------------------------------------------- #
  # Research reports — Red Team and long-form publications           #
  # ---------------------------------------------------------------- #
  - name: research
    label: "Research Reports"
    label_singular: "Research report"
    folder: "content/research"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { name: layout, label: Layout, widget: hidden, default: "layouts/red-team.njk" }
      - { name: slug,  label: Slug,    widget: string }
      - { name: date,  label: "Publish date", widget: datetime,
          date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { name: title, label: "Title (HTML allowed: <em>)", widget: string }
      - { name: subtitle, label: "Subtitle / Description", widget: text, required: false }
      - { name: publication_title, label: "Publication header label", widget: string, required: false }
      - { name: description, label: "SEO description", widget: text, required: false }
      - { name: pdf, label: "PDF download", widget: file, required: false }
      - name: authors
        label: "Author names"
        widget: list
        field: { name: item, label: Author, widget: string }
      - name: toc
        label: "Table of Contents"
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - { name: id,    label: "Anchor (id)",   widget: string }
          - { name: title, label: "TOC label",     widget: string }
          - name: sub
            label: "Sub-items"
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: id,    label: "Anchor (id)", widget: string }
              - { name: title, label: "TOC label",   widget: string }
      - { name: about, label: "About TAFI footer", widget: markdown, required: false }
      - { name: disclaimer, label: "Disclaimer footer", widget: markdown, required: false }
      - { name: acknowledgements, label: "Acknowledgements footer", widget: markdown, required: false }
      - { name: featured, label: "Pin to homepage", widget: boolean, default: false, required: false }
      - { name: body, label: "Report body (markdown + HTML)", widget: markdown,
          hint: "Use raw <h2 id=\"...\"> tags for sections that need TOC anchors. Memo blocks and crimson callouts can be pasted as HTML." }

  # ---------------------------------------------------------------- #
  # People (team + fellows) — bios                                   #
  # ---------------------------------------------------------------- #
  - name: people
    label: "People"
    label_singular: "Person"
    folder: "content/people"
    create: true
    slug: "{{slug}}"
    identifier_field: name
    summary: "{{name}} — {{role}}"
    sortable_fields: ["name", "role"]
    fields:
      - { name: layout, label: Layout, widget: hidden, default: "layouts/bio.njk" }
      - { name: slug,  label: Slug,   widget: string,
          hint: "kebab-case — matches /team/{slug}.html URL." }
      - { name: name,  label: "Full name (display)", widget: string }
      - { name: role,  label: "Role / title",        widget: string,
          hint: "e.g. \"Senior Fellow\", \"Deputy Director\", \"Fellow\"" }
      - { name: photo, label: "Photo filename",     widget: string,
          hint: "Filename only — must exist under /images/team/. e.g. \"jane-doe.jpg\"." }
      - { name: email,    label: "Email",     widget: string, required: false }
      - { name: linkedin, label: "LinkedIn URL", widget: string, required: false }
      - { name: hero_lede, label: "Hero lede (one sentence under the role chip)", widget: text }
      - { name: lede_p,    label: "Bio opening paragraph", widget: text }
      - name: focus
        label: "Areas of Focus"
        widget: list
        required: false
        field: { name: item, label: Area, widget: string }
      - name: affiliations
        label: "Affiliations"
        widget: list
        required: false
        field: { name: item, label: Affiliation, widget: string }
      - name: education
        label: "Education"
        widget: list
        required: false
        field: { name: item, label: Credential, widget: string }
      - { name: prev_slug, label: "Previous person slug", widget: string, required: false }
      - { name: prev_name, label: "Previous person name", widget: string, required: false }
      - { name: next_slug, label: "Next person slug", widget: string, required: false }
      - { name: next_name, label: "Next person name", widget: string, required: false }
      - { name: body, label: "Full biography (section headings + paragraphs)", widget: markdown,
          hint: "Use ## for section headings (e.g. ## Background, ## Education). Body renders below the lede paragraph." }

# NOTE — Recent Work data files (data/mentions.yml,
# data/internal-publications.yml) are root-level YAML lists, which the CMS
# `files` widget can't edit cleanly without a schema rewrite. Until they're
# split into per-item folder collections, edit them via the GitHub web UI
# or a local clone. They drive the "Recent Work" block on every bio page.
