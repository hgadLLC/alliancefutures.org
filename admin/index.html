<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>TAFI Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32.png">
<style>
  :root {
    --navy: #0a2540;
    --gold: #daa520;
    --gold-dark: #8a6b00;
    --off-white: #f6f4ee;
    --line: rgba(10, 37, 64, 0.12);
    --error: #b91c1c;
    --ok: #047857;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--navy);
    background: var(--off-white);
  }
  header.topbar {
    background: var(--navy);
    color: #fff;
    padding: 0.8rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header.topbar .brand { font-weight: 700; letter-spacing: 1px; }
  header.topbar .who { font-size: 12px; opacity: 0.85; }
  header.topbar button {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 4px 10px;
    border-radius: 3px;
    cursor: pointer;
    margin-left: 0.5rem;
    font: inherit;
  }
  main { max-width: 980px; margin: 2rem auto; padding: 0 1.5rem 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 1.25rem; font-weight: 600; }
  h2 { font-size: 1.15rem; margin: 1.75rem 0 0.5rem; font-weight: 600; color: var(--gold-dark); }
  p.muted { color: rgba(10,37,64,0.65); }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
  .menu-card {
    background: #fff;
    border: 1px solid var(--line);
    border-left: 4px solid var(--gold);
    border-radius: 6px;
    padding: 1.25rem;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .menu-card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(10,37,64,0.08); }
  .menu-card h3 { margin: 0 0 0.35rem; font-size: 1.05rem; }
  .menu-card p { margin: 0; color: rgba(10,37,64,0.7); font-size: 13px; }
  label { display: block; margin: 0.75rem 0 0.25rem; font-weight: 600; font-size: 13px; }
  label .hint { font-weight: 400; color: rgba(10,37,64,0.6); font-size: 12px; margin-left: 0.5rem; }
  input[type="text"], input[type="number"], input[type="date"], input[type="url"], input[type="password"], input[type="file"], select, textarea {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 5rem; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  textarea.prose { font-family: inherit; font-size: 14px; min-height: 8rem; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
  button.primary {
    background: var(--gold);
    color: var(--navy);
    border: 0;
    padding: 0.7rem 1.4rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    text-transform: uppercase;
  }
  button.primary:hover { background: #e6b73e; }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  button.ghost {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--line);
    padding: 0.5rem 1rem;
    border-radius: 3px;
    cursor: pointer;
    font: inherit;
  }
  .item-block {
    background: var(--off-white);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1rem 1rem 0.5rem;
    margin: 0.75rem 0;
    position: relative;
  }
  .item-block .remove {
    position: absolute;
    top: 8px;
    right: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--error);
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 11px;
  }
  .badge {
    display: inline-block;
    background: var(--gold);
    color: var(--navy);
    font-weight: 700;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 99px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .status { margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 4px; font-size: 13px; }
  .status.error { background: #fde8e8; color: var(--error); border: 1px solid #f5b5b5; }
  .status.ok    { background: #d1fae5; color: var(--ok);    border: 1px solid #6ee7b7; }
  .status.info  { background: #e0f2fe; color: #075985;      border: 1px solid #7dd3fc; }
  ol.steps { padding-left: 1.25rem; line-height: 1.7; }
  ol.steps li { margin-bottom: 0.5rem; }
  code { background: rgba(10,37,64,0.07); padding: 1px 5px; border-radius: 3px; font-size: 0.85em; }
  a { color: #1a0dab; }
  .back {
    display: inline-block;
    margin-bottom: 1rem;
    font-size: 13px;
    text-decoration: none;
    color: var(--gold-dark);
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">TAFI Admin</div>
  <div>
    <span class="who" id="who"></span>
    <button id="logout-btn" hidden>Sign out</button>
  </div>
</header>

<main id="app">
  <p class="muted">Loading…</p>
</main>

<script>
"use strict";

// ---------------------------------------------------------------- //
// Config                                                           //
// ---------------------------------------------------------------- //
const REPO_OWNER = "hgadLLC";
const REPO_NAME  = "alliancefutures.org";
const BRANCH     = "main";

const LS_TOKEN = "tafi_admin_pat";
const LS_USER  = "tafi_admin_user";

// ---------------------------------------------------------------- //
// GitHub API client (minimal — Contents API only)                  //
// ---------------------------------------------------------------- //
async function ghFetch(path, options = {}) {
  const token = localStorage.getItem(LS_TOKEN);
  const headers = {
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28",
    ...(options.headers || {}),
  };
  if (token) headers["Authorization"] = "Bearer " + token;
  if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
  const res = await fetch("https://api.github.com" + path, { ...options, headers });
  if (!res.ok) {
    let body = "";
    try { body = (await res.json()).message || ""; } catch {}
    throw new Error("GitHub " + res.status + ": " + body);
  }
  if (res.status === 204) return null;
  return res.json();
}

async function ghVerify(token) {
  const res = await fetch("https://api.github.com/user", {
    headers: {
      "Accept": "application/vnd.github+json",
      "Authorization": "Bearer " + token,
    },
  });
  if (!res.ok) throw new Error("Token rejected (HTTP " + res.status + ")");
  return res.json();
}

async function ghGetFile(path) {
  try {
    return await ghFetch(`/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}?ref=${BRANCH}`);
  } catch (e) {
    if (e.message.includes("404")) return null;
    throw e;
  }
}

async function ghPutFile(path, content, message, isBinary = false, existingSha = null) {
  const b64 = isBinary ? content : utf8ToBase64(content);
  const body = {
    message,
    content: b64,
    branch: BRANCH,
  };
  if (existingSha) body.sha = existingSha;
  const url = `/repos/${REPO_OWNER}/${REPO_NAME}/contents/${encodeURIComponent(path).replace(/%2F/g, "/")}`;
  return ghFetch(url, { method: "PUT", body: JSON.stringify(body) });
}

function utf8ToBase64(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const b64 = result.split(",")[1] || result;
      resolve(b64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------------------------------------------------------------- //
// YAML/markdown emitter (just enough for our schemas)              //
// ---------------------------------------------------------------- //
function yamlQuote(str) {
  const s = String(str || "");
  if (s === "") return '""';
  return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
}
function yamlBlock(str, indent = 0) {
  const inner = " ".repeat(indent + 2);
  const lines = String(str || "").replace(/\r\n/g, "\n").split("\n");
  return "|\n" + lines.map(ln => ln ? inner + ln : "").join("\n");
}

// Slug helper: kebab-case from arbitrary string.
function slugify(str) {
  return String(str || "")
    .toLowerCase()
    .normalize("NFKD")
    .replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 80);
}

// ---------------------------------------------------------------- //
// Boot                                                             //
// ---------------------------------------------------------------- //
function setWho() {
  const user = localStorage.getItem(LS_USER);
  document.getElementById("who").textContent = user ? "Signed in as " + user : "";
  document.getElementById("logout-btn").hidden = !user;
}
document.getElementById("logout-btn").addEventListener("click", () => {
  localStorage.removeItem(LS_TOKEN);
  localStorage.removeItem(LS_USER);
  location.hash = "";
  setWho();
  route();
});

window.addEventListener("hashchange", route);
function route() {
  const token = localStorage.getItem(LS_TOKEN);
  setWho();
  if (!token) return renderTokenScreen();
  const hash = location.hash.replace(/^#\/?/, "");
  switch (hash) {
    case "":            return renderMenu();
    case "monitor":     return renderMonitorForm();
    case "commentary":  return renderCommentaryForm();
    case "person":      return renderPersonForm();
    case "mention":     return renderMentionForm();
    case "internal":    return renderInternalPubForm();
    default:            return renderMenu();
  }
}
route();

// ---------------------------------------------------------------- //
// Screens                                                          //
// ---------------------------------------------------------------- //
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v != null && v !== false) e.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}
function mount(...children) {
  const m = document.getElementById("app");
  m.innerHTML = "";
  for (const c of children) m.appendChild(c);
}
function statusEl(text, kind = "info") {
  return el("div", { class: "status " + kind }, text);
}
function showStatus(parent, text, kind = "info") {
  const old = parent.querySelector(".status");
  if (old) old.remove();
  parent.appendChild(statusEl(text, kind));
}

// ----- Token gate ------------------------------------------------ //
function renderTokenScreen() {
  const tokenInput = el("input", { type: "password", placeholder: "ghp_..." });
  const submit = el("button", { class: "primary", type: "button" }, "Sign in");
  const card = el("div", { class: "card" },
    el("h2", {}, "Sign in"),
    el("p", { class: "muted" },
      "Generate a GitHub Personal Access Token with ",
      el("code", {}, "repo"),
      " scope, then paste it below. The token stays in this browser only — it's never sent anywhere except api.github.com."
    ),
    el("p", { class: "muted" },
      el("a", { href: "https://github.com/settings/tokens/new?description=TAFI+Admin&scopes=repo", target: "_blank", rel: "noopener" },
        "→ Open GitHub token page (pre-filled scopes)")
    ),
    el("label", {}, "Personal access token"),
    tokenInput,
    el("div", { style: "margin-top: 1rem;" }, submit),
  );
  submit.addEventListener("click", async () => {
    const t = tokenInput.value.trim();
    if (!t) { showStatus(card, "Paste a token first.", "error"); return; }
    submit.disabled = true;
    showStatus(card, "Verifying…", "info");
    try {
      const user = await ghVerify(t);
      localStorage.setItem(LS_TOKEN, t);
      localStorage.setItem(LS_USER, user.login);
      location.hash = "";
      setWho();
      route();
    } catch (e) {
      showStatus(card, e.message, "error");
      submit.disabled = false;
    }
  });
  mount(el("h1", {}, "TAFI Admin"), card);
}

// ----- Main menu ------------------------------------------------- //
function renderMenu() {
  const menu = el("div", { class: "menu-grid" },
    menuItem("monitor",    "Add a Weekly Monitor",    "Compose a new Embassies Monitor issue. Upload the PDF, write the summary, list the big themes."),
    menuItem("commentary", "Add a Commentary",        "Publish a Southern Signals piece or other op-ed."),
    menuItem("person",     "Add a Team Member",       "Add a new staff member or fellow with photo, bio, and contact info."),
    menuItem("mention",    "Add to Recent Work (External)",
                                                       "Log a media quote, podcast appearance, or external op-ed against an author."),
    menuItem("internal",   "Add to Recent Work (Internal)",
                                                       "Register a new internal publication (Brief, Report, Futures piece) for an author's Recent Work."),
  );
  mount(el("h1", {}, "What do you want to do?"), menu,
    el("div", { class: "card", style: "margin-top: 2rem;" },
      el("h2", {}, "About this admin"),
      el("p", { class: "muted" },
        "Each form here commits a single markdown or YAML change to ",
        el("code", {}, "hgadLLC/alliancefutures.org"), " on the ", el("code", {}, BRANCH),
        " branch. The site rebuilds automatically. Nothing leaves your browser except the GitHub API call."),
      el("p", { class: "muted" },
        "Need to edit something that doesn't have a form yet? ",
        el("a", { href: `https://github.com/${REPO_OWNER}/${REPO_NAME}/`, target: "_blank", rel: "noopener" },
          "Edit directly on GitHub"),
        ".")
    )
  );
}
function menuItem(hash, title, desc) {
  return el("a", { class: "menu-card", href: "#/" + hash },
    el("h3", {}, title),
    el("p", {}, desc),
  );
}

function backLink() {
  return el("a", { class: "back", href: "#" }, "← Back to menu");
}

// ----- Weekly Monitor form -------------------------------------- //
function renderMonitorForm() {
  const fields = {};
  const themes = [];
  const themesWrap = el("div", {});

  function addTheme(prefill = {}) {
    const idx = themes.length;
    const t = {
      title: el("input", { type: "text", value: prefill.title || "", required: true }),
      body: el("textarea", { class: "prose", rows: 8 }),
      figure: el("input", { type: "file", accept: "image/*" }),
      figureFilenameHint: el("input", { type: "text", placeholder: "e.g. jin-bernicke", value: "" }),
      figureCaption: el("input", { type: "text" }),
      figureSourceLabel: el("input", { type: "text" }),
      figureSourceUrl: el("input", { type: "url" }),
      events: [],
      eventsWrap: el("div", {}),
    };
    t.body.value = prefill.body || "";

    function addEvent(p = {}) {
      const ev = {
        country: el("input", { type: "text", value: p.country || "" }),
        label:   el("input", { type: "text", value: p.label || "" }),
        url:     el("input", { type: "url",  value: p.url || "" }),
      };
      const block = el("div", { class: "item-block" },
        el("button", { class: "remove", type: "button", onclick: () => { block.remove(); t.events = t.events.filter(x => x !== ev); } }, "Remove"),
        el("label", {}, "Country / Region"), ev.country,
        el("label", {}, "Link label"), ev.label,
        el("label", {}, "URL"), ev.url,
      );
      t.events.push(ev);
      t.eventsWrap.appendChild(block);
    }
    t._addEvent = addEvent;

    const block = el("div", { class: "item-block" },
      el("button", { class: "remove", type: "button", onclick: () => { block.remove(); themes.splice(themes.indexOf(t), 1); } }, "Remove theme"),
      el("label", {}, "Theme heading"), t.title,
      el("label", {}, "Theme body ", el("span", { class: "hint" }, "(markdown — use **bold**, [link](url))")),
      t.body,
      el("label", {}, "Inline figure (optional)"),
      t.figure,
      el("label", {}, "Image filename slug ", el("span", { class: "hint" }, "kebab-case; saved as /embassy-monitors/images/week-N-<slug>.<ext>")),
      t.figureFilenameHint,
      el("label", {}, "Figure caption"), t.figureCaption,
      el("label", {}, "Figure source label"), t.figureSourceLabel,
      el("label", {}, "Figure source URL"),  t.figureSourceUrl,
      el("h2", { style: "font-size: 0.9rem; margin-top: 1rem;" }, "Supporting Events"),
      t.eventsWrap,
      el("button", { class: "ghost", type: "button", onclick: () => addEvent() }, "+ Add supporting event"),
    );
    themes.push(t);
    themesWrap.appendChild(block);
  }

  fields.week = el("input", { type: "number", min: "1", required: true });
  fields.dateStart = el("input", { type: "date", required: true });
  fields.dateEnd = el("input", { type: "date", required: true });
  fields.title = el("input", { type: "text", required: true });
  fields.description = el("input", { type: "text" });
  fields.prevWeek = el("input", { type: "number", min: "0" });
  fields.pdf = el("input", { type: "file", accept: "application/pdf" });
  fields.summary = el("textarea", { class: "prose", rows: 6, required: true });
  fields.ambassadors = el("textarea", { class: "prose", rows: 6 });
  fields.featured = el("input", { type: "checkbox" });

  const form = el("form", { class: "card" },
    el("h1", {}, "Add a Weekly Monitor"),
    el("p", { class: "muted" }, "Fields marked with * are required. PDF and images upload to the repo on commit."),
    el("div", { class: "row3" },
      el("div", {}, el("label", {}, "Week number *"),    fields.week),
      el("div", {}, el("label", {}, "Week start *"),     fields.dateStart),
      el("div", {}, el("label", {}, "Week end *"),       fields.dateEnd),
    ),
    el("label", {}, "Article H2 headline *"),
    fields.title,
    el("label", {}, "Previous week # ", el("span", { class: "hint" }, "for prev/next nav — usually current week minus one")),
    fields.prevWeek,
    el("label", {}, "SEO description (optional)"),
    fields.description,
    el("label", {}, "PDF file (optional)"),
    fields.pdf,
    el("label", {}, "Ambassador's Corner ", el("span", { class: "hint" }, "(markdown — leave blank to omit)")),
    fields.ambassadors,
    el("label", {}, "Summary of PRC Activity * ", el("span", { class: "hint" }, "(markdown)")),
    fields.summary,
    el("label", {}, el("input", { type: "checkbox" }), " Pin to homepage as Featured"),
    el("h2", {}, "Big Themes"),
    themesWrap,
    el("button", { class: "ghost", type: "button", onclick: () => addTheme() }, "+ Add theme"),
    el("div", { style: "margin-top: 1.5rem;" },
      el("button", { class: "primary", type: "submit" }, "Publish monitor"),
    ),
  );

  // Pre-populate with one empty theme so the user sees the shape.
  addTheme();

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const submitBtn = form.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    showStatus(form, "Composing files…", "info");

    try {
      const week = parseInt(fields.week.value, 10);
      const dateStart = fields.dateStart.value;
      const dateEnd = fields.dateEnd.value;
      if (!week || !dateStart || !dateEnd) throw new Error("Week, week start, and week end are all required.");

      // Upload PDF if provided
      let pdfPath = null;
      if (fields.pdf.files[0]) {
        showStatus(form, "Uploading PDF…", "info");
        const b64 = await fileToBase64(fields.pdf.files[0]);
        pdfPath = `embassy-monitors/pdfs/embassy-monitor-week-${week}.pdf`;
        const existing = await ghGetFile(pdfPath);
        await ghPutFile(pdfPath, b64, `Add Week ${week} PDF`, true, existing?.sha);
      }

      // Upload theme figures
      for (let i = 0; i < themes.length; i++) {
        const t = themes[i];
        if (t.figure.files[0]) {
          const f = t.figure.files[0];
          const ext = (f.name.split(".").pop() || "jpg").toLowerCase();
          const slug = slugify(t.figureFilenameHint.value || t.title.value || ("theme-" + (i + 1)));
          const imgPath = `embassy-monitors/images/week-${week}-${slug}.${ext}`;
          showStatus(form, `Uploading image for theme ${i + 1}…`, "info");
          const b64 = await fileToBase64(f);
          const existing = await ghGetFile(imgPath);
          await ghPutFile(imgPath, b64, `Add Week ${week} image: ${slug}`, true, existing?.sha);
          t._imgPath = "/" + imgPath;
        }
      }

      // Compose markdown
      const lines = [
        "---",
        "layout: layouts/monitor.njk",
        "week: " + week,
        "date: " + dateStart,
        "date_end: " + dateEnd,
        "title: " + yamlQuote(fields.title.value),
      ];
      if (fields.description.value.trim()) lines.push("description: " + yamlQuote(fields.description.value.trim()));
      if (pdfPath) lines.push("pdf: /" + pdfPath);
      if (fields.prevWeek.value) lines.push("prev_week: " + parseInt(fields.prevWeek.value, 10));
      lines.push("authors: [jonah-bock]");
      lines.push("categories: [embassies-monitor]");
      lines.push("featured: " + (fields.featured.checked ? "true" : "false"));
      if (fields.ambassadors.value.trim()) {
        lines.push("ambassadors_corner: " + yamlBlock(fields.ambassadors.value.trim()));
      }
      if (fields.summary.value.trim()) {
        lines.push("summary: " + yamlBlock(fields.summary.value.trim()));
      }
      if (themes.length > 0) {
        lines.push("themes:");
        for (const t of themes) {
          if (!t.title.value.trim()) continue;
          lines.push("  - title: " + yamlQuote(t.title.value));
          if (t.body.value.trim()) lines.push("    body: " + yamlBlock(t.body.value.trim(), 4));
          if (t._imgPath) lines.push("    figure: " + t._imgPath);
          if (t.figureCaption.value.trim()) lines.push("    figure_caption: " + yamlQuote(t.figureCaption.value));
          if (t.figureSourceUrl.value.trim()) lines.push("    figure_source_url: " + t.figureSourceUrl.value);
          if (t.figureSourceLabel.value.trim()) lines.push("    figure_source_label: " + yamlQuote(t.figureSourceLabel.value));
          if (t.events.length > 0) {
            lines.push("    supporting_events:");
            for (const e of t.events) {
              if (!e.label.value.trim()) continue;
              lines.push("      - country: " + yamlQuote(e.country.value));
              lines.push("        label: "   + yamlQuote(e.label.value));
              lines.push("        url: "     + e.url.value);
            }
          }
        }
      }
      lines.push("---");
      lines.push("");
      const md = lines.join("\n");

      // Commit the markdown file
      const mdPath = `content/monitors/week-${week}.md`;
      showStatus(form, "Committing monitor markdown…", "info");
      const existing = await ghGetFile(mdPath);
      await ghPutFile(mdPath, md, `Add Week ${week} monitor: ${fields.title.value}`, false, existing?.sha);

      showStatus(form,
        `✓ Week ${week} published. GitHub Actions is rebuilding the site now — give it 1–2 minutes.`,
        "ok");
      submitBtn.disabled = false;
    } catch (e) {
      console.error(e);
      showStatus(form, "Failed: " + e.message, "error");
      submitBtn.disabled = false;
    }
  });

  mount(backLink(), form);
}

// ----- Commentary form ------------------------------------------- //
function renderCommentaryForm() {
  const f = {

    el("div", { class: "row2" },
      el("div", {}, el("label", {}, "Slug (kebab-case) *"), f.slug),
      el("div", {}, el("label", {}, "Publish date *"),      f.date),

    ),
    el("label", {}, "PDF (optional)"),  f.pdf,
    el("label", {}, "Hero image (optional)"), f.heroImage,
    el("label", {}, "Lede paragraph", el("span", { class: "hint" }, "(rendered larger above the body)")),
    f.lede,
    el("label", {}, "Body * ", el("span", { class: "hint" }, "(markdown — H2 = ##, blockquote = >)")),
    f.body,
    el("h2", {}, "Author bio block (optional — bottom of article)"),
    el("label", {}, "Author photo path", el("span", { class: "hint" }, "e.g. /images/team/andrew-horton.jpeg")),
    f.authorImage,
    el("label", {}, "Author bio paragraph"),
    f.authorBio,
    el("label", {}, "Author full bio link", el("span", { class: "hint" }, "e.g. /team/andrew-horton.html")),
    f.authorBioLink,
    el("label", {}, el("input", { type: "checkbox" }), " Pin to homepage as Featured"),
    el("div", { style: "margin-top: 1.5rem;" },
      el("button", { class: "primary", type: "submit" }, "Publish commentary"),
    ),
  );

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const submit = form.querySelector("button[type=submit]");
    submit.disabled = true;
    try {
      const slug = slugify(f.slug.value || f.title.value);
      if (!slug) throw new Error("Slug or title required");

      let pdfPath = null;
      if (f.pdf.files[0]) {
        pdfPath = `our-work/commentary/${slug}.pdf`;
        showStatus(form, "Uploading PDF…", "info");
        const b64 = await fileToBase64(f.pdf.files[0]);
        const ex = await ghGetFile(pdfPath);
        await ghPutFile(pdfPath, b64, `Add ${slug} PDF`, true, ex?.sha);
      }

      let heroPath = null;
      if (f.heroImage.files[0]) {
        const file = f.heroImage.files[0];
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
        heroPath = `our-work/commentary/images/${slug}-hero.${ext}`;
        showStatus(form, "Uploading hero image…", "info");
        const b64 = await fileToBase64(file);
        const ex = await ghGetFile(heroPath);
        await ghPutFile(heroPath, b64, `Add ${slug} hero image`, true, ex?.sha);

      const lines = [
        "---",
        "layout: layouts/commentary.njk",
        "slug: " + slug,
        "date: " + f.date.value,
        "title: " + yamlQuote(f.title.value),
        "series: " + yamlQuote(f.series.value || "Commentary"),
        "author: " + yamlQuote(f.author.value),

      if (f.description.value.trim()) lines.push("description: " + yamlQuote(f.description.value));
      if (pdfPath) lines.push("pdf: /" + pdfPath);
      if (heroPath) lines.push("hero_image: /" + heroPath);
      if (f.lede.value.trim()) lines.push("lede: " + yamlBlock(f.lede.value.trim()));
      if (f.authorImage.value.trim()) lines.push("author_image: " + f.authorImage.value.trim());
      if (f.authorBio.value.trim()) lines.push("author_bio: " + yamlBlock(f.authorBio.value.trim()));
      if (f.authorBioLink.value.trim()) lines.push("author_bio_link: " + f.authorBioLink.value.trim());
      lines.push("featured: " + (f.featured.checked ? "true" : "false"));
      lines.push("---");
      lines.push("");
      const md = lines.join("\n") + f.body.value.trim() + "\n";

      const path = `content/commentary/${slug}.md`;
      showStatus(form, "Committing commentary…", "info");
      const ex = await ghGetFile(path);
      await ghPutFile(path, md, `Add commentary: ${f.title.value}`, false, ex?.sha);

      showStatus(form, `✓ Commentary "${f.title.value}" published. Rebuild starting now.`, "ok");
      submit.disabled = false;
    } catch (e) {
      console.error(e);
      showStatus(form, "Failed: " + e.message, "error");
      submit.disabled = false;
    }
  });

  mount(backLink(), form);
}

    el("div", { class: "row3" },
      el("div", {}, el("label", {}, "Areas of Focus"), f.focus),
      el("div", {}, el("label", {}, "Affiliations"), f.affiliations),
      el("div", {}, el("label", {}, "Education"), f.education),
    ),
    el("label", {}, "Full biography ", el("span", { class: "hint" }, "(markdown — use ## Section for headings)")),
    f.body,
    el("p", { class: "muted" }, "Next/prev nav links are not set here — wire them manually after creating the bio."),
    el("div", { style: "margin-top: 1.5rem;" },
      el("button", { class: "primary", type: "submit" }, "Create person"),
    ),
  );

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const submit = form.querySelector("button[type=submit]");
    submit.disabled = true;
    try {
      const slug = slugify(f.slug.value || f.name.value);
      if (!slug) throw new Error("Slug required");

      let photoFilename = null;
      if (f.photo.files[0]) {
        const file = f.photo.files[0];
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
        photoFilename = f.photoFilename.value.trim() || (slug + "." + ext);
        showStatus(form, "Uploading photo…", "info");
        const b64 = await fileToBase64(file);
        const path = `images/team/${photoFilename}`;
        const ex = await ghGetFile(path);
        await ghPutFile(path, b64, `Add photo for ${slug}`, true, ex?.sha);
      }

      const yamlList = (raw) => raw.split("\n").map(s => s.trim()).filter(Boolean);

      const lines = [
        "---",
        "layout: layouts/bio.njk",
        "slug: " + slug,
        "name: " + yamlQuote(f.name.value),
        "role: " + yamlQuote(f.role.value),

      if (photoFilename) lines.push("photo: " + photoFilename);
      if (f.email.value.trim()) lines.push("email: " + f.email.value.trim());
      if (f.linkedin.value.trim()) lines.push("linkedin: " + f.linkedin.value.trim());
      if (f.heroLede.value.trim()) lines.push("hero_lede: " + yamlBlock(f.heroLede.value.trim()));
      if (f.ledeP.value.trim()) lines.push("lede_p: " + yamlBlock(f.ledeP.value.trim()));
      const items = yamlList(f.focus.value);
      if (items.length) { lines.push("focus:"); for (const i of items) lines.push("  - " + yamlQuote(i)); }
      const affs = yamlList(f.affiliations.value);
      if (affs.length) { lines.push("affiliations:"); for (const i of affs) lines.push("  - " + yamlQuote(i)); }
      const edu = yamlList(f.education.value);
      if (edu.length) { lines.push("education:"); for (const i of edu) lines.push("  - " + yamlQuote(i)); }
      lines.push("---");
      lines.push("");
      const md = lines.join("\n") + (f.body.value.trim() ? f.body.value.trim() + "\n" : "");

      const path = `content/people/${slug}.md`;
      showStatus(form, "Committing bio…", "info");
      const ex = await ghGetFile(path);
      await ghPutFile(path, md, `Add team member: ${f.name.value}`, false, ex?.sha);
      showStatus(form, `✓ ${f.name.value} added. Don't forget to wire prev/next nav links on adjacent bios.`, "ok");
      submit.disabled = false;
    } catch (e) {
      console.error(e);
      showStatus(form, "Failed: " + e.message, "error");
      submit.disabled = false;
    }
  });

  mount(backLink(), form);
}

// ----- External mention form (appends to data/mentions.yml) ----- //
function renderMentionForm() {
  const f = {
    author: el("input", { type: "text", placeholder: "e.g. jonah-bock", required: true }),
    type: el("select", {},
      ...["commentary","op-ed","media","interview","podcast","panel","citation","book","chapter"]
        .map(t => el("option", { value: t }, t))),
    title: el("input", { type: "text", required: true }),
    outlet: el("input", { type: "text", required: true }),
    date: el("input", { type: "date", required: true }),
    url: el("input", { type: "url", required: true }),
    excerpt: el("input", { type: "text" }),
  };

  const form = el("form", { class: "card" },
    el("h1", {}, "Add to Recent Work (External)"),
    el("p", { class: "muted" }, "Appends a new entry to ", el("code", {}, "data/mentions.yml"),
      ". The entry shows up on the author's bio page's Recent Work section."),
    el("div", { class: "row2" },
      el("div", {}, el("label", {}, "Author slug *", el("span", { class: "hint" }, "e.g. jonah-bock, andrew-horton")), f.author),
      el("div", {}, el("label", {}, "Type *"), f.type),
    ),
    el("label", {}, "Title *"), f.title,
    el("div", { class: "row2" },
      el("div", {}, el("label", {}, "Outlet *"), f.outlet),
      el("div", {}, el("label", {}, "Date *"), f.date),
    ),
    el("label", {}, "URL *"), f.url,
    el("label", {}, "One-line dek (optional)"), f.excerpt,
    el("div", { style: "margin-top: 1.5rem;" },
      el("button", { class: "primary", type: "submit" }, "Add mention"),
    ),
  );

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const submit = form.querySelector("button[type=submit]");
    submit.disabled = true;
    try {
      const path = "data/mentions.yml";
      showStatus(form, "Fetching current mentions…", "info");
      const file = await ghGetFile(path);
      const current = file ? atob(file.content.replace(/\n/g, "")) : "";

      // Build the YAML block to insert at the top of the entries (newest first).
      const block = [
        "- author: " + f.author.value.trim(),
        "  type: " + f.type.value,
        "  title: " + yamlQuote(f.title.value),
        "  outlet: " + yamlQuote(f.outlet.value),
        "  date: " + f.date.value,
        "  url: " + f.url.value,
      ];
      if (f.excerpt.value.trim()) block.push("  excerpt: " + yamlQuote(f.excerpt.value));
      block.push("");
      const blockText = block.join("\n");

      // Insert at the first `- author:` line if any exist; otherwise append.
      let next;
      const firstEntryIdx = current.search(/^\s*-\s+author:/m);
      if (firstEntryIdx === -1) {
        next = current.replace(/\s+$/, "") + "\n\n" + blockText;
      } else {
        next = current.slice(0, firstEntryIdx) + blockText + current.slice(firstEntryIdx);
      }

      showStatus(form, "Committing mentions.yml…", "info");
      await ghPutFile(path, next, `Add mention for ${f.author.value}: ${f.title.value}`, false, file?.sha);
      showStatus(form, "✓ Mention added.", "ok");
      submit.disabled = false;
    } catch (e) {
      console.error(e);
      showStatus(form, "Failed: " + e.message, "error");
      submit.disabled = false;
    }
  });

  mount(backLink(), form);
}
