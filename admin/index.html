<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>TAFI Admin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicons/favicon-32.png">
</head>
<body>
    <!--
        Sveltia CMS — git-backed admin for alliancefutures.org. Editors sign
        in with GitHub (Device Flow), the CMS commits directly to the repo
        via the GitHub API, and GitHub Pages rebuilds the site.

        No Netlify Identity, no Git Gateway, no third-party proxy of our own
        to maintain. Sveltia ships its own hosted OAuth bridge at
        auth.sveltia.app, which we use by default.

        For an editor to gain access:
          1. They need a GitHub account.
          2. The repo owner adds them as a collaborator on
             github.com/hgadLLC/alliancefutures.org (Settings → Collaborators).
          3. They open /admin/ and click "Sign in with GitHub".
    -->

    <!-- Sveltia CMS. Pinned by exact version + SRI so a compromised CDN
         can't silently inject malicious admin JS. Bumping requires
         recomputing the hash. See admin/SETUP.md. -->
    <script
        type="module"
        src="https://unpkg.com/@sveltia/cms@0.167.1/dist/sveltia-cms.js"
        integrity="sha384-SM3rJfhgQP1NhjSiI+Tc18UM6kTvNidQudNOrdjEifJeAVeak5sU3aRtjp8Qq8B7"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"></script>
</body>
</html>
