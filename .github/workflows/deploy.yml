# Build Eleventy and deploy to GitHub Pages on every push to main.
#
# Pages source must be set to "GitHub Actions" under
# Settings → Pages once before this workflow takes effect. Until that
# switch is flipped, GitHub Pages keeps serving from the `main` branch
# root, which still works because passthrough copies preserve all the
# legacy HTML files in _site/.

name: Build and deploy site

on:
  push:
    branches: [main]
  # Allow manual triggers from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel any in-progress run when a new commit arrives.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npx @11ty/eleventy

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
