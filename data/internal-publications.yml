# ============================================================
# Internal TAFI publications.
# Embassies Monitor weeks, Red Team reports, and TAFI's own
# commentary live here. Each entry can list multiple authors;
# the item will appear on every listed author's bio page.
# ============================================================
#
# Required fields:
#   type      — monitor | report | commentary | brief
#   title     — the piece's title
#   outlet    — short label shown as type tag prefix
#   date      — YYYY-MM-DD
#   url       — relative path from project root
#                 (the build script will resolve correctly per
#                  bio page, which sits one folder deep)
#   authors   — list of slugs (at least one)
#
# Optional:
#   excerpt   — one-line dek
# ============================================================

