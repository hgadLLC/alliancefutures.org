# ============================================================
# Internal TAFI publications.
# Embassies Monitor weeks, Red Team reports, and TAFI's own
# commentary live here. Each entry can list multiple authors;
# the item will appear on every listed author's bio page.
# ============================================================
#
# Required fields:
#   type      - monitor | redteam | report | commentary | brief | futures
#   title     - the piece's title
#   outlet    - short label shown as type tag prefix
#   date      - YYYY-MM-DD
#   url       - relative path from project root
#                 (the build script will resolve correctly per
#                  bio page, which sits one folder deep)
#   authors   - list of slugs (at least one)
#
# Optional but used by the Our Work filter system:
#   category        - research | futures | commentary | embassies-monitor
#                     (the 4 work categories shown in the Our Work dropdown)
#   product_type    - human-readable: "Red Team Report", "Weekly Monitor",
#                     "Brief", "Op-Ed", "Commentary"
#   region          - Pacific | Indo-Pacific | Europe | Middle East | Global
#   countries       - list of countries the piece touches on
#   featured        - true to PIN the piece to the top of "What We're
#                     Publishing" on the homepage and the Our Work
#                     landing page. Only one piece should be featured
#                     at a time; if multiple, the most recent wins.
#   excerpt         - one-line dek
# ============================================================

